[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rsi-boot"
version = "0.1.1"
description = "Repo-bound MCP with recursive self-improvement (Harness-RSI) — memory follows the project across hosts, and the harness gets better as you use it."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "wenxing luo" },
]
keywords = ["mcp", "agent-memory", "harness", "self-improvement", "knowledge-base", "repo-bound", "cursor", "claude-code", "codex"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "aiosqlite>=0.19",
    "openai>=1.30",
    "mcp>=1.2",
    "cachetools>=5.3",
    "watchfiles>=0.21",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
# 向量加速后端（§2.3）：缺失时自动回退 brute（numpy 暴力余弦），不阻塞使用
vec = [
    "sqlite-vec>=0.1",
]
# Anthropic Provider（§1.1，P4.1）：仅使用 claude-* 模型时需要
anthropic = [
    "anthropic>=0.40",
]

[project.urls]
Homepage = "https://github.com/Apollo-lwx/rsi-boot"
Repository = "https://github.com/Apollo-lwx/rsi-boot"
Issues = "https://github.com/Apollo-lwx/rsi-boot/issues"

[project.scripts]
rsi = "rsi_boot.__main__:main"
rsi-boot = "rsi_boot.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rsi_boot"]

# 包内数据：src/rsi_boot/config/（default.yaml、intent_rules.yaml、templates/、skills/）
# 与 src/rsi_boot/migrations/（001_init.sql 等）随包分发，对应 Spec §11 的顶层 config/ 与 migrations/

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "eval_nightly: 全量算法评测（nightly，§12.6）；默认 PR 门槛不含此项",
]
testpaths = ["tests"]
