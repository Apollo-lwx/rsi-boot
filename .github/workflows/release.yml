name: release

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write # OIDC：PyPI trusted publishing + MCP Registry github-oidc 共用
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 发版前置闸门：tag、pyproject、server.json 三处版本必须一致，不一致直接失败
      - name: Verify tag matches pyproject and server.json versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          SRV=$(python3 -c "import json; print(json.load(open('server.json'))['version'])")
          SPKG=$(python3 -c "import json; print(json.load(open('server.json'))['packages'][0]['version'])")
          echo "tag=$TAG pyproject=$PKG server.json=$SRV server.json.pkg=$SPKG"
          [ "$TAG" = "$PKG" ] && [ "$TAG" = "$SRV" ] && [ "$TAG" = "$SPKG" ] \
            || { echo "::error::version mismatch: bump pyproject.toml and server.json to $TAG first"; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      # trusted publishing：无需在仓库存 token，需在 PyPI 项目设置里登记本 workflow（一次性）
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      # registry 会校验 PyPI 上对应版本的 README 含 mcp-name 标记（已永久写入 README.md）
      - name: Publish to official MCP Registry
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish
