- file: docs/contributing.md
  line: 143
  section: Releasing
  text: "Contributing\n## Releasing\n\n*This section is targeted at Starlette maintainers.*\n\nBefore releasing a new version,\
    \ create a pull request that includes:\n\n- **An update to the changelog**:\n    - We follow the format from [keepachangelog](https://keepachangelog.com/en/1.0.0/).\n\
    \    - [Compare](https://github.com/Kludex/starlette/compare/) `main` with the tag of the latest release, and list all\
    \ entries that are of interest to our users:\n        - Things that **must** go in the changelog: added, changed, deprecated\
    \ or removed features, and bug fixes.\n        - Things that **should not** go in the changelog: changes to documentation,\
    \ tests or tooling.\n        - Try sorting entries in descending order of impact / importance.\n        - Keep it concise\
    \ and to-the-point. \U0001F3AF\n- **A version bump**: see `__version__.py`.\n\nFor an example, see [#1600](https://github.com/Kludex/starlette/pull/1600).\n\
    \nOnce the release PR is merged, create a\n[new release](https://github.com/Kludex/starlette/releases/new) including:\n\
    \n- Tag version like `0.13.3`.\n- Release title `Version 0.13.3`\n- Description copied from the changelog.\n\nOnce created\
    \ this release will be automatically uploaded to PyPI."
- file: README.md
  line: 84
  section: Dependencies
  text: 'Starlette

    ## Dependencies


    Starlette only requires `anyio`, and the following are optional:


    * [`httpx2`][httpx2] - Required if you want to use the `TestClient`.

    * [`jinja2`][jinja2] - Required if you want to use `Jinja2Templates`.

    * [`opentelemetry-api`][opentelemetry-api] - Required for `OpenTelemetryMiddleware`.

    * [`python-multipart`][python-multipart] - Required if you want to support form parsing, with `request.form()`.

    * [`itsdangerous`][itsdangerous] - Required for `SessionMiddleware` support.

    * [`pyyaml`][pyyaml] - Required for `SchemaGenerator` support.


    You can install all of these with `pip install starlette[full]`.'
- file: README.md
  line: 122
  section: Modularity
  text: 'Starlette

    ## Modularity


    The modularity that Starlette is designed on promotes building reusable

    components that can be shared between any ASGI framework. This should enable

    an ecosystem of shared middleware and mountable applications.


    The clean API separation also means it''s easier to understand each component

    in isolation.


    ---


    <p align="center"><i>Starlette is <a href="https://github.com/Kludex/starlette/blob/main/LICENSE.md">BSD licensed</a>
    code.<br/>Designed & crafted with care.</i></br>&mdash; ⭐️ &mdash;</p>


    [asgi]: https://asgi.readthedocs.io/en/latest/

    [httpx2]: https://pypi.org/project/httpx2/

    [jinja2]: https://jinja.palletsprojects.com/

    [opentelemetry-api]: https://opentelemetry.io/docs/languages/python/api/

    [python-multipart]: https://multipart.fastapiexpert.com/

    [itsdangerous]: https://itsdangerous.palletsprojects.com/

    [sqlalchemy]: https://www.sqlalchemy.org

    [pyyaml]: https://pyyaml.org/wiki/PyYAMLDocumentation

    [techempower]: https://github.com/TechEmpower/FrameworkBenchmarks'
