  section: Instructions for contributors
  text: "Contributing\nInstructions for contributors\n-----------------------------\n\nIn order to make a clone of the GitHub_\
    \ repo: open the link and press the \"Fork\" button on the upper-right menu of the web page.\n\nI hope everybody knows\
    \ how to work with git and github nowadays :)\n\nWorkflow is pretty straightforward:\n\n  0. Make sure you are reading\
    \ the latest version of this document.\n     It can be found in the GitHub_ repo in the ``docs`` subdirectory.\n\n  1.\
    \ Clone the GitHub_ repo using the ``--recurse-submodules`` argument\n\n  2. Setup your machine with the required development\
    \ environment\n\n  3. Make a change\n\n  4. Make sure all tests passed\n\n  5. Add a file into the ``CHANGES`` folder\
    \ (see `Changelog update`_ for how).\n\n  6. Commit changes to your own aiohttp clone\n\n  7. Make a pull request from\
    \ the github page of your clone against the master branch\n\n  8. Optionally make backport Pull Request(s) for landing\
    \ a bug fix into released aiohttp versions.\n\n.. note::\n\n   The project uses *Squash-and-Merge* strategy for *GitHub\
    \ Merge* button.\n\n   Basically it means that there is **no need to rebase** a Pull Request against\n   *master* branch.\
    \ Just ``git merge`` *master* into your working copy (a fork) if\n   needed. The Pull Request is automatically squashed\
    \ into the single commit\n   once the PR is accepted.\n\n.. note::\n\n   GitHub issue and pull request threads are automatically\
    \ locked when there has\n   not been any recent activity for one year.  Please open a `new issue\n   <https://github.com/aio-libs/aiohttp/issues/new>`_\
    \ for related bugs.\n\n   If you feel like there are important points in the locked discussions,\n   please include those\
    \ excerpts into that new issue."
