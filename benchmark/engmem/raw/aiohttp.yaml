    \ on GitHub:*\n  :issue:`5357`.\n\n\n\n- Rejected multipart body parts whose ``Content-Length`` header is not a\n  plain\
    \ sequence of digits (e.g. ``+5``, ``-1``, ``1_0``), matching the\n  strictness of the main request parser per :rfc:`9110#section-8.6`\n\
    \  -- by :user:`dxbjavid`.\n\n\n  *Related issues and pull requests on GitHub:*\n  :issue:`12794`.\n\n\n\n- Fixed ``GunicornWebWorker``\
    \ endlessly reloading when app fails during startup -- by :user:`Dreamsorcerer`.\n\n\n  *Related issues and pull requests\
