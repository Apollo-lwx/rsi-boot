  section: Bug fixes
  text: "3.13.4 (2026-03-28)\nBug fixes\n---------\n\n- Fixed server hanging indefinitely when chunked transfer encoding chunk-size\n\
    \  does not match actual data length. The server now raises\n  ``TransferEncodingError`` instead of waiting forever for\
    \ data that will\n  never arrive -- by :user:`Fridayai700`.\n\n\n  *Related issues and pull requests on GitHub:*\n  :issue:`10596`.\n\
    \n\n\n- Fixed access log timestamps ignoring daylight saving time (DST) changes. The\n  previous implementation used :py:data:`time.timezone`\
    \ which is a constant and\n  does not reflect DST transitions -- by :user:`nightcityblade`.\n\n\n  *Related issues and\
    \ pull requests on GitHub:*\n  :issue:`11283`.\n\n\n\n- Fixed ``RuntimeError: An event loop is running`` error when using\
    \ ``aiohttp.GunicornWebWorker``\n  or ``aiohttp.GunicornUVLoopWebWorker`` on Python >=3.14.\n  -- by :user:`Tasssadar`.\n\
    \n\n  *Related issues and pull requests on GitHub:*\n  :issue:`11701`.\n\n\n\n- Fixed :exc:`ValueError` when creating\
    \ a TLS connection with ``ClientTimeout(total=0)`` by converting ``0`` to ``None`` before passing to ``ssl_handshake_timeout``\
    \ in :py:meth:`asyncio.loop.start_tls` -- by :user:`veeceey`.\n\n\n  *Related issues and pull requests on GitHub:*\n \
    \ :issue:`11859`.\n\n\n\n- Restored :py:meth:`~aiohttp.BodyPartReader.decode` as a synchronous method\n  for backward\
    \ compatibility. The method was inadvertently changed to async\n  in 3.13.3 as part of the decompression bomb security\
    \ fix. A new\n  :py:meth:`~aiohttp.BodyPartReader.decode_iter` method is now available\n  for non-blocking decompression\
    \ of large payloads using an async generator.\n  Internal aiohttp code uses the async variant to maintain security protections.\n\
    \n  Changed multipart processing chunk sizes from 64 KiB to 256KiB, to better\n  match aiohttp internals\n  -- by :user:`bdraco`\
    \ and :user:`Dreamsorcerer`.\n\n\n  *Related issues and pull requests on GitHub:*\n  :issue:`11898`.\n\n\n\n- Fixed false-positive\
    \ :py:class:`DeprecationWarning` for passing ``enable_cleanup_closed=True`` to :py:class:`~aiohttp.TCPConnector` specifically\
    \ on Python 3.12.7.\n  -- by :user:`Robsdedude`.\n\n\n  *Related issues and pull requests on GitHub:*\n  :issue:`11972`.\n\
    \n\n\n- Fixed _sendfile_fallback over-reading beyond requested count -- by :user:`bysiber`.\n\n\n  *Related issues and\
    \ pull requests on GitHub:*\n  :issue:`12096`.\n\n\n\n- Fixed digest auth dropping challenge fields with empty string\
    \ values -- by :user:`bysiber`.\n\n\n  *Related issues and pull requests on GitHub:*\n  :issue:`12097`.\n\n\n\n- ``ClientConnectorCertificateError.os_error``\
    \ no longer raises :exc:`AttributeError`\n  -- by :user:`themylogin`.\n\n\n  *Related issues and pull requests on GitHub:*\n\
    \  :issue:`12136`.\n\n\n\n- Adjusted pure-Python request header value validation to align with RFC 9110 control-character\
    \ handling, while preserving lax response parser behavior, and added regression tests for Host/header control-character\
    \ cases.\n  -- by :user:`rodrigobnogueira`.\n\n\n  *Related issues and pull requests on GitHub:*\n  :issue:`12231`.\n\n\
    \n\n- Rejected duplicate singleton headers (``Host``, ``Content-Type``,\n  ``Content-Length``, etc.) in the C extension\
    \ HTTP parser to match\n  the pure Python parser behaviour, preventing potential host-based\n  access control bypasses\
    \ via parser differentials\n  -- by :user:`rodrigobnogueira`.\n\n\n  *Related issues and pull requests on GitHub:*\n \
    \ :issue:`12240`.\n\n\n\n- Aligned the pure-Python HTTP request parser with the C parser by splitting\n  comma-separated\
    \ and repeated ``Connection`` header values for keep-alive,\n  close, and upgrade handling -- by :user:`rodrigobnogueira`.\n\
    \n\n  *Related issues and pull requests on GitHub:*\n  :issue:`12249`.\n\n\n\n\nImprov"
