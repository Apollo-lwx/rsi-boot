    \n\n  *Related issues and pull requests on GitHub:*\n  :issue:`12931`.\n\n\n\n- Fixed ``IndexError: string index out of\
    \ range`` in ``parse_content_disposition``\n  when a header parameter has an empty value (e.g. ``filename=``).\n  -- by\
    \ :user:`JSap0914`.\n\n\n  *Related issues and pull requests on GitHub:*\n  :issue:`12948`.\n\n\n\n- Fixed the ``sock_read``\
    \ timeout being re-armed on a keep-alive connection after\n  it had been returned to the pool. An idle pooled connection\
    \ could be left with a\n  pending read timeout that fired and poisoned it, so the next request reusing the\n  connection\
    \ failed immediately with :exc:`aiohttp.SocketTimeoutError`. The read\n  timeout is now only rescheduled when resuming\
    \ a transport that was actually\n  paused -- by :user:`daragok`.\n\n\n  *Related issues and pull requests on GitHub:*\n\
    \  :issue:`12953`, :issue:`12954`.\n\n\n\n- Fixed the client decompressing frames when ``permessage-deflate`` was not\
