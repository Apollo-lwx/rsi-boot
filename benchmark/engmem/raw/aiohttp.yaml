  section: Preconditions for running aiohttp test suite
  text: "Contributing\nPreconditions for running aiohttp test suite\n--------------------------------------------\n\nWe expect\
    \ you to use a python virtual environment to run our tests.\n\nThere are several ways to make a virtual environment.\n\
    \nIf you like to use *virtualenv* please run:\n\n.. code-block:: shell\n\n   $ cd aiohttp\n   $ virtualenv --python=`which\
    \ python3` venv\n   $ . venv/bin/activate\n\nFor standard python *venv*:\n\n.. code-block:: shell\n\n   $ cd aiohttp\n\
    \   $ python3 -m venv venv\n   $ . venv/bin/activate\n\nFor *virtualenvwrapper*:\n\n.. code-block:: shell\n\n   $ cd aiohttp\n\
    \   $ mkvirtualenv --python=`which python3` aiohttp\n\nThere are other tools like *pyvenv* but you know the rule of thumb\
    \ now: create a python3 virtual environment and activate it.\n\nAfter that please install libraries required for development:\n\
    \n.. code-block:: shell\n\n   $ make install-dev\n\n.. note::\n\n  For now, the development tooling depends on ``make``\
    \ and assumes an Unix OS If you wish to contribute to aiohttp from a Windows machine, the easiest way is probably to `configure\
    \ the WSL <https://docs.microsoft.com/en-us/windows/wsl/install-win10>`_ so you can use the same instructions. If it's\
    \ not possible for you or if it doesn't work, please contact us so we can find a solution together.\n\nInstall pre-commit\
    \ hooks:\n\n.. code-block:: shell\n\n   $ pre-commit install\n\n.. warning::\n\n  If you plan to use temporary ``print()``,\
    \ ``pdb`` or ``ipdb`` within the test suite, execute it with ``-s``\n  and without the parallel ``pytest-xdist`` workers\
    \ that are enabled by default:\n\n  .. code-block:: shell\n\n     $ pytest tests -s --numprocesses=0\n\n  in order to\
    \ run the tests without output capturing.\n\nCongratulations, you are ready to run the test suite!\n\n.. include:: ../vendor/README.rst"
