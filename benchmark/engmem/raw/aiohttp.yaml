    \  *Related issues and pull requests on GitHub:*\n  :issue:`13203`, :issue:`13249`.\n\n\n\n- Rejected control characters\
    \ in the request target in the pure-Python HTTP parser,\n  matching the llhttp-backed parser, which already refuses them\n\
    \  -- by :user:`arshsmith1`.\n\n\n  *Related issues and pull requests on GitHub:*\n  :issue:`13212`.\n\n\n\n- Stripped\
    \ the trailing whitespace from header values in the C HTTP parser,\n  so that it matches the pure-Python parser and :rfc:`9110#section-5.5`\n\
    \  -- by :user:`LuShadowX`.\n\n\n  *Related issues and pull requests on GitHub:*\n  :issue:`13246`.\n\n\n\n- Fixed the\
    \ WebSocket reader rejecting a compressed data frame with close code 1002 when a control frame arrived before the first\
    \ data frame (regression in 3.14.2) -- by :user:`Dreamsorcerer`.\n\n\n  *Related issues and pull requests on GitHub:*\n\
    \  :issue:`13274`.\n\n\n\n- Fixed internally retried requests sending a truncated body when the request\n  data was a\
    \ file object.\n\n\n  *Related issues and pull requests on GitHub:*\n  :issue:`13329`, :issue:`13330`.\n\n\n\n- Fixed\
    \ event loop state possibly being corrupted on Python 3.12+ -- by :user:`Dreamsorcerer`.\n\n\n  *Related issues and pull\
