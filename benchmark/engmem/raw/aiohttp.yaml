  section: PRs
  text: "AGENTS.md\n## PRs\n\n- **Prove it works before opening the PR**. This means:\n  - Relevant tests pass locally.\n\
    \  - New behaviour is covered by a test.\n  - Any parser/websocket related changes have been tested with Cython extensions\
    \ installed.\n- Use the shipped template at [`.github/PULL_REQUEST_TEMPLATE.md`](.github/PULL_REQUEST_TEMPLATE.md).\n\
    \  - A couple of sentences per section is plenty.\n  - Tick checklist boxes that apply; write `N/A` next to ones that\
    \ do not.\n  - First-time contributors add themselves to `CONTRIBUTORS.txt` (alphabetical by first name).\n- **Draft.**\
    \ Use `gh pr create --draft`.\n  - Every submission must be reviewed by a human before going out of draft; that review\
    \ is the operator's job, not the maintainers'.\n  - Do not mark ready or request reviewers yourself.\n- **Disclosure.**\
    \ One plain line at the bottom: `Drafted with <agent name and version>; reviewed by <human handle>.`\n- **No `Co-Authored-By:`**\
    \ LLM trailers in commits or PR body.\n- Agent run output (test logs) goes in a collapsed `<details>` block **below**\
    \ the template summary.\n\n**Commits**: Don't use conventional commits; match recent imperative subjects."
