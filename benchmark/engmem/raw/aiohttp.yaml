    \ ``autobahn`` tests -- by :user:`Dreamsorcerer`.\n\n\n  *Related issues and pull requests on GitHub:*\n  :issue:`12173`.\n\
    \n\n\n- Added a CI job to measure Cython coverage -- by :user:`Dreamsorcerer`.\n\n\n  *Related issues and pull requests\
    \ on GitHub:*\n  :issue:`12349`.\n\n\n\n- Disabled ``coverage`` and ``xdist`` by default to ease local development --\
    \ by :user:`Dreamsorcerer`.\n\n\n  *Related issues and pull requests on GitHub:*\n  :issue:`12364`.\n\n\n\n- Avoid installation\
    \ of backports.zstd on Python 3.14 in linting dependency set\n  -- by :user:`seifertm`.\n\n\n  *Related issues and pull\
    \ requests on GitHub:*\n  :issue:`12406`.\n\n\n\n- Added ``--durations=30`` to the benchmark CI run so the slowest tests\
    \ are reported when the job hits its timeout -- by :user:`aiolibsbot`.\n\n\n  *Related issues and pull requests on GitHub:*\n\
    \  :issue:`12562`.\n\n\n\n- Fixed two flakey ``test_middleware_uses_session_avoids_recursion_with_*`` tests\n  that hard\
    \ coded ``localhost`` in the inner middleware request; they now target\n  the bound server URL so happy eyeballs cannot\
    \ pick an unbound address on\n  Windows runners -- by :user:`bdraco`.\n\n\n  *Related issues and pull requests on GitHub:*\n\
    \  :issue:`12571`.\n\n\n\n- Restricted the ``isal`` test dependency to CPython, since\n  ``isal`` 1.8.0 stopped publishing\
    \ PyPy wheels and the source\n  build requires ``nasm``, which is not available on the CI\n  runners. The ``parametrize_zlib_backend``\
    \ fixture already\n  calls ``pytest.importorskip``, so PyPy continues to exercise\n  the ``zlib`` and ``zlib_ng`` backends\
    \ with no further\n  changes -- by :user:`bdraco`.\n\n\n  *Related issues and pull requests on GitHub:*\n  :issue:`12589`.\n\
    \n\n\n- Fixed a flakey ``test_tcp_connector_fingerprint_ok`` by aborting\n  the SSL shutdown on the test's TCP connector\
    \ before returning.\n  The graceful TLS close was occasionally outliving the test event\n  loop on one of the CI jobs,\
    \ and the teardown ``gc.collect()``\n  then surfaced the still-open transport as a\n  ``PytestUnraisableExceptionWarning``\
    \ -- by :user:`bdraco`.\n\n\n  *Related issues and pull requests on GitHub:*\n  :issue:`12592`.\n\n\n\n- Switched the\
    \ ``cibuildwheel`` build frontend to ``build[uv]`` so\n  that ``uv`` provisions every build-isolation virtual environment\n\
    \  in the wheel matrix, replacing the per-ABI ``pip`` resolve with a\n  roughly sub-second ``uv`` resolve\n  -- by :user:`bdraco`.\n\
    \n\n  *Related issues and pull requests on GitHub:*\n  :issue:`12595`.\n\n\n\n- Fixed flaky ``test_handler_returns_not_response``\
    \ and\n  ``test_handler_returns_none`` by routing ``loop.set_debug(True)``\n  through a new ``loop_debug_mode`` fixture\
    \ that disables debug\n  mode before the ``aiohttp_client`` fixture finalizes. Leaving\n  debug on through teardown let\
    \ PyPy 3.11's asyncio slow-callback\n  logger walk into ``Task.__repr__`` during connector close,\n  surfacing a spurious\
    \ ``RuntimeWarning: coroutine was never\n  awaited`` -- by :user:`bdraco`.\n\n\n  *Related issues and pull requests on\
    \ GitHub:*\n  :issue:`12603`.\n\n\n\n- Reduced runtime of several of the slowest unit tests\n  (decompress size-limit\
    \ payloads from 64 MiB to 2 MiB,\n  ``test_chunk_splits_after_pause`` chunk count from 50000\n  to 20000, and ``test_set_cookies_max_age``\
    \ sleep from 2\n  seconds to 1.1 seconds) without changing what they\n  exercise -- by :user:`bdraco`.\n\n\n  *Related\
    \ issues and pull requests on GitHub:*\n  :issue:`12606`.\n\n\n\n- Added a default 120-second per-test timeout via ``pytest-timeout``\
    \ so a\n  hung test surfaces by name in CI output instead of getting hidden behind\n  the job-level timeout added in :pr:`12619`.\
    \ The ``"
