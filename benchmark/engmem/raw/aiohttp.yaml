- file: AGENTS.md
  line: 61
  section: Threat model
  text: 'AGENTS.md

    ## Threat model


    `THREAT_MODEL.md` is a living document and should be revised when:


    - A CVE / GHSA is filed against aiohttp.

    - The parser configuration changes (llhttp lenient flags, size limits, version regex).

    - Any default referenced in the document changes (`client_max_size`, `client_max_fields`, `keepalive_timeout`, `max_redirects`,
    `limit`, `limit_per_host`, etc.).

    - The vendored llhttp version is bumped.

    - A public API surface is added or removed in `client.py` / `web_*.py` / `multipart.py`.


    When a chunk''s content is materially affected, update both the chunk and the relevant entries in §6.1–§6.4. The "Past
    advisories / hardening (recap)" subsection of each chunk is the audit trail for what has been verified-in-place.'
