  text: "3.14.0 (2026-06-01)\nBug fixes\n---------\n\n- Fixed ``ZLibDecompressor`` silently dropping data past the first\n\
    \  member when decompressing concatenated gzip/deflate streams. Each subsequent\n  member is now handed to a fresh decompressor,\
    \ matching the behaviour already\n  implemented for ZSTD multi-frame streams.\n\n  -- by :user:`Ashutosh-177`\n\n\n  *Related\
    \ issues and pull requests on GitHub:*\n  :issue:`7157`.\n\n\n\n- Improved the parser error message shown when TLS handshake\
    \ bytes are received on an HTTP port -- by :user:`puneetdixit200`.\n\n\n  *Related issues and pull requests on GitHub:*\n\
    \  :issue:`10142`.\n\n\n\n- Fixed the C parser failing to reject a response with a body when none was expected -- by :user:`Dreamsorcerer`.\n\
    \n\n  *Related issues and pull requests on GitHub:*\n  :issue:`10587`.\n\n\n\n- Fixed http parser not rejecting HTTP/1.1\
    \ requests that do not have valid Host header.\n  -- by :user:`Cycloctane`.\n\n\n  *Related issues and pull requests on\
    \ GitHub:*\n  :issue:`10600`.\n\n\n\n- Fixed misleading TLS-in-TLS warning being emitted when sending HTTPS requests through\
    \ an HTTP proxy. The warning now only fires when the proxy itself uses HTTPS, which is the only case where TLS-in-TLS\
    \ actually applies -- by :user:`wavebyrd`.\n\n\n  *Related issues and pull requests on GitHub:*\n  :issue:`10683`.\n\n\
    \n\n- Fixed ``AssertionError`` when the transport is ``None`` during WebSocket\n  preparation or file response sending\
    \ (e.g. when a client disconnects\n  immediately after connecting). A ``ConnectionResetError`` is now raised\n  instead\
    \ -- by :user:`agners`.\n\n\n  *Related issues and pull requests on GitHub:*\n  :issue:`11761`.\n\n\n\n- Fixed ad-hoc\
    \ cookies passed to individual requests not being sent when the session's cookie jar has ``unsafe=True`` and the target\
    \ URL uses an IP address, by copying the ``unsafe`` setting from the session's cookie jar to the temporary cookie jar\
    \ -- by :user:`Krishnachaitanyakc`.\n\n\n  *Related issues and pull requests on GitHub:*\n  :issue:`12011`.\n\n\n\n- Reset\
    \ the WebSocket heartbeat timer on inbound data to avoid false ping/pong timeouts while receiving large frames\n  -- by\
    \ :user:`hoffmang9`.\n\n\n  *Related issues and pull requests on GitHub:*\n  :issue:`12030`.\n\n\n\n- Switched :py:meth:`~aiohttp.CookieJar.save`\
    \ to use JSON format and\n  :py:meth:`~aiohttp.CookieJar.load` to try JSON first with a fallback to\n  a restricted pickle\
    \ unpickler -- by :user:`YuvalElbar6`.\n\n\n  *Related issues and pull requests on GitHub:*\n  :issue:`12091`.\n\n\n\n\
    - Fixed redirects with consumed non-rewindable request bodies to raise\n  :class:`aiohttp.ClientPayloadError` instead\
    \ of silently sending an empty body.\n\n\n  *Related issues and pull requests on GitHub:*\n  :issue:`12195`.\n\n\n\n-\
    \ Fixed zstd decompression failing with ``ClientPayloadError`` when the server\n  sends a response as multiple zstd frames\
    \ -- by :user:`josu-moreno`.\n\n\n  *Related issues and pull requests on GitHub:*\n  :issue:`12234`.\n\n\n\n- Fixed spurious\
    \ ``Future exception was never retrieved`` warning on disconnect during back-pressure -- by :user:`availov`.\n\n\n  *Related\
    \ issues and pull requests on GitHub:*\n  :issue:`12281`.\n\n\n\n- ``Cookiejar.save()`` now uses ``0x600`` permissions\
    \ to better protect them from being read by other users -- by :user:`digiscrypt`.\n\n\n  *Related issues and pull requests\
    \ on GitHub:*\n  :issue:`12312`.\n\n\n\n- Fixed a crash (:external+python:exc:`~http.cookies.CookieError`) in the cookie\
    \ parser when receiving cookies\n  containing ASCII control characters on CPython builds with the :cve:`2026-3644`\n \
    \ patch. The parser now gracefully skips cookies whose value contains control\n  characters instead of letting the exception\
    \ propagate -- by :user:`rodrigobnogueira`.\n\n\n  *Related issues and pull requests on GitHub:*\n  :issue:`12395`.\n\n\
    \n\n- Fixed digest authentication failing for requests whose path or query string contains percent-encoded reserved characters;\
    \ the digest signature now uses the encoded request-target that is sent on the wire instead of the decoded form -- by\
    \ :user:`bdraco`.\n\n\n  *Relate"
