    \n  \"An LLM wrote it\" is **not** an acceptable response to questions or critique.\n  **If you cannot explain and defend\
    \ the changes you submit, do not submit them** and open a high-quality bug report/feature request instead.\n\n- Accounts\
    \ that exercise bot-like behavior – like automated mass pull requests – will be permanently banned, whether they belong\
    \ to a human or not.\n\n- Do **not** post LLM-generated review comments – we can prompt LLMs ourselves should we desire\
    \ their wisdom.\n  Do **not** post summaries unless you've fact-checked them and take responsibility for 100% of their\
    \ content.\n  Remember that *all* LLM output *looks* **plausible**.\n  When using these tools, it's **your** responsibility\
    \ to ensure that it's also **correct** and has a reasonable signal-to-noise ratio.\n\n---"
- file: .github/SECURITY.md
  line: 1
  section: Vulnerability Disclosure
  text: '# Vulnerability Disclosure


    If you think you have found a potential security vulnerability in

    requests, please open a [draft Security Advisory](https://github.com/psf/requests/security/advisories/new)

    via GitHub. We will coordinate verification and next steps through

    that secure medium.


    If English is not your first language, please try to describe the

    problem and its impact to the best of your ability. For greater detail,

    please use your native language and we will try our best to translate it

    using online services.


    Please also include the code you used to find the problem and the

    shortest amount of code necessary to reproduce it.


    Please do not disclose this to anyone else. We will retrieve a CVE

    identifier if necessary and give you full credit under whatever name or

    alias you provide. We will only request an identifier when we have a fix

    and can publish it in a release.


    We will respect your privacy and will only publicize your involvement if

    you grant us permission.'
- file: .github/CONTRIBUTING.md
  line: 18
  section: Good Bug Reports
  text: "Contribution Guidelines\n## Good Bug Reports\n\nPlease be aware of the following things when filing bug reports:\n\
    \n1. Avoid raising duplicate issues. *Please* use the GitHub issue search feature\n   to check whether your bug report\
    \ or feature request has been mentioned in\n   the past. Duplicate bug reports and feature requests are a huge maintenance\n\
    \   burden on the limited resources of the project. If it is clear from your\n   report that you would have struggled\
    \ to find the original, that's ok, but\n   if searching for a selection of words in your issue title would have found\n\
    \   the duplicate then the issue will likely be closed extremely abruptly.\n2. When filing bug reports about exceptions\
    \ or tracebacks, please include the\n   *complete* traceback. Partial tracebacks, or just the exception text, are\n  \
    \ not helpful. Issues that do not contain complete tracebacks may be closed\n   without warning.\n3. Make sure you provide\
    \ a suitable amount of information to work with. This\n   means you should provide:\n\n   - Guidance on **how to reproduce\
    \ the issue**. Ideally, this should be a\n     *small* code sample that can be run immediately by the maintainers.\n \
    \    Failing that, let us know what you're doing, how often it happens, what\n     environment you're using, etc. Be thorough:\
    \ it prevents us needing to ask\n     further questions.\n   - Tell us **what you expected to happen**. When we run your\
    \ example code,\n     what are we expecting to happen? What does \"success\" look like for your\n     code?\n   - Tell\
    \ us **what actually happens**. It's not helpful for you to say \"it\n     doesn't work\" or \"it fails\". Tell us *how*\
    \ it fails: do you get an\n     exception? A hang? A non-200 status code? How was the actual result\n     different from\
    \ your expected result?\n   - Tell us **what version of Requests you're using**, and\n     **how you installed it**. Different\
    \ versions of Requests behave\n     differently and have different bugs, and some distributors of Requests\n     ship\
    \ patches on top of the code we supply.\n\n   If you do not provide all of these things, it will take us much longer to\n\
    \   fix your problem. If we ask you to clarify these and you never respond, we\n   will close your issue without fixing\
    \ it."
