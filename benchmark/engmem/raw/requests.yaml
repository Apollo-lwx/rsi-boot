  section: 2.31.0 (2023-05-22)
  text: "Release History\n2.31.0 (2023-05-22)\n-------------------\n\n**Security**\n- Versions of Requests between v2.3.0\
    \ and v2.30.0 are vulnerable to potential\n  forwarding of `Proxy-Authorization` headers to destination servers when\n\
    \  following HTTPS redirects.\n\n  When proxies are defined with user info (`https://user:pass@proxy:8080`), Requests\n\
    \  will construct a `Proxy-Authorization` header that is attached to the request to\n  authenticate with the proxy.\n\n\
    \  In cases where Requests receives a redirect response, it previously reattached\n  the `Proxy-Authorization` header\
    \ incorrectly, resulting in the value being\n  sent through the tunneled connection to the destination server. Users who\
    \ rely on\n  defining their proxy credentials in the URL are *strongly* encouraged to upgrade\n  to Requests 2.31.0+ to\
    \ prevent unintentional leakage and rotate their proxy\n  credentials once the change has been fully deployed.\n\n  Users\
    \ who do not use a proxy or do not supply their proxy credentials through\n  the user information portion of their proxy\
    \ URL are not subject to this\n  vulnerability.\n\n  Full details can be read in our [Github Security Advisory](https://github.com/psf/requests/security/advisories/GHSA-j8r2-6x86-q33q)\n\
    \  and [CVE-2023-32681](https://nvd.nist.gov/vuln/detail/CVE-2023-32681)."
