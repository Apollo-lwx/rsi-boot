    \ misnamed `InvalidSchema` and `MissingSchema`\n  exceptions. This is a temporary fix until exceptions can be renamed\n\
    \  (Schema->Scheme). (#6017)\n\n- Improved proxy parsing for proxy URLs missing a scheme. This will address\n  recent\
    \ changes to `urlparse` in Python 3.9+. (#5917)\n\n**Bugfixes**\n\n- Fixed defect in `extract_zipped_paths` which could\
    \ result in an infinite loop\n  for some paths. (#5851)\n\n- Fixed handling for `AttributeError` when calculating length\
    \ of files obtained\n  by `Tarfile.extractfile()`. (#5239)\n\n- Fixed urllib3 exception leak, wrapping `urllib3.exceptions.InvalidHeader`\
    \ with\n  `requests.exceptions.InvalidHeader`. (#5914)\n\n- Fixed bug where two Host headers were sent for chunked requests.\
    \ (#5391)\n\n- Fixed regression in Requests 2.26.0 where `Proxy-Authorization` was\n  incorrectly stripped from all requests\
    \ sent with `Session.send`. (#5924)\n\n- Fixed performance regression in 2.26.0 for hosts with a large number of\n  proxies\
    \ available in the environment. (#5924)\n\n- Fixed idna exception leak, wrapping `UnicodeError` with\n  `requests.exceptions.InvalidURL`\
    \ for URLs with a leading dot (.) in the\n  domain. (#5414)\n\n**Deprecations**\n\n- Requests support for Python 2.7 and\
    \ 3.6 will be ending in 2022. While we\n  don't have exact dates, Requests 2.27.x is likely to be the last release\n \
    \ series providing support."
