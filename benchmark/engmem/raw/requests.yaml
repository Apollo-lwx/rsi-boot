- file: HISTORY.md
  line: 1364
  section: 2.1.0 (2013-12-05)
  text: "Release History\n2.1.0 (2013-12-05)\n------------------\n\n-   Updated CA Bundle, of course.\n-   Cookies set on\
    \ individual Requests through a `Session` (e.g. via\n    `Session.get()`) are no longer persisted to the `Session`.\n\
    -   Clean up connections when we hit problems during chunked upload,\n    rather than leaking them.\n-   Return connections\
    \ to the pool when a chunked upload is successful,\n    rather than leaking it.\n-   Match the HTTPbis recommendation\
    \ for HTTP 301 redirects.\n-   Prevent hanging when using streaming uploads and Digest Auth when a\n    401 is received.\n\
    -   Values of headers set by Requests are now always the native string\n    type.\n-   Fix previously broken SNI support.\n\
    -   Fix accessing HTTP proxies using proxy authentication.\n-   Unencode HTTP Basic usernames and passwords extracted\
    \ from URLs.\n-   Support for IP address ranges for no\\_proxy environment variable\n-   Parse headers correctly when\
    \ users override the default `Host:`\n    header.\n-   Avoid munging the URL in case of case-sensitive servers.\n-   Looser\
    \ URL handling for non-HTTP/HTTPS urls.\n-   Accept unicode methods in Python 2.6 and 2.7.\n-   More resilient cookie\
    \ handling.\n-   Make `Response` objects pickleable.\n-   Actually added MD5-sess to Digest Auth instead of pretending\
    \ to like\n    last time.\n-   Updated internal urllib3.\n-   Fixed @Lukasa's lack of taste."
- file: HISTORY.md
  line: 1395
  section: 2.0.1 (2013-10-24)
  text: "Release History\n2.0.1 (2013-10-24)\n------------------\n\n-   Updated included CA Bundle with new mistrusts and\
    \ automated process\n    for the future\n-   Added MD5-sess to Digest Auth\n-   Accept per-file headers in multipart file\
    \ POST messages.\n-   Fixed: Don't send the full URL on CONNECT messages.\n-   Fixed: Correctly lowercase a redirect scheme.\n\
    -   Fixed: Cookies not persisted when set via functional API.\n-   Fixed: Translate urllib3 ProxyError into a requests\
    \ ProxyError\n    derived from ConnectionError.\n-   Updated internal urllib3 and chardet."
- file: HISTORY.md
  line: 1409
  section: 2.0.0 (2013-09-24)
  text: "Release History\n2.0.0 (2013-09-24)\n------------------\n\n**API Changes:**\n\n-   Keys in the Headers dictionary\
    \ are now native strings on all Python\n    versions, i.e. bytestrings on Python 2, unicode on Python 3.\n-   Proxy URLs\
    \ now *must* have an explicit scheme. A `MissingSchema`\n    exception will be raised if they don't.\n-   Timeouts now\
    \ apply to read time if `Stream=False`.\n-   `RequestException` is now a subclass of `IOError`, not\n    `RuntimeError`.\n\
    -   Added new method to `PreparedRequest` objects:\n    `PreparedRequest.copy()`.\n-   Added new method to `Session` objects:\
    \ `Session.update_request()`.\n    This method updates a `Request` object with the data (e.g. cookies)\n    stored on\
    \ the `Session`.\n-   Added new method to `Session` objects: `Session.prepare_request()`.\n    This method updates and\
    \ prepares a `Request` object, and returns the\n    corresponding `PreparedRequest` object.\n-   Added new method to `HTTPAdapter`\
    \ objects:\n    `HTTPAdapter.proxy_headers()`. This should not be called directly,\n    but improves the subclass interface.\n\
    -   `httplib.IncompleteRead` exceptions caused by incorrect chunked\n    encoding will now raise a Requests `ChunkedEncodingError`\
    \ instead.\n-   Invalid percent-escape sequences now cause a Requests `InvalidURL`\n    exception to be raised.\n-   HTTP\
    \ 208 no longer uses reason phrase `\"im_used\"`. Correctly uses\n    `\"already_reported\"`.\n-   HTTP 226 reason added\
    \ (`\"im_used\"`).\n\n**Bugfixes:**\n\n-   Vastly improved proxy support, including the CONNECT verb. Special\n    thanks\
    \ to the many contributors who worked towards this improvement.\n-   Cookies are now properly managed when 401 authentication\
    \ responses\n    are received.\n-   Chunked encoding fixes.\n-   Support for mixed case schemes.\n-   Better handling\
    \ of streaming downloads.\n-   Retrieve environment proxies from more locations.\n-   Minor cookies fixes.\n-   Improved\
    \ redirect behaviour.\n-   Improved streaming behaviour, particularly for compressed data.\n-   Miscellaneous small Python\
    \ 3 text encoding bugs.\n-   `.netrc` no longer overrides explicit auth.\n-   Cookies set by hooks are now correctly persisted\
    \ on Sessions.\n-   Fix problem with cookies that specify port numbers in their host\n    field.\n-   `BytesIO` can be\
    \ used to perform streaming uploads.\n-   More generous parsing of the `no_proxy` environment variable.\n-   Non-string\
    \ objects can be passed in data values alongside files."
- file: HISTORY.md
  line: 1484
  section: 1.2.0 (2013-03-31)
  text: "Release History\n1.2.0 (2013-03-31)\n------------------\n\n-   Fixed cookies on sessions and on requests\n-   Significantly\
    \ change how hooks are dispatched - hooks now receive\n    all the arguments specified by the user when making a request\
    \ so\n    hooks can make a secondary request with the same parameters. This is\n    especially necessary for authentication\
    \ handler authors\n-   certifi support was removed\n-   Fixed bug where using OAuth 1 with body `signature_type` sent\
    \ no\n    data\n-   Major proxy work thanks to @Lukasa including parsing of proxy\n    authentication from the proxy url\n\
    -   Fix DigestAuth handling too many 401s\n-   Update vendored urllib3 to include SSL bug fixes\n-   Allow keyword arguments\
    \ to be passed to `json.loads()` via the\n    `Response.json()` method\n-   Don't send `Content-Length` header by default\
    \ on `GET` or `HEAD`\n    requests\n-   Add `elapsed` attribute to `Response` objects to time how long a\n    request\
    \ took.\n-   Fix `RequestsCookieJar`\n-   Sessions and Adapters are now picklable, i.e., can be used with the\n    multiprocessing\
    \ library\n-   Update charade to version 1.0.3\n\nThe change in how hooks are dispatched will likely cause a great deal\
    \ of\nissues."
