  section: Generative AI / LLM Policy
  text: '# Generative AI / LLM Policy


    We appreciate that we can''t realistically police how you author your pull requests, which includes whether you employ
    large-language model (LLM)-based development tools.

    So, we don''t.


    However, due to both legal and human reasons, we have to establish boundaries.


    > [!CAUTION]

    > **TL;DR:**

    > - We take the responsibility for this project very seriously and we expect you to take your responsibility for your
    contributions seriously, too.

    >   This used to be a given, but it changed now that a pull request is just one prompt away.

    >

    > - Every contribution has to be backed by a human who unequivocally owns the copyright for all changes.

    >   No LLM bots in `Co-authored-by:`s.

    >

    > - DoS-by-slop leads to a permanent ban.

    >

    > - Absolutely **no** unsupervised agentic tools like OpenClaw.

    >

    > ---

    >

    > By submitting a pull request, you certify that:

    >

    > - You are the author of the contribution or have the legal right to submit it.

    > - You either hold the copyright to the changes or have explicit legal authorization to contribute them under this project''s
    license.

    > - You understand the code.

    > - You accept full responsibility for it.'
- file: .github/AI_POLICY.md
  line: 30
  section: Legal
  text: 'Generative AI / LLM Policy

    ## Legal


    There is ongoing legal uncertainty regarding the copyright status of LLM-generated works and their provenance.

    Since we do not have a formal [Contributor License Agreement](https://en.wikipedia.org/wiki/Contributor_license_agreement)
    (CLA), you retain your copyright to your changes to this project.


    Therefore, allowing contributions by LLMs has unpredictable consequences for the copyright status of this project – even
    when leaving aside possible copyright violations due to plagiarism.'
