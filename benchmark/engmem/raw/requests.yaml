  section: 2.19.0 (2018-06-12)
  text: "Release History\n2.19.0 (2018-06-12)\n-------------------\n\n**Improvements**\n\n-   Warn user about possible slowdown\
    \ when using cryptography version\n    &lt; 1.3.4\n-   Check for invalid host in proxy URL, before forwarding request\
    \ to\n    adapter.\n-   Fragments are now properly maintained across redirects. (RFC7231\n    7.1.2)\n-   Removed use\
    \ of cgi module to expedite library load time.\n-   Added support for SHA-256 and SHA-512 digest auth algorithms.\n- \
    \  Minor performance improvement to `Request.content`.\n-   Migrate to using collections.abc for 3.7 compatibility.\n\n\
    **Bugfixes**\n\n-   Parsing empty `Link` headers with `parse_header_links()` no longer\n    return one bogus entry.\n\
    -   Fixed issue where loading the default certificate bundle from a zip\n    archive would raise an `IOError`.\n-   Fixed\
    \ issue with unexpected `ImportError` on windows system which do\n    not support `winreg` module.\n-   DNS resolution\
    \ in proxy bypass no longer includes the username and\n    password in the request. This also fixes the issue of DNS queries\n\
    \    failing on macOS.\n-   Properly normalize adapter prefixes for url comparison.\n-   Passing `None` as a file pointer\
    \ to the `files` param no longer\n    raises an exception.\n-   Calling `copy` on a `RequestsCookieJar` will now preserve\
    \ the cookie\n    policy correctly.\n\n**Dependencies**\n\n-   We now support idna v2.7.\n-   We now support urllib3 v1.23."
