  line: 741
  section: 2.14.0 (2017-05-09)
  text: "Release History\n2.14.0 (2017-05-09)\n-------------------\n\n**Improvements**\n\n-   It is now possible to pass `no_proxy`\
    \ as a key to the `proxies`\n    dictionary to provide handling similar to the `NO_PROXY` environment\n    variable.\n\
    -   When users provide invalid paths to certificate bundle files or\n    directories Requests now raises `IOError`, rather\
    \ than failing at\n    the time of the HTTPS request with a fairly inscrutable certificate\n    validation error.\n- \
    \  The behavior of `SessionRedirectMixin` was slightly altered.\n    `resolve_redirects` will now detect a redirect by\
    \ calling\n    `get_redirect_target(response)` instead of directly querying\n    `Response.is_redirect` and `Response.headers['location']`.\
    \ Advanced\n    users will be able to process malformed redirects more easily.\n-   Changed the internal calculation of\
    \ elapsed request time to have\n    higher resolution on Windows.\n-   Added `win_inet_pton` as conditional dependency\
    \ for the `[socks]`\n    extra on Windows with Python 2.7.\n-   Changed the proxy bypass implementation on Windows: the\
    \ proxy bypass\n    check doesn't use forward and reverse DNS requests anymore\n-   URLs with schemes that begin with\
    \ `http` but are not `http` or\n    `https` no longer have their host parts forced to lowercase.\n\n**Bugfixes**\n\n-\
    \   Much improved handling of non-ASCII `Location` header values in\n    redirects. Fewer `UnicodeDecodeErrors` are encountered\
    \ on Python 2,\n    and Python 3 now correctly understands that Latin-1 is unlikely to\n    be the correct encoding.\n\
    -   If an attempt to `seek` file to find out its length fails, we now\n    appropriately handle that by aborting our content-length\n\
    \    calculations.\n-   Restricted `HTTPDigestAuth` to only respond to auth challenges made\n    on 4XX responses, rather\
    \ than to all auth challenges.\n-   Fixed some code that was firing `DeprecationWarning` on Python 3.6.\n-   The dismayed\
    \ person emoticon (`/o\\\\`) no longer has a big head. I'm\n    sure this is what you were all worrying about most.\n\n\
    **Miscellaneous**\n\n-   Updated bundled urllib3 to v1.21.1.\n-   Updated bundled chardet to v3.0.2.\n-   Updated bundled\
    \ idna to v2.5.\n-   Updated bundled certifi to 2017.4.17."
