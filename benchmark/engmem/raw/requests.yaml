  section: 2.26.0 (2021-07-13)
  text: "Release History\n2.26.0 (2021-07-13)\n-------------------\n\n**Improvements**\n\n- Requests now supports Brotli compression,\
    \ if either the `brotli` or\n  `brotlicffi` package is installed. (#5783)\n\n- `Session.send` now correctly resolves proxy\
    \ configurations from both\n  the Session and Request. Behavior now matches `Session.request`. (#5681)\n\n**Bugfixes**\n\
    \n- Fixed a race condition in zip extraction when using Requests in parallel\n  from zip archive. (#5707)\n\n**Dependencies**\n\
    \n- Instead of `chardet`, use the MIT-licensed `charset_normalizer` for Python3\n  to remove license ambiguity for projects\
    \ bundling requests. If `chardet`\n  is already installed on your machine it will be used instead of `charset_normalizer`\n\
    \  to keep backwards compatibility. (#5797)\n\n  You can also install `chardet` while installing requests by\n  specifying\
    \ `[use_chardet_on_py3]` extra as follows:\n\n    ```shell\n    pip install \"requests[use_chardet_on_py3]\"\n    ```\n\
    \n  Python2 still depends upon the `chardet` module.\n\n- Requests now supports `idna` 3.x on Python 3. `idna` 2.x will\
    \ continue to\n  be used on Python 2 installations. (#5711)\n\n**Deprecations**\n\n- The `requests[security]` extra has\
    \ been converted to a no-op install.\n  PyOpenSSL is no longer the recommended secure option for Requests. (#5867)\n\n\
    - Requests has officially dropped support for Python 3.5. (#5867)"
