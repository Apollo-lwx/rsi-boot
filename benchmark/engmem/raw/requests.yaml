- file: HISTORY.md
  line: 1043
  section: 2.8.0 (2015-10-05)
  text: "Release History\n2.8.0 (2015-10-05)\n------------------\n\n**Minor Improvements** (Backwards Compatible)\n\n-   Requests\
    \ now supports per-host proxies. This allows the `proxies`\n    dictionary to have entries of the form\n    `{'<scheme>://<hostname>':\
    \ '<proxy>'}`. Host-specific proxies will\n    be used in preference to the previously-supported scheme-specific\n   \
    \ ones, but the previous syntax will continue to work.\n-   `Response.raise_for_status` now prints the URL that failed\
    \ as part\n    of the exception message.\n-   `requests.utils.get_netrc_auth` now takes an `raise_errors` kwarg,\n   \
    \ defaulting to `False`. When `True`, errors parsing `.netrc` files\n    cause exceptions to be thrown.\n-   Change to\
    \ bundled projects import logic to make it easier to\n    unbundle requests downstream.\n-   Changed the default User-Agent\
    \ string to avoid leaking data on\n    Linux: now contains only the requests version.\n\n**Bugfixes**\n\n-   The `json`\
    \ parameter to `post()` and friends will now only be used\n    if neither `data` nor `files` are present, consistent with\
    \ the\n    documentation.\n-   We now ignore empty fields in the `NO_PROXY` environment variable.\n-   Fixed problem where\
    \ `httplib.BadStatusLine` would get raised if\n    combining `stream=True` with `contextlib.closing`.\n-   Prevented bugs\
    \ where we would attempt to return the same connection\n    back to the connection pool twice when sending a Chunked body.\n\
    -   Miscellaneous minor internal changes.\n-   Digest Auth support is now thread safe.\n\n**Updates**\n\n-   Updated urllib3\
    \ to 1.12."
