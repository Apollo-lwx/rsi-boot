  section: 2.32.0 (2024-05-20)
  text: "Release History\n2.32.0 (2024-05-20)\n-------------------\n\n**Security**\n- Fixed an issue where setting `verify=False`\
    \ on the first request from a\n  Session will cause subsequent requests to the _same origin_ to also ignore\n  cert verification,\
    \ regardless of the value of `verify`.\n  (https://github.com/psf/requests/security/advisories/GHSA-9wx4-h78v-vm56)\n\n\
    **Improvements**\n- `verify=True` now reuses a global SSLContext which should improve\n  request time variance between\
    \ first and subsequent requests. It should\n  also minimize certificate load time on Windows systems when using a Python\n\
    \  version built with OpenSSL 3.x. (#6667)\n- Requests now supports optional use of character detection\n  (`chardet`\
    \ or `charset_normalizer`) when repackaged or vendored.\n  This enables `pip` and other projects to minimize their vendoring\n\
    \  surface area. The `Response.text()` and `apparent_encoding` APIs\n  will default to `utf-8` if neither library is present.\
    \ (#6702)\n\n**Bugfixes**\n- Fixed bug in length detection where emoji length was incorrectly\n  calculated in the request\
    \ content-length. (#6589)\n- Fixed deserialization bug in JSONDecodeError. (#6629)\n- Fixed bug where an extra leading\
    \ `/` (path separator) could lead\n  urllib3 to unnecessarily reparse the request URI. (#6644)\n\n**Deprecations**\n\n\
    - Requests has officially added support for CPython 3.12 (#6503)\n- Requests has officially added support for PyPy 3.9\
    \ and 3.10 (#6641)\n- Requests has officially dropped support for CPython 3.7 (#6642)\n- Requests has officially dropped\
    \ support for PyPy 3.7 and 3.8 (#6641)\n\n**Documentation**\n- Various typo fixes and doc improvements.\n\n**Packaging**\n\
    - Requests has started adopting some modern packaging practices.\n  The source files for the projects (formerly `requests`)\
    \ is now located\n  in `src/requests` in the Requests sdist. (#6506)\n- Starting in Requests 2.33.0, Requests will migrate\
    \ to a PEP 517 build system\n  using `hatchling`. This should not impact the average user, but extremely old\n  versions\
    \ of packaging utilities may have issues with the new packaging format."
- file: HISTORY.md
