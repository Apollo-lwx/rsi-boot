- file: .github/CONTRIBUTING.md
  line: 151
  section: Releasing
  text: "Contributing\n## Releasing\n\n*This section is targeted at HTTPX maintainers.*\n\nBefore releasing a new version,\
    \ create a pull request that includes:\n\n- **An update to the changelog**:\n    - We follow the format from [keepachangelog](https://keepachangelog.com/en/1.0.0/).\n\
    \    - [Compare](https://github.com/encode/httpx/compare/) `master` with the tag of the latest release, and list all entries\
    \ that are of interest to our users:\n        - Things that **must** go in the changelog: added, changed, deprecated or\
    \ removed features, and bug fixes.\n        - Things that **should not** go in the changelog: changes to documentation,\
    \ tests or tooling.\n        - Try sorting entries in descending order of impact / importance.\n        - Keep it concise\
    \ and to-the-point. \U0001F3AF\n- **A version bump**: see `__version__.py`.\n\nFor an example, see [#1006](https://github.com/encode/httpx/pull/1006).\n\
    \nOnce the release PR is merged, create a\n[new release](https://github.com/encode/httpx/releases/new) including:\n\n\
    - Tag version like `0.13.3`.\n- Release title `Version 0.13.3`\n- Description copied from the changelog.\n\nOnce created\
    \ this release will be automatically uploaded to PyPI.\n\nIf something goes wrong with the PyPI job the release can be\
    \ published using the\n`scripts/publish` script."
- file: .github/CONTRIBUTING.md
  line: 180
  section: Development proxy setup
  text: "Contributing\n## Development proxy setup\n\nTo test and debug requests via a proxy it's best to run a proxy server\
    \ locally.\nAny server should do but HTTPCore's test suite uses\n[`mitmproxy`](https://mitmproxy.org/) which is written\
    \ in Python, it's fully\nfeatured and has excellent UI and tools for introspection of requests.\n\nYou can install `mitmproxy`\
    \ using `pip install mitmproxy` or [several\nother ways](https://docs.mitmproxy.org/stable/overview-installation/).\n\n\
    `mitmproxy` does require setting up local TLS certificates for HTTPS requests,\nas its main purpose is to allow developers\
    \ to inspect requests that pass through\nit. We can set them up follows:\n\n1. [`pip install trustme-cli`](https://github.com/sethmlarson/trustme-cli/).\n\
    2. `trustme-cli -i example.org www.example.org`, assuming you want to test\nconnecting to that domain, this will create\
    \ three files: `server.pem`,\n`server.key` and `client.pem`.\n3. `mitmproxy` requires a PEM file that includes the private\
    \ key and the\ncertificate so we need to concatenate them:\n`cat server.key server.pem > server.withkey.pem`.\n4. Start\
    \ the proxy server `mitmproxy --certs server.withkey.pem`, or use the\n[other mitmproxy commands](https://docs.mitmproxy.org/stable/)\
    \ with different\nUI options.\n\nAt this point the server is ready to start serving requests, you'll need to\nconfigure\
    \ HTTPX as described in the\n[proxy section](https://www.python-httpx.org/advanced/#http-proxying) and\nthe [SSL certificates\
    \ section](https://www.python-httpx.org/advanced/#ssl-certificates),\nthis is where our previously generated `client.pem`\
    \ comes in:\n\n```\nimport httpx\n\nssl_context = httpx.SSLContext()\nssl_context.load_verify_locations(\"/path/to/client.pem\"\
    )\n\nwith httpx.Client(proxy=\"http://127.0.0.1:8080/\", ssl_context=ssl_context) as client:\n    response = client.get(\"\
    https://example.org\")\n    print(response.status_code)  # should print 200\n```\n\nNote, however, that HTTPS requests\
    \ will only succeed to the host specified\nin the SSL/TLS certificate we generated, HTTPS requests to other hosts will\n\
    raise an error like:\n\n```\nssl.SSLCertVerificationError: [SSL: CERTIFICATE_VERIFY_FAILED] certificate\nverify failed:\
    \ Hostname mismatch, certificate is not valid for\n'duckduckgo.com'. (_ssl.c:1108)\n```\n\nIf you want to make requests\
    \ to more hosts you'll need to regenerate the\ncertificates and include all the hosts you intend to connect to in the\n\
    seconds step, i.e.\n\n`trustme-cli -i example.org www.example.org duckduckgo.com www.duckduckgo.com`"
