  section: Summary
  text: "Generative AI / LLM Policy\n## Summary\n\nIn practice, this means:\n\n- Pull requests that have an LLM product listed\
    \ as co-author can't be merged and will be closed without further discussion.\n  We cannot risk the copyright status of\
    \ this project.\n\n  If you used LLM tools during development, you may still submit – but you must remove any LLM co-author\
    \ tags and take full ownership of every line.\n\n- By submitting a pull request, you take full technical and legal responsibility\
    \ for the contents of the pull request and promise that you hold the copyright for the changes submitted.\n\n  \"An LLM\
    \ wrote it\" is *not* an acceptable response to questions or critique.\n  If you cannot explain and defend the changes\
    \ you submit, do not submit them and open a high-quality bug report or feature request instead.\n\n- Accounts that exercise\
    \ bot-like behavior – like automated mass pull requests – will be permanently banned, whether they belong to a human or\
    \ not.\n\n- LLM-generated comments must be concise and accurate, and you must be prepared to stand by them.\n  Do not\
    \ post summaries unless you are certain that they add value to the discussion.\n  Remember that all LLM output *looks*\
    \ plausible.\n  When using these tools, it's your responsibility to ensure that the output is correct, and useful.\n\n\
    - Remember that LLM generated content is generally easier for you to produce, but *harder* for others to read, review\
    \ or interpret.\n  Prioritising your time over that of others is contrary to the project's code of conduct.\n  Verbose,\
    \ repetitive, or off topic comments may be marked as spam."
