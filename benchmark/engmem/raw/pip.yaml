- file: NEWS.rst
  line: 795
  section: Bug Fixes
  text: "24.2 (2024-07-28)\nBug Fixes\n---------\n\n- Set ``no_color`` to global ``rich.Console`` instance. (`#11045 <https://github.com/pypa/pip/issues/11045>`_)\n\
    - Fix resolution to respect ``--python-version`` when checking ``Requires-Python``. (`#12216 <https://github.com/pypa/pip/issues/12216>`_)\n\
    - Perform hash comparisons in a case-insensitive manner. (`#12680 <https://github.com/pypa/pip/issues/12680>`_)\n- Avoid\
    \ ``dlopen`` failure for glibc detection in musl builds (`#12716 <https://github.com/pypa/pip/issues/12716>`_)\n- Avoid\
    \ keyring logging crashes when pip is run in verbose mode. (`#12751 <https://github.com/pypa/pip/issues/12751>`_)\n- Fix\
    \ finding hardlink targets in tar files with an ignored top-level directory. (`#12781 <https://github.com/pypa/pip/issues/12781>`_)\n\
    - Improve pip install performance by only creating required parent\n  directories once, instead of before extracting every\
    \ file in the wheel. (`#12782 <https://github.com/pypa/pip/issues/12782>`_)\n- Improve pip install performance by calculating\
    \ installed packages printout\n  in linear time instead of quadratic time. (`#12791 <https://github.com/pypa/pip/issues/12791>`_)"
