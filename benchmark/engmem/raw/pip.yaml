- file: AI_POLICY.md
  line: 37
  section: Human
  text: 'Generative AI / LLM Policy

    ## Human


    As the makers of software that is used by millions of people worldwide and with a reputation for high-quality maintenance,
    we take our responsibility to our users very seriously.

    No matter what LLM vendors or boosters on LinkedIn tell you, we have to manually review every change before merging, because
    it''s our responsibility to keep the project stable.


    Please understand that by opening low-quality pull requests you''re not helping anyone.

    Worse, you''re [poisoning the open source ecosystem](https://lwn.net/Articles/1058266/) that was precarious even before
    the arrival of LLM tools.

    Having to wade through plausible-looking-but-low-quality pull requests and trying to determine which ones are legit is
    extremely demoralizing and has already burned out many good maintainers.


    In particular, note that [code reviews are a social process](https://blog.glyph.im/2026/03/what-is-code-review-for.html)
    and are *not* intended

    to catch bugs in PRs created by an LLM. If you submit a pull request, we expect you to engage with reviewers and learn
    from the review, not

    simply update the prompt that generated the PR and regenerate the code.


    Put bluntly, we have no time or interest to become part of your vibe coding loop where you drop LLM slop at our door,
    we spend time and energy to review it, and you just feed it back into the LLM for another iteration.


    This dynamic is especially pernicious because it poisons the well for mentoring new contributors which we are committed
    to.'
- file: SECURITY.md
  line: 3
  section: Reporting a Vulnerability
  text: 'Security Policy

    ## Reporting a Vulnerability


    Please read the guidelines on reporting security issues [on the

    official website](https://www.python.org/dev/security/) for

    instructions on how to report a security-related problem to

    the Python Security Response Team responsibly.


    To reach the response team, email `security at python dot org`.


    Pip relies on the Python Security Response Team (PSRT) to triage

    and respond to security reports. PSRT members balance security

    work against many other responsibilities, so please be thoughtful

    about the time and attention your report requires. Reports that

    repeatedly disregard this policy may be rejected regardless of

    technical merit.'
- file: SECURITY.md
  line: 19
  section: Wheel installation
  text: 'Security Policy

    ## Wheel installation


    Pip downloads a wheel

    ([binary distribution](https://packaging.python.org/en/latest/specifications/binary-distribution-format/))

    by saving it as a file in the target directory, and installs a

    wheel by unpacking it into the target environment.


    Because Python''s import system is dynamic, pip cannot guarantee that

    installing a wheel will not execute third-party code.


    Unexpected execution of wheel code or writes outside the target

    directory should still be reported. Whether a report identifies a

    pip vulnerability depends on the cause.'
