    \ a Python module\n  during installation. (`#13364 <https://github.com/pypa/pip/issues/13364>`_)\n- Names in dependency\
    \ group includes are now normalized before lookup, which\n  fixes incorrect ``Dependency group '...' not found`` errors.\
    \ (`#13372 <https://github.com/pypa/pip/issues/13372>`_)"
- file: NEWS.rst
  line: 586
  section: Bug Fixes
  text: "25.1 (2025-04-26)\nBug Fixes\n---------\n\n- When using the ``importlib.metadata`` backend (the default on Python\
    \ 3.11+),\n  ``pip list`` does not show installed egg distributions more than once anymore.\n  Additionally, egg distributions\
    \ whose parent directory was in ``sys.path`` but\n  the egg themselves were not in ``sys.path`` are not detected anymore.\
    \ (`#12308 <https://github.com/pypa/pip/issues/12308>`_)\n- Disable Git and SSH prompts when ``--no-input`` is passed.\
    \ (`#12718 <https://github.com/pypa/pip/issues/12718>`_)\n- Gracefully handle Windows registry access errors while guessing\
    \ the MIME type of a file. (`#12769 <https://github.com/pypa/pip/issues/12769>`_)\n- Support multiple global configuration\
    \ paths returned by ``platformdirs`` on MacOS. (`#12903 <https://github.com/pypa/pip/issues/12903>`_)\n- Resolvelib 1.1.0\
    \ fixes a known issue where pip would report a\n  ResolutionImpossible error even though there is a valid solution.\n\
    \  However, some very complex dependency resolutions that previously\n  resolved may resolve slower or fail with an ResolutionTooDeep\
    \ error. (`#13001 <https://github.com/pypa/pip/issues/13001>`_)\n- Show the correct path to the interpreter also when\
    \ it's a symlink in a venv in the pip upgrade prompt. (`#13156 <https://github.com/pypa/pip/issues/13156>`_)\n- Parse\
    \ wheel filenames according to `binary distribution format specification\n  <https://packaging.python.org/en/latest/specifications/binary-distribution-format/#file-format>`_.\n\
    \  When a filename doesn't match the spec a deprecation warning is emitted and the\n  filename is parsed using the old\
    \ method. (`#13229 <https://github.com/pypa/pip/issues/13229>`_)\n- While resolving dependencies prefer if any of the\
    \ known requirements are\n  \"direct\", e.g. points to an explicit URL. (`#13244 <https://github.com/pypa/pip/issues/13244>`_)\n\
    - When choosing a preferred requirement for resolving dependencies\n  do not consider a specifier with a * in it, e.g.\
    \ \"==1.*\", to be a\n  pinned specifier. (`#13252 <https://github.com/pypa/pip/issues/13252>`_)\n- Fix a regression that\
    \ causes dependencies to be checked *before* ``Requires-Python``\n  project metadata is checked, leading to wasted cycles\
    \ when the Python version is\n  unsupported. (`#13270 <https://github.com/pypa/pip/issues/13270>`_)\n- Don't require the\
    \ ``wheel`` library to be installed to use ``--no-use-pep517``, any more. (`#13330 <https://github.com/pypa/pip/issues/13330>`_)\n\
    - Fix regression that suppressed errors indicating which packages were ignored\n  due to incompatible ``requires-python``\
    \ metadata. (`#13333 <https://github.com/pypa/pip/issues/13333>`_)\n- Fix fish shell completion when commandline contains\
    \ multiple commands. (`#9727 <https://github.com/pypa/pip/issues/9727>`_)"
