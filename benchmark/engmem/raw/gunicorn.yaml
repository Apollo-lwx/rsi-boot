- file: CONTRIBUTING.md
  line: 9
  section: Pull requests are always welcome
  text: 'Contributing to Gunicorn > Contribution guidelines

    ### Pull requests are always welcome


    We are always thrilled to receive pull requests, and do our best to

    process them as fast as possible. Not sure if that typo is worth a pull

    request? Do it! We will appreciate it.


    If your pull request is not accepted on the first try, don''t be

    discouraged! If there''s a problem with the implementation, hopefully you

    received feedback on what to improve.


    We''re trying very hard to keep Gunicorn lean and focused. We don''t want it

    to do everything for everybody. This means that we might decide against

    incorporating a new feature. However, there might be a way to implement

    that feature *on top of* Gunicorn.'
- file: CONTRIBUTING.md
  line: 37
  section: Check for existing discussions first!
  text: 'Contributing to Gunicorn > Contribution guidelines

    ### Check for existing discussions first!


    Please take a moment to check that a discussion or issue doesn''t already exist

    documenting your bug report or improvement proposal. If it does, it

    never hurts to add a quick "+1" or "I have this problem too". This will

    help prioritize the most common problems and requests.'
- file: CONTRIBUTING.md
  line: 45
  section: Conventions
  text: "Contributing to Gunicorn > Contribution guidelines\n### Conventions\n\nDon't comment on closed issues or PRs, instead\
    \ open a new issue and link it to\nthe old one.\n\nFork the repo and make changes on your fork in a feature branch:\n\n\
    - If it's a bugfix branch, name it XXX-something where XXX is the number\n  of the issue\n- If it's a feature branch,\
    \ create an enhancement issue to announce your\n  intentions, and name it XXX-something where XXX is the number of the\n\
    issue.\n\nSubmit unit tests for your changes. Python has a great test framework built\nin; use it! Take a look at existing\
    \ tests for inspiration. Run the full\ntest suite on your branch before submitting a pull request.\n\nMake sure you include\
    \ relevant updates or additions to documentation\nwhen creating or modifying features.\n\nIf you are adding a new configuration\
    \ option or updating an existing one,\nplease do it in `gunicorn/config.py`, then run `mkdocs build` to update\n`docs/content/reference/settings.md`.\n\
    \nWrite clean code.\n\nPull requests descriptions should be as clear as possible and include a\nreference to all the issues\
    \ that they address.\n\nCode review comments may be added to your pull request. Discuss, then\nmake the suggested modifications\
    \ and push additional commits to your\nfeature branch. Be sure to post a comment after pushing. The new commits\nwill\
    \ show up in the pull request automatically, but the reviewers will\nnot be notified unless you comment.\n\nBefore the\
    \ pull request is merged, make sure that you squash your\ncommits into logical units of work using `git rebase -i` and\
    \ `git push\n-f`. After every commit the test suite should be passing. Include\ndocumentation changes in the same commit\
    \ so that a revert would remove\nall traces of the feature or fix.\n\nCommits that fix or close an issue should include\
    \ a reference like\n`Closes #XXX` or `Fixes #XXX`, which will automatically close the issue\nwhen merged.\n\nAdd your\
    \ name to the THANKS file, but make sure the list is sorted and\nyour name and email address match your git configuration.\
    \ The THANKS\nfile is regenerated occasionally from the git commit history, so a\nmismatch may result in your changes\
    \ being overwritten."
- file: CONTRIBUTING.md
  line: 154
  section: How can I become a maintainer?
  text: 'Contributing to Gunicorn > Decision process

    ### How can I become a maintainer?


    * Step 1: learn the component inside out

    * Step 2: make yourself useful by contributing code, bugfixes, support etc.

    * Step 3: volunteer on our [Libera Chat](https://libera.chat/) irc channel [#gunicorn](https://web.libera.chat/?channels=#gunicorn)


    Don''t forget: being a maintainer is a time investment. Make sure you

    will have time to make yourself available.  You don''t have to be a

    maintainer to make a difference on the project!'
