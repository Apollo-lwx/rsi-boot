- file: README.md
  line: 128
  section: Installation
  text: '## Installation


    First, [install `uv`](https://docs.astral.sh/uv/getting-started/installation/), and then add FastAPI to your project:


    <div class="termy">


    ```console

    $ uv add "fastapi[standard]"


    ---> 100%

    ```


    </div>


    **Note**: Make sure you put `"fastapi[standard]"` in quotes to ensure it works in all terminals.


    If you prefer to use `pip`, install `fastapi[standard]` inside a virtual environment. See the [installation guide](tutorial/#install-fastapi)
    for the alternative steps.'
- file: README.md
  line: 237
  section: Check it
  text: 'Example

    ### Check it


    Open your browser at [http://127.0.0.1:8000/items/5?q=somequery](http://127.0.0.1:8000/items/5?q=somequery).


    You will see the JSON response as:


    ```JSON

    {"item_id": 5, "q": "somequery"}

    ```


    You already created an API that:


    * Receives HTTP requests in the _paths_ `/` and `/items/{item_id}`.

    * Both _paths_ take `GET` <em>operations</em> (also known as HTTP _methods_).

    * The _path_ `/items/{item_id}` has a _path parameter_ `item_id` that should be an `int`.

    * The _path_ `/items/{item_id}` has an optional `str` _query parameter_ `q`.'
- file: README.md
  line: 270
  section: Example upgrade
  text: "## Example upgrade\n\nNow modify the file `main.py` to receive a body from a `PUT` request.\n\nDeclare the body using\
    \ standard Python types, thanks to Pydantic.\n\n```Python hl_lines=\"2  7-10 23-25\"\nfrom fastapi import FastAPI\nfrom\
    \ pydantic import BaseModel\n\napp = FastAPI()\n\n\nclass Item(BaseModel):\n    name: str\n    price: float\n    is_offer:\
    \ bool | None = None\n\n\n@app.get(\"/\")\ndef read_root():\n    return {\"Hello\": \"World\"}\n\n\n@app.get(\"/items/{item_id}\"\
    )\ndef read_item(item_id: int, q: str | None = None):\n    return {\"item_id\": item_id, \"q\": q}\n\n\n@app.put(\"/items/{item_id}\"\
    )\ndef update_item(item_id: int, item: Item):\n    return {\"item_name\": item.name, \"item_id\": item_id}\n```\n\nThe\
    \ `fastapi dev` server should reload automatically."
- file: README.md
  line: 490
  section: '`standard` Dependencies'
  text: "Dependencies\n### `standard` Dependencies\n\nWhen you install FastAPI with `uv add \"fastapi[standard]\"` it comes\
    \ with the `standard` group of optional dependencies:\n\nUsed by Pydantic:\n\n* [`email-validator`](https://github.com/JoshData/python-email-validator)\
    \ - for email validation.\n\nUsed by Starlette:\n\n* [`httpx2`](https://pydantic.dev/docs/httpx2/) (or `httpx`) - Used\
    \ by the `TestClient`.\n* [`jinja2`](https://jinja.palletsprojects.com) - Required if you want to use the default template\
    \ configuration.\n* [`python-multipart`](https://github.com/Kludex/python-multipart) - Required if you want to support\
    \ form <dfn title=\"converting the string that comes from an HTTP request into Python data\">\"parsing\"</dfn>, with `request.form()`.\n\
    \nUsed by FastAPI:\n\n* [`uvicorn`](https://uvicorn.dev) - for the server that loads and serves your application. This\
    \ includes `uvicorn[standard]`, which includes some dependencies (e.g. `uvloop`) needed for high performance serving.\n\
    * `fastapi-cli[standard]` - to provide the `fastapi` command.\n    * This includes `fastapi-cloud-cli`, which allows you\
    \ to deploy your FastAPI application to [FastAPI Cloud](https://fastapicloud.com)."
- file: README.md
  line: 518
  section: Additional Optional Dependencies
  text: 'Dependencies

    ### Additional Optional Dependencies


    There are some additional dependencies you might want to install.


    Additional optional Pydantic dependencies:


    * [`pydantic-settings`](https://pydantic.dev/docs/validation/latest/concepts/pydantic_settings/) - for settings management.

    * [`pydantic-extra-types`](https://github.com/pydantic/pydantic-extra-types) - for extra types to be used with Pydantic.


    Additional optional FastAPI dependencies:


    * [`orjson`](https://github.com/ijl/orjson) - Required if you want to use `ORJSONResponse`.

    * [`ujson`](https://github.com/ultrajson/ultrajson) - Required if you want to use `UJSONResponse`.'
