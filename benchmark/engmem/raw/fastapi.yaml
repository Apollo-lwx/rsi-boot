- file: README.md
  line: 148
  section: Create it
  text: "Example\n### Create it\n\nCreate a file `main.py` with:\n\n```Python\nfrom fastapi import FastAPI\n\napp = FastAPI()\n\
    \n\n@app.get(\"/\")\ndef read_root():\n    return {\"Hello\": \"World\"}\n\n\n@app.get(\"/items/{item_id}\")\ndef read_item(item_id:\
    \ int, q: str | None = None):\n    return {\"item_id\": item_id, \"q\": q}\n```\n\n<details markdown=\"1\">\n<summary>Or\
    \ use <code>async def</code>...</summary>\n\nIf your code uses `async` / `await`, use `async def`:\n\n```Python hl_lines=\"\
    7  12\"\nfrom fastapi import FastAPI\n\napp = FastAPI()\n\n\n@app.get(\"/\")\nasync def read_root():\n    return {\"Hello\"\
    : \"World\"}\n\n\n@app.get(\"/items/{item_id}\")\nasync def read_item(item_id: int, q: str | None = None):\n    return\
    \ {\"item_id\": item_id, \"q\": q}\n```\n\n**Note**:\n\nIf you don't know, check the _\"In a hurry?\"_ section about [`async`\
    \ and `await` in the docs](https://fastapi.tiangolo.com/async/#in-a-hurry).\n\n</details>"
- file: README.md
  line: 330
  section: Recap
  text: "Example upgrade\n### Recap\n\nIn summary, you declare **once** the types of parameters, body, etc. as function parameters.\n\
    \nYou do that with standard modern Python types.\n\nYou don't have to learn a new syntax, the methods or classes of a\
    \ specific library, etc.\n\nJust standard **Python**.\n\nFor example, for an `int`:\n\n```Python\nitem_id: int\n```\n\n\
    or for a more complex `Item` model:\n\n```Python\nitem: Item\n```\n\n...and with that single declaration you get:\n\n\
    * Editor support, including:\n    * Completion.\n    * Type checks.\n* Validation of data:\n    * Automatic and clear\
    \ errors when the data is invalid.\n    * Validation even for deeply nested JSON objects.\n* <dfn title=\"also known as:\
    \ serialization, parsing, marshalling\">Conversion</dfn> of input data: coming from the network to Python data and types.\
    \ Reading from:\n    * JSON.\n    * Path parameters.\n    * Query parameters.\n    * Cookies.\n    * Headers.\n    * Forms.\n\
    \    * Files.\n* <dfn title=\"also known as: serialization, parsing, marshalling\">Conversion</dfn> of output data: converting\
    \ from Python data and types to network data (as JSON):\n    * Convert Python types (`str`, `int`, `float`, `bool`, `list`,\
    \ etc).\n    * `datetime` objects.\n    * `UUID` objects.\n    * Database models.\n    * ...and many more.\n* Automatic\
    \ interactive API documentation, including 2 alternative user interfaces:\n    * Swagger UI.\n    * ReDoc.\n\n---\n\n\
    Coming back to the previous code example, **FastAPI** will:\n\n* Validate that there is an `item_id` in the path for `GET`\
    \ and `PUT` requests.\n* Validate that the `item_id` is of type `int` for `GET` and `PUT` requests.\n    * If it is not,\
    \ the client will see a useful, clear error.\n* Check if there is an optional query parameter named `q` (as in `http://127.0.0.1:8000/items/foo?q=somequery`)\
    \ for `GET` requests.\n    * As the `q` parameter is declared with `= None`, it is optional.\n    * Without the `None`\
    \ it would be required (as is the body in the case with `PUT`).\n* For `PUT` requests to `/items/{item_id}`, read the\
    \ body as JSON:\n    * Check that it has a required attribute `name` that should be a `str`.\n    * Check that it has\
    \ a required attribute `price` that has to be a `float`.\n    * Check that it has an optional attribute `is_offer`, that\
    \ should be a `bool`, if present.\n    * All this would also work for deeply nested JSON objects.\n* Convert from and\
    \ to JSON automatically.\n* Document everything with OpenAPI, that can be used by:\n    * Interactive documentation systems.\n\
    \    * Automatic client code generation systems, for many languages.\n* Provide 2 interactive documentation web interfaces\
    \ directly.\n\n---\n\nWe just scratched the surface, but you already get the idea of how it all works.\n\nTry changing\
    \ the line with:\n\n```Python\n    return {\"item_name\": item.name, \"item_id\": item_id}\n```\n\n...from:\n\n```Python\n\
    \        ... \"item_name\": item.name ...\n```\n\n...to:\n\n```Python\n        ... \"item_price\": item.price ...\n```\n\
    \n...and see how your editor will auto-complete the attributes and know their types:\n\n![editor support](https://fastapi.tiangolo.com/img/vscode-completion.png)\n\
    \nFor a more complete example including more features, see the <a href=\"https://fastapi.tiangolo.com/tutorial/\">Tutorial\
    \ - User Guide</a>.\n\n**Spoiler alert**: the tutorial - user guide includes:\n\n* Declaration of **parameters** from\
    \ other different places such as: **headers**, **cookies**, **form fields** and **files**.\n* How to set **validation\
    \ constraints** such as `maximum_length` or `regex`.\n* A very powerful and easy to use **<dfn title=\"also known as components,\
    \ resources, providers, services, injectables\">Dependency Injection</dfn>** system.\n* Security and authentication, including\
    \ support for **OAuth2** with **JWT tokens** and **HTTP Basic** auth.\n* More advanced (but equally easy) techniques for\
