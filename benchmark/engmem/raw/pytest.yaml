  text: 'pytest for enterprise

    Security

    ^^^^^^^^


    If you have found an issue that you believe is a security vulnerability, please do not create an issue -- instead, report
    it via a `new security advisory <https://github.com/pytest-dev/pytest/security/advisories/new>`__.'
