    \nHere is a simple overview, with pytest-specific bits:\n\n#. Fork the\n   `pytest GitHub repository <https://github.com/pytest-dev/pytest>`__.\
    \  It's\n   fine to use ``pytest`` as your fork repository name because it will live\n   under your user.\n\n#. Clone\
    \ your fork locally using `git <https://git-scm.com/>`_ and create a branch::\n\n    $ git clone git@github.com:YOUR_GITHUB_USERNAME/pytest.git\n\
    \    $ cd pytest\n    $ git fetch --tags https://github.com/pytest-dev/pytest\n    # now, create your own branch off \"\
    main\":\n\n        $ git checkout -b your-bugfix-branch-name main\n\n   Given we have \"major.minor.micro\" version numbers,\
    \ bug fixes will usually\n   be released in micro releases whereas features will be released in\n   minor releases and\
    \ incompatible changes in major releases.\n\n   You will need the tags to test locally, so be sure you have the tags from\
    \ the main repository. If you suspect you don't, set the main repository as upstream and fetch the tags::\n\n     $ git\
    \ remote add upstream https://github.com/pytest-dev/pytest\n     $ git fetch upstream --tags\n\n   If you need some help\
