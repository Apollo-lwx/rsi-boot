  section: Merge/squash guidelines
  text: "Contributing\nMerge/squash guidelines\n-----------------------\n\nWhen a PR is approved and ready to be integrated\
    \ to the ``main`` branch, one has the option to *merge* the commits unchanged, or *squash* all the commits into a single\
    \ commit.\n\nHere are some guidelines on how to proceed, based on examples of a single PR commit history:\n\n1. Miscellaneous\
    \ commits:\n\n   * ``Implement X``\n   * ``Fix test_a``\n   * ``Add myself to AUTHORS``\n   * ``fixup! Fix test_a``\n\
    \   * ``Update tests/test_integration.py``\n   * ``Merge origin/main into PR branch``\n   * ``Update tests/test_integration.py``\n\
    \n   In this case, prefer to use the **Squash** merge strategy: the commit history is a bit messy (not in a derogatory\
    \ way, often one just commits changes because they know the changes will eventually be squashed together), so squashing\
    \ everything into a single commit is best. You must clean up the commit message, making sure it contains useful details.\n\
    \n2. Separate commits related to the same topic:\n\n   * ``Implement X``\n   * ``Add myself to AUTHORS``\n   * ``Update\
    \ CHANGELOG for X``\n\n   In this case, prefer to use the **Squash** merge strategy: while the commit history is not \"\
    messy\" as in the example above, the individual commits do not bring much value overall, specially when looking at the\
    \ changes a few months/years down the line.\n\n3. Separate commits, each with their own topic (refactorings, renames,\
    \ etc), but still have a larger topic/purpose.\n\n   * ``Refactor class X in preparation for feature Y``\n   * ``Remove\
    \ unused method``\n   * ``Implement feature Y``\n\n   In this case, prefer to use the **Merge** strategy: each commit\
    \ is valuable on its own, even if they serve a common topic overall. Looking at the history later, it is useful to have\
    \ the removal of the unused method separately on its own commit, along with more information (such as how it became unused\
    \ in the first place).\n\n4. Separate commits, each with their own topic, but without a larger topic/purpose other than\
    \ improve the code base (using more modern techniques, improve typing, removing clutter, etc).\n\n   * ``Improve internal\
    \ names in X``\n   * ``Add type annotations to Y``\n   * ``Remove unnecessary dict access``\n   * ``Remove unreachable\
    \ code due to EOL Python``\n\n   In this case, prefer to use the **Merge** strategy: each commit is valuable on its own,\
    \ and the information on each is valuable in the long term.\n\n\nAs mentioned, those are overall guidelines, not rules\
    \ cast in stone. This topic was discussed in `#12633 <https://github.com/pytest-dev/pytest/discussions/12633>`_.\n\n\n\
    *Backport PRs* (as those created automatically from a ``backport`` label) should always be **squashed**, as they preserve\
    \ the original PR author."
