  section: Removals and backward incompatible breaking changes
  text: "pytest 9.2.0 (2026-10-27)\nRemovals and backward incompatible breaking changes\n---------------------------------------------------\n\
    \n- `#14716 <https://github.com/pytest-dev/pytest/issues/14716>`_: :option:`-c` now raises a usage error for a path that\
    \ does not exist, is a directory, or is in a format pytest has no loader for. Such paths were previously either ignored\
    \ or reported as an unhandled ``FileNotFoundError``.\n\n\n- `#8593 <https://github.com/pytest-dev/pytest/issues/8593>`_:\
    \ The ``indirect``, ``ids`` and ``scope`` arguments of :func:`Metafunc.parametrize() <pytest.Metafunc.parametrize>` --\
    \ and therefore of :ref:`@pytest.mark.parametrize <pytest.mark.parametrize ref>` -- are now keyword-only.\n\n  Passing\
    \ them positionally was a common source of confusing errors, e.g. ``parametrize(\"arg1\", \"arg2\", [(1, 2)])`` made the\
    \ argvalues land in ``indirect`` and failed with ``indirect fixture '(1, 2)' doesn't exist``; such mistakes now fail with\
    \ an understandable ``TypeError``. The type annotations have always declared these arguments as keyword-only.\n\n\n- `#993\
    \ <https://github.com/pytest-dev/pytest/issues/993>`_: Plugin import failures at startup are now reported and classified\
    \ instead of escaping as a raw traceback with the accidental exit code ``1``:\n\n  * a plugin that cannot be found --\
    \ via ``-p``, ``pytest_plugins`` or ``PYTEST_PLUGINS`` -- exits with :class:`pytest.ExitCode` ``USAGE_ERROR`` (``4``),\
    \ like a ``conftest.py`` that fails to import;\n  * a plugin that is found but raises while importing -- including a broken\
    \ ``pytest11`` entry point or a missing plugin dependency -- exits with :class:`pytest.ExitCode` ``INTERNAL_ERROR`` (``3``),\
    \ with the traceback preserved.\n\n  :func:`pytest.main` now returns these codes instead of raising ``ImportError``. Also\
    \ fixed an ``IndexError`` from pytest's own internals when the plugin raised an exception with no arguments."
