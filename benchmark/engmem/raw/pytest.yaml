    \ upstream if necessary (if you cloned only main `git fetch --tags https://github.com/pytest-dev/pytest`).\n#. Enable\
    \ and install `pre-commit <https://pre-commit.com>`_ to ensure style-guides and code checks are followed.\n#. Follow `PEP-8\
    \ <https://www.python.org/dev/peps/pep-0008/>`_ for naming.\n#. Tests are run using ``tox``::\n\n    tox -e linting,py313\n\
    \n   The test environments above are usually enough to cover most cases locally.\n\n#. Write a ``changelog`` entry: ``changelog/2574.bugfix.rst``,\
    \ use issue id number\n   and one of ``feature``, ``improvement``, ``bugfix``, ``doc``, ``deprecation``,\n   ``breaking``,\
    \ ``vendor``, ``packaging``, ``contrib``, or ``misc`` for the issue type.\n\n\n#. Unless your change is a trivial or a\
    \ documentation fix (e.g., a typo or reword of a small section) please\n   add yourself to the ``AUTHORS`` file, in alphabetical\
    \ order."
- file: CONTRIBUTING.rst
  line: 428
  section: Writing Tests
  text: "Contributing > Preparing Pull Requests\nWriting Tests\n~~~~~~~~~~~~~\n\nWriting tests for plugins or for pytest itself\
    \ is often done using the `pytester fixture <https://docs.pytest.org/en/stable/reference/reference.html#pytester>`_, as\
    \ a \"black-box\" test.\n\nFor example, to ensure a simple test passes you can write:\n\n.. code-block:: python\n\n  \
    \  def test_true_assertion(pytester):\n        pytester.makepyfile(\n            \"\"\"\n            def test_foo():\n\
    \                assert True\n        \"\"\"\n        )\n        result = pytester.runpytest()\n        result.assert_outcomes(failed=0,\
    \ passed=1)\n\n\nAlternatively, it is possible to make checks based on the actual output of the terminal using\n*glob-like*\
    \ expressions:\n\n.. code-block:: python\n\n    def test_true_assertion(pytester):\n        pytester.makepyfile(\n   \
    \         \"\"\"\n            def test_foo():\n                assert False\n        \"\"\"\n        )\n        result\
    \ = pytester.runpytest()\n        result.stdout.fnmatch_lines([\"*assert False*\", \"*1 failed*\"])\n\nWhen choosing a\
    \ file where to write a new test, take a look at the existing files and see if there's\none file which looks like a good\
    \ fit. For example, a regression test about a bug in the ``--lf`` option\nshould go into ``test_cacheprovider.py``, given\
    \ that this option is implemented in ``cacheprovider.py``.\nIf in doubt, go ahead and open a PR with your best guess and\
    \ we can discuss this over the code."
- file: CONTRIBUTING.rst
  line: 536
  section: Backporting bug fixes for the next patch release
  text: "Contributing\nBackporting bug fixes for the next patch release\n------------------------------------------------\n\
    \nPytest makes a feature release every few weeks or months. In between, patch releases\nare made to the previous feature\
    \ release, containing bug fixes only. The bug fixes\nusually fix regressions, but may be any change that should reach\
    \ users before the\nnext feature release.\n\nSuppose for example that the latest release was 1.2.3, and you want to include\n\
    a bug fix in 1.2.4 (check https://github.com/pytest-dev/pytest/releases for the\nactual latest release). The procedure\
    \ for this is:\n\n#. First, make sure the bug is fixed in the ``main`` branch, with a regular pull\n   request, as described\
    \ above. An exception to this is if the bug fix is not\n   applicable to ``main`` anymore.\n\nAutomatic method:\n\nAdd\
    \ a ``backport 1.2.x`` label to the PR you want to backport. This will create\na backport PR against the ``1.2.x`` branch.\n\
    \nManual method:\n\n#. ``git checkout origin/1.2.x -b backport-XXXX`` # use the main PR number here\n\n#. Locate the merge\
    \ commit on the PR, in the *merged* message, for example:\n\n    nicoddemus merged commit 0f8b462 into pytest-dev:main\n\
    \n#. ``git cherry-pick -x -m1 REVISION`` # use the revision you found above (``0f8b462``).\n\n#. Open a PR targeting ``1.2.x``:\n\
    \n   * Prefix the message with ``[1.2.x]``.\n   * Delete the PR body, it usually contains a duplicate commit message."
- file: CONTRIBUTING.rst
  line: 573
  section: Who does the backporting
  text: "Contributing > Backporting bug fixes for the next patch release\nWho does the backporting\n~~~~~~~~~~~~~~~~~~~~~~~~\n\
    \nAs mentioned above, bugs should first be fixed on ``main`` (except in rare occasions\nthat a bug only happens in a previous\
    \ release). So, who should do the backport procedure described\nabove?\n\n1. If the bug was fixed by a core developer,\
    \ it is the main responsibility of that core developer\n   to do the backport.\n2. However, often the merge is done by\
    \ another maintainer, in which case it is nice of them to\n   do the backport procedure if they have the time.\n3. For\
    \ bugs submitted by non-maintainers, it is expected that a core developer will do\n   the backport, normally the one that\
    \ merged the PR on ``main``.\n4. If a non-maintainer notices a bug which is fixed on ``main`` but has not been backported\n\
    \   (due to maintainers forgetting to apply the *needs backport* or *backport x.x.x* labels, or just plain missing it),\n\
    \   they are also welcome to open a PR with the backport. The procedure is simple and really\n   helps with the maintenance\
    \ of the project.\n\nAll the above are not rules, but merely some guidelines/suggestions on what we should expect\nabout\
    \ backports.\n\nBackports should be **squashed** (rather than **merged**), as doing so preserves the original PR author\
    \ correctly."
- file: CONTRIBUTING.rst
  line: 614
  section: When to close
  text: 'Contributing > Handling stale issues/PRs

    When to close

    ~~~~~~~~~~~~~


    Here are a few general rules the maintainers use to decide when to close issues/PRs because

    of lack of inactivity:


    * Issues labeled ``question`` or ``needs information``: closed after 14 days inactive.

    * Issues labeled ``proposal``: closed after six months inactive.

    * Pull requests: after one month, consider pinging the author, update linked issue, or consider closing. For pull requests
    which are nearly finished, the team should consider finishing it up and merging it.


    The above are **not hard rules**, but merely **guidelines**, and can be (and often are!) reviewed on a case-by-case basis.'
- file: CONTRIBUTING.rst
  line: 626
  section: Closing pull requests
  text: "Contributing > Handling stale issues/PRs\nClosing pull requests\n~~~~~~~~~~~~~~~~~~~~~\n\nWhen closing a Pull Request,\
    \ we should acknowledge the time, effort, and interest demonstrated by the person who submitted it. As mentioned previously,\
    \ it is not the intent of the team to dismiss a stalled pull request entirely but to merely to clear up our queue, so\
    \ a message like the one below is warranted when closing a pull request that went stale:\n\n    Hi <contributor>,\n\n\
    \    First of all, we would like to thank you for your time and effort on working on this, the pytest team deeply appreciates\
    \ it.\n\n    We noticed it has been awhile since you have updated this PR, however. pytest is a high activity project,\
    \ with many issues/PRs being opened daily, so it is hard for us maintainers to track which PRs are ready for merging,\
    \ for review, or need more attention.\n\n    So for those reasons, we think it is best to close the PR for now, but with\
    \ the only intention to clean up our queue, it is by no means a rejection of your changes. We still encourage you to re-open\
    \ this PR (it is just a click of a button away) when you are ready to get back to it.\n\n    Again we appreciate your\
    \ time for working on this, and hope you might get back to this at a later time!\n\n    <bye>"
- file: CONTRIBUTING.rst
  line: 643
  section: Closing issues
  text: 'Contributing

    Closing issues

    --------------


    When a pull request is submitted to fix an issue, add text like ``closes #XYZW`` to the PR description and/or commits
    (where ``XYZW`` is the issue number). See the `GitHub docs <https://help.github.com/en/github/managing-your-work-on-github/linking-a-pull-request-to-an-issue#linking-a-pull-request-to-an-issue-using-a-keyword>`_
    for more information.


    When an issue is due to user error (e.g. misunderstanding of a functionality), please politely explain to the user why
    the issue raised is really a non-issue and ask them to close the issue if they have no further questions. If the original
    requester is unresponsive, the issue will be handled as described in the section `Handling stale issues/PRs`_ above.'
