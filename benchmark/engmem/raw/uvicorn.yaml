- file: docs/contributing.md
  line: 152
  section: Releasing
  text: "Contributing\n## Releasing\n\n*This section is targeted at Uvicorn maintainers.*\n\nBefore releasing a new version,\
    \ create a pull request that includes:\n\n- **An update to the changelog**:\n    - We follow the format from [keepachangelog](https://keepachangelog.com/en/1.0.0/).\n\
    \    - [Compare](https://github.com/Kludex/uvicorn/compare/) `main` with the tag of the latest release, and list all entries\
    \ that are of interest to our users:\n        - Things that **must** go in the changelog: added, changed, deprecated or\
    \ removed features, and bug fixes.\n        - Things that **should not** go in the changelog: changes to documentation,\
    \ tests or tooling.\n        - Try sorting entries in descending order of impact / importance.\n        - Keep it concise\
    \ and to-the-point. \U0001F3AF\n- **A version bump**: see `__init__.py`.\n\nFor an example, see [#1107](https://github.com/Kludex/uvicorn/pull/1107).\n\
    \nOnce the release PR is merged, create a\n[new release](https://github.com/Kludex/uvicorn/releases/new) including:\n\n\
    - Tag version like `0.13.3`.\n- Release title `Version 0.13.3`\n- Description copied from the changelog.\n\nOnce created\
    \ this release will be automatically uploaded to PyPI."
- file: README.md
  line: 32
  section: Quickstart
  text: "## Quickstart\n\nInstall using `pip`:\n\n```shell\n$ pip install uvicorn\n```\n\nThis will install uvicorn with minimal\
    \ (pure Python) dependencies.\n\n```shell\n$ pip install 'uvicorn[standard]'\n```\n\nThis will install uvicorn with \"\
    Cython-based\" dependencies (where possible) and other \"optional extras\".\n\nIn this context, \"Cython-based\" means\
    \ the following:\n\n- the event loop `uvloop` will be installed and used if possible.\n- the http protocol will be handled\
    \ by `httptools` if possible.\n\nMoreover, \"optional extras\" means that:\n\n- the websocket protocol will be handled\
    \ by `websockets` (should you want to use `wsproto` you'd need to install it manually) if possible.\n- the `--reload`\
    \ flag in development mode will use `watchfiles`.\n- `python-dotenv` will be installed should you want to use the `--env-file`\
    \ option.\n- `PyYAML` will be installed to allow you to provide a `.yaml` file to `--log-config`, if desired.\n\nCreate\
    \ an application, in `example.py`:\n\n```python\nasync def app(scope, receive, send):\n    assert scope['type'] == 'http'\n\
    \n    await send({\n        'type': 'http.response.start',\n        'status': 200,\n        'headers': [\n           \
    \ (b'content-type', b'text/plain'),\n        ],\n    })\n    await send({\n        'type': 'http.response.body',\n   \
    \     'body': b'Hello, world!',\n    })\n```\n\nRun the server:\n\n```shell\n$ uvicorn example:app\n```\n\n---"
