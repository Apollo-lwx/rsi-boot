    \ of `CliRunner`. {issue}`334`,\n  {pr}`1010`\n- Usage errors now hint at the `--help` option. {issue}`393`,\n  {pr}`557`\n\
    - Implement streaming pager. {issue}`409`, {pr}`889`\n- Extract bar formatting to its own method. {pr}`414`\n- Add `DateTime`\
    \ type for converting input in given date time\n  formats. {pr}`423`\n- `secho`'s first argument can now be `None`, like\
    \ in `echo`.\n  {pr}`424`\n- Fixes a `ZeroDivisionError` in `ProgressBar.make_step`, when the\n  arg passed to the first\
    \ call of `ProgressBar.update` is 0.\n  {issue}`447`, {pr}`1012`\n- Show progressbar only if total execution time is visible.\
    \ {pr}`487`\n- Added the ability to hide commands and options from help. {pr}`500`\n- Document that options can be `required=True`.\
    \ {issue}`514`,\n  {pr}`1022`\n- Non-standalone calls to `Context.exit` return the exit code,\n  rather than calling `sys.exit`.\
    \ {issue}`667`, {pr}`533, 1098`\n- `click.getchar()` returns Unicode in Python 3 on Windows,\n  consistent with other\
    \ platforms. {issue}`537, 821, 822, 1088`,\n  {pr}`1108`\n- Added `FloatRange` type. {pr}`538, 553`\n- Added support for\
    \ bash completion of `type=click.Choice` for\n  `Options` and `Arguments`. {issue}`535`, {pr}`681`\n- Only allow one positional\
    \ arg for `Argument` parameter\n  declaration. {issue}`568, 574`, {pr}`1014`\n- Add `case_sensitive=False` as an option\
    \ to Choice. {issue}`569`\n- `click.getchar()` correctly raises `KeyboardInterrupt` on \"^C\"\n  and `EOFError` on \"\
    ^D\" on Linux. {issue}`583`, {pr}`1115`\n- Fix encoding issue with `click.getchar(echo=True)` on Linux.\n  {pr}`1115`\n\
    - `param_hint` in errors now derived from param itself.\n  {issue}`598, 704`, {pr}`709`\n- Add a test that ensures that\
