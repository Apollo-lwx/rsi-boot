    \ as extra in `CliRunner.invoke`.\n  {issue}`616`, {pr}`999`\n- Help text taken from docstrings truncates at the `\\f`\
    \ form feed\n  character, useful for hiding Sphinx-style parameter documentation.\n  {pr}`629, 1091`\n- `launch` now works\
