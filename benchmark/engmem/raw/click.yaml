    \ terminal styles by default.\n  Colorama is no longer a dependency and is not used. {issue}`2986` {pr}`3505`\n- {class}`Argument`\
    \ accepts a `help` parameter, and help output includes\n  a `Positional arguments` section when argument help is available.\
    \ {issue}`2983` {pr}`3473`\n- `confirm()` and `prompt()` strip ANSI color and style codes from the\n  prompt when the\
    \ output stream does not support them, matching `echo()`.\n  This stripping was lost in `8.4.0` when {pr}`2969` began\
    \ writing the\n  prompt with `input()` directly. {issue}`3572` {pr}`3653`\n- Fix test failures when using pytest >= 9.1.\
    \ {pr}`3656`\n- {class}`Path` with `allow_dash=True` no longer triggers a `BytesWarning`,\n  an error under `python -bb`,\
    \ when checking a value against the `-`\n  convention. {issue}`2877` {pr}`3642`\n- Add {func}`custom_version_option`,\
    \ a `--version` option whose output is\n  produced by a callback, covering cases {func}`version_option` intentionally\n\
    \  does not. The feature set of {func}`version_option` is now frozen; see\n  [discussion #3527](https://github.com/pallets/click/discussions/3527).\
    \ {pr}`3581`\n- `style()` and `secho()` no longer silently drop the 256-color index `0`\n  (black) passed as `fg` or `bg`,\
    \ and now validate color arguments. Invalid\n  colors raise a `ValueError` instead of a `TypeError`. {pr}`3677`\n- The\
    \ automatic help option stores its value under the reserved name\n  `_click_default_help` instead of `help`, so a parameter\
    \ named `help` no\n  longer breaks parsing. The new name is visible in\n  {meth}`Command.to_info_dict` output. Parameters\
    \ that overwrite each other's\n  value trigger a warning: an argument sharing its name with another\n  parameter, or any\
    \ parameter claiming the reserved name. Options may still\n  share a name to compete for the same value (feature switches).\n\
