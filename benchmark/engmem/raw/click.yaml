- file: CHANGES.md
  line: 377
  section: Version 8.3.0
  text: "## Version 8.3.0\n\nReleased 2025-09-17\n\n- **Improved flag option handling**: Reworked the relationship between\
    \ `flag_value`\n  and `default` parameters for better consistency:\n\n  - The `default` parameter value is now preserved\
    \ as-is and passed directly\n    to CLI functions (no more unexpected transformations)\n  - Exception: flag options with\
    \ `default=True` maintain backward compatibility\n    by defaulting to their `flag_value`\n  - The `default` parameter\
    \ can now be any type (`bool`, `None`, etc.)\n  - Fixes inconsistencies reported in: {issue}`1992` {issue}`2514` {issue}`2610`\n\
    \    {issue}`3024` {pr}`3030`\n\n- Allow `default` to be set on `Argument` for `nargs = -1`. {issue}`2164`\n  {pr}`3030`\n\
    \n- Show correct auto complete value for `nargs` option in combination with flag\n  option {issue}`2813`\n\n- Fix handling\
    \ of quoted and escaped parameters in Fish autocompletion. {issue}`2995` {pr}`3013`\n\n- Lazily import `shutil`. {pr}`3023`\n\
    \n- Properly forward exception information to resources registered with\n  `click.core.Context.with_resource()`. {issue}`2447`\
    \ {pr}`3058`\n\n- Fix regression related to EOF handling in `CliRunner`. {issue}`2939` {pr}`2940`"
- file: CHANGES.md
  line: 562
  section: Version 8.1.8
  text: "## Version 8.1.8\n\nReleased 2024-12-19\n\n- Fix an issue with type hints for `click.open_file()`. {issue}`2717`\n\
    - Fix issue where error message for invalid `click.Path` displays on\n  multiple lines. {issue}`2697`\n- Fixed issue that\
    \ prevented a default value of `\"\"` from being displayed in\n  the help for an option. {issue}`2500`\n- The test runner\
    \ handles stripping color consistently on Windows.\n  {issue}`2705`\n- Show correct value for flag default when using\
    \ `default_map`.\n  {issue}`2632`\n- Fix `click.echo(color=...)` passing `color` to coloroma so it can be\n  forced on\
    \ Windows. {issue}`2606`.\n- More robust bash version check, fixing problem on Windows with git-bash.\n  {issue}`2638`\n\
    - Cache the help option generated by the `help_option_names` setting to\n  respect its eagerness. {pr}`2811`\n- Replace\
    \ uses of `os.system` with `subprocess.Popen`. {issue}`1476`\n- Exceptions generated during a command will use the context's\
    \ `color`\n  setting when being displayed. {issue}`2193`\n- Error message when defining option with invalid name is more\
    \ descriptive.\n  {issue}`2452`\n- Refactor code generating default `--help` option to deduplicate code.\n  {pr}`2563`\n\
    - Test `CLIRunner` resets patched `_compat.should_strip_ansi`.\n  {issue}`2732`"
