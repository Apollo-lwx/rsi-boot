- file: CHANGES.rst
  line: 508
  section: Version 2.0.2
  text: "Version 2.0.2\n-------------\n\nReleased 2021-10-04\n\n-   Fix type annotation for ``teardown_*`` methods. :issue:`4093`\n\
    -   Fix type annotation for ``before_request`` and ``before_app_request``\n    decorators. :issue:`4104`\n-   Fixed the\
    \ issue where typing requires template global\n    decorators to accept functions with no arguments. :issue:`4098`\n-\
    \   Support View and MethodView instances with async handlers. :issue:`4112`\n-   Enhance typing of ``app.errorhandler``\
    \ decorator. :issue:`4095`\n-   Fix registering a blueprint twice with differing names. :issue:`4124`\n-   Fix the type\
    \ of ``static_folder`` to accept ``pathlib.Path``.\n    :issue:`4150`\n-   ``jsonify`` handles ``decimal.Decimal`` by\
    \ encoding to ``str``.\n    :issue:`4157`\n-   Correctly handle raising deferred errors in CLI lazy loading.\n    :issue:`4096`\n\
    -   The CLI loader handles ``**kwargs`` in a ``create_app`` function.\n    :issue:`4170`\n-   Fix the order of ``before_request``\
    \ and other callbacks that trigger\n    before the view returns. They are called from the app down to the\n    closest\
    \ nested blueprint. :issue:`4229`"
- file: CHANGES.rst
  line: 785
  section: Version 1.0.4
  text: "Version 1.0.4\n-------------\n\nReleased 2019-07-04\n\n-   The key information for ``BadRequestKeyError`` is no longer\
    \ cleared\n    outside debug mode, so error handlers can still access it. This\n    requires upgrading to Werkzeug 0.15.5.\
    \ :issue:`3249`\n-   ``send_file`` url quotes the \":\" and \"/\" characters for more\n    compatible UTF-8 filename support\
    \ in some browsers. :issue:`3074`\n-   Fixes for :pep:`451` import loaders and pytest 5.x. :issue:`3275`\n-   Show message\
    \ about dotenv on stderr instead of stdout. :issue:`3285`"
- file: CHANGES.rst
  line: 799
  section: Version 1.0.3
  text: "Version 1.0.3\n-------------\n\nReleased 2019-05-17\n\n-   ``send_file`` encodes filenames as ASCII instead of Latin-1\n\
    \    (ISO-8859-1). This fixes compatibility with Gunicorn, which is\n    stricter about header encodings than :pep:`3333`.\
    \ :issue:`2766`\n-   Allow custom CLIs using ``FlaskGroup`` to set the debug flag without\n    it always being overwritten\
    \ based on environment variables.\n    :pr:`2765`\n-   ``flask --version`` outputs Werkzeug's version and simplifies the\n\
    \    Python version. :pr:`2825`\n-   ``send_file`` handles an ``attachment_filename`` that is a native\n    Python 2 string\
    \ (bytes) with UTF-8 coded bytes. :issue:`2933`\n-   A catch-all error handler registered for ``HTTPException`` will not\n\
    \    handle ``RoutingException``, which is used internally during\n    routing. This fixes the unexpected behavior that\
    \ had been introduced\n    in 1.0. :pr:`2986`\n-   Passing the ``json`` argument to ``app.test_client`` does not\n   \
    \ push/pop an extra app context. :issue:`2900`"
- file: CHANGES.rst
  line: 833
  section: Version 1.0.1
  text: "Version 1.0.1\n-------------\n\nReleased 2018-04-29\n\n-   Fix registering partials (with no ``__name__``) as view\
    \ functions.\n    :pr:`2730`\n-   Don't treat lists returned from view functions the same as tuples.\n    Only tuples\
    \ are interpreted as response data. :issue:`2736`\n-   Extra slashes between a blueprint's ``url_prefix`` and a route\
    \ URL\n    are merged. This fixes some backwards compatibility issues with the\n    change in 1.0. :issue:`2731`, :issue:`2742`\n\
    -   Only trap ``BadRequestKeyError`` errors in debug mode, not all\n    ``BadRequest`` errors. This allows ``abort(400)``\
    \ to continue\n    working as expected. :issue:`2735`\n-   The ``FLASK_SKIP_DOTENV`` environment variable can be set to\
    \ ``1``\n    to skip automatically loading dotenv files. :issue:`2722`"
