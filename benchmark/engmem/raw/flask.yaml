- file: CHANGES.rst
  line: 1189
  section: Version 0.10.1
  text: "Version 0.10.1\n--------------\n\nReleased 2013-06-14\n\n-   Fixed an issue where ``|tojson`` was not quoting single\
    \ quotes which\n    made the filter not work properly in HTML attributes. Now it's\n    possible to use that filter in\
    \ single quoted attributes. This should\n    make using that filter with angular.js easier.\n-   Added support for byte\
    \ strings back to the session system. This\n    broke compatibility with the common case of people putting binary\n  \
    \  data for token verification into the session.\n-   Fixed an issue where registering the same method twice for the same\n\
    \    endpoint would trigger an exception incorrectly."
