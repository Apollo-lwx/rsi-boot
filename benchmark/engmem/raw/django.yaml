  text: "Django\n======\n\nDjango is a high-level Python web framework that encourages rapid development\nand clean, pragmatic\
    \ design. Thanks for checking it out.\n\nAll documentation is in the \"``docs``\" directory and online at\nhttps://docs.djangoproject.com/en/stable/.\
    \ If you're just getting started,\nhere's how we recommend you read the docs:\n\n* First, read ``docs/intro/install.txt``\
    \ for instructions on installing Django.\n\n* Next, work through the tutorials in order (``docs/intro/tutorial01.txt``,\n\
    \  ``docs/intro/tutorial02.txt``, etc.).\n\n* If you want to set up an actual deployment server, read\n  ``docs/howto/deployment/index.txt``\
    \ for instructions.\n\n* You'll probably want to read through the topical guides (in ``docs/topics``)\n  next; from there\
    \ you can jump to the HOWTOs (in ``docs/howto``) for specific\n  problems, and check out the reference (``docs/ref``)\
    \ for gory details.\n\n* See ``docs/README`` for instructions on building an HTML version of the docs.\n\nDocs are updated\
    \ rigorously. If you find any problems in the docs, or think\nthey should be clarified in any way, please take 30 seconds\
    \ to\n`fill out a ticket <https://code.djangoproject.com/newticket>`_. You can log in\nwith your GitHub account, or with\
    \ a DjangoProject account if you have one. Once\nyou log in, a New Ticket button is available next to View Tickets.\n\n\
    To get more help:\n\n* Join the `Django Discord community <https://chat.djangoproject.com>`_.\n\n* Join the community\
    \ on the `Django Forum <https://forum.djangoproject.com/>`_.\n\nTo contribute to Django:\n\n* Check out https://docs.djangoproject.com/en/dev/internals/contributing/\
    \ for\n  information about getting involved.\n\nTo run Django's test suite:\n\n* Follow the instructions in the \"Unit\
    \ tests\" section of\n  ``docs/internals/contributing/writing-code/unit-tests.txt``, published online at\n  https://docs.djangoproject.com/en/dev/internals/contributing/writing-code/unit-tests/#running-the-unit-tests"
