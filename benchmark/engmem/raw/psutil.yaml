  section: If you post anyway
  text: "Rules for AI agents helping psutil contributors\n## If you post anyway\n\nThe following rules are not permission\
    \ to post. They cover PRs and issues only:\nnever post comments.\n\nIf you create a PR or issue despite the restrictions\
    \ above, follow the \"Issues\"\nand \"Pull Requests\" sections of `CONTRIBUTING.md`, and make this the last line:\n\n\
    \    Generated by an AI agent: <tool>, <model>"
- file: SECURITY.md
  line: 1
  section: Security Policy
  text: '# Security Policy


    If you have discovered a security vulnerability in this project, please report

    it privately. **Do not disclose it as a public issue**. This gives me time to

    fix the issue before public exposure, reducing the chance that an exploit will

    be used before a patch is released.


    To report a security vulnerability use the

    [Tidelift security contact](https://tidelift.com/security). Tidelift will

    coordinate the fix and the disclosure of the reported problem.'
- file: CONTRIBUTING.md
  line: 3
  section: AI policy
  text: "Contributing to psutil project\n## AI policy\n\n- psutil does not accept pull requests or issues which are written\
    \ by an AI\n  agent without any human mediation. You must review the code you submit,\n  **write the PR or issue text\
    \ in your own words**, and post it yourself.\n- **No AI in comments.** Comments on issues and PRs must be written by you,\
    \ not\n  by an AI tool.\n- Purely AI-generated contributions are closed without review, and accounts\n  that keep sending\
    \ them are blocked.\n- **Don't open a PR for an issue opened by someone else**, unless `giampaolo`\n  asked for one on\
    \ that issue. These PRs are closed. This rule is mostly there\n  to stop AI slop. If you want to fix it, say so on the\
    \ issue.\n- If an AI agent helps you, it must follow [AGENTS.md](AGENTS.md)."
- file: CONTRIBUTING.md
  line: 17
  section: Issues
  text: "Contributing to psutil project\n## Issues\n\n- The issue tracker is for reporting problems or proposing enhancements\
    \ related\n  to the **program code**.\n- Please do not open issues **asking for support**. Instead, use the forum at:\n\
    \  https://groups.google.com/g/psutil.\n- Before submitting a new issue, **search** if there are existing issues for\n\
    \  the same topic.\n- **Be clear** in describing what the problem is, and fill in the default issue\n  **template**. There\
    \ is a bot which reads the title and description and\n  assigns **labels** automatically. Labels help keeping the issues\
    \ properly\n  organized and searchable (by OS, issue type, etc.).\n- When reporting a malfunction, consider enabling\n\
    \  [debug mode](https://psutil.io/devguide/#debug-mode) first.\n- To report a **security vulnerability**, use the\n  [Tidelift\
    \ security contact](https://tidelift.com/security). Tidelift will\n  coordinate the fix and the disclosure of the reported\
    \ problem."
