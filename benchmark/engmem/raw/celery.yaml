  section: Forking and setting up the repository
  text: "Working on Features & Patches\nForking and setting up the repository\n-------------------------------------\n\nFirst\
    \ you need to fork the Celery repository; a good introduction to this\nis in the GitHub Guide: `Fork a Repo`_.\n\nAfter\
    \ you have cloned the repository, you should checkout your copy\nto a directory on your machine:\n\n.. code-block:: console\n\
    \n    $ git clone git@github.com:username/celery.git\n\nWhen the repository is cloned, enter the directory to set up easy\
    \ access\nto upstream changes:\n\n.. code-block:: console\n\n    $ cd celery\n    $ git remote add upstream git@github.com:celery/celery.git\n\
    \    $ git fetch upstream\n\nIf you need to pull in new changes from upstream you should\nalways use the ``--rebase``\
    \ option to ``git pull``:\n\n.. code-block:: console\n\n    git pull --rebase upstream main\n\nWith this option, you don't\
    \ clutter the history with merging\ncommit notes. See `Rebasing merge commits in git`_.\nIf you want to learn more about\
    \ rebasing, see the `Rebase`_\nsection in the GitHub guides.\n\nIf you need to work on a different branch than the one\
    \ git calls ``main``, you can\nfetch and checkout a remote branch like this::\n\n    git checkout --track -b 5.0-devel\
    \ upstream/5.0-devel\n\n**Note:** Any feature or fix branch should be created from ``upstream/main``.\n\n.. _`Fork a Repo`:\
    \ https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/working-with-forks/fork-a-repo\n.. _`Rebasing\
    \ merge commits in git`:\n    https://web.archive.org/web/20150627054345/http://marketblog.envato.com/general/rebasing-merge-commits-in-git/\n\
    .. _`Rebase`: https://docs.github.com/en/get-started/using-git/about-git-rebase\n\n.. _contributing-docker-development:"
- file: CONTRIBUTING.rst
