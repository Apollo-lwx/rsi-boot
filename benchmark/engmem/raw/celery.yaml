    \ file a bug if you're requesting support. For that you can use\n`GitHub Discussions`_. If you still need support\nyou\
    \ can open a github issue, please prepend the title with ``[QUESTION]``.\n\n3) **Make sure your bug hasn't already been\
    \ reported**.\n\nSearch through the appropriate Issue tracker. If a bug like yours was found,\ncheck if you have new information\
    \ that could be reported to help\nthe developers fix the bug.\n\n4) **Check if you're using the latest version**.\n\n\
    A bug could be fixed by some other improvements and fixes - it might not have an\nexisting report in the bug tracker.\
    \ Make sure you're using the latest releases of\ncelery, billiard, kombu, amqp, and vine.\n\n5) **Collect information\
    \ about the bug**.\n\nTo have the best chance of having a bug fixed, we need to be able to easily\nreproduce the conditions\
    \ that caused it. Most of the time this information\nwill be from a Python traceback message, though some bugs might be\
    \ in design,\nspelling or other errors on the website/docs/code.\n\n    A) If the error is from a Python traceback, include\
    \ it in the bug report.\n\n    B) We also need to know what platform you're running (Windows, macOS, Linux,\n       etc.),\
    \ the version of your Python interpreter, and the version of Celery,\n       and related packages that you were running\
    \ when the bug occurred.\n\n    C) If you're reporting a race condition or a deadlock, tracebacks can be\n       hard\
    \ to get or might not be that useful. Try to inspect the process to\n       get more diagnostic data. Some ideas:\n\n\
    \       * Enable Celery's :ref:`breakpoint signal <breakpoint_signal>` and use it\n         to inspect the process's state.\
    \ This will allow you to open a\n         :mod:`pdb` session.\n       * Collect tracing data using `strace`_(Linux),\n\
    \         :command:`dtruss` (macOS), and :command:`ktrace` (BSD),\n         `ltrace`_, and `lsof`_.\n\n    D) Include\
    \ the output from the :command:`celery report` command:\n\n        .. code-block:: console\n\n            $ celery -A\
    \ proj report\n\n        This will also include your configuration settings and it will try to\n        remove values\
    \ for keys known to be sensitive, but make sure you also\n        verify the information before submitting so that it\
    \ doesn't contain\n        confidential information like API tokens and authentication\n        credentials.\n\n    E)\
    \ Your issue might be tagged as `Needs Test Case`. A test case represents\n       all the details needed to reproduce\
    \ what your issue is reporting.\n       A test case can be some minimal code that reproduces the issue or\n       detailed\
    \ instructions and configuration values that reproduces\n       said issue.\n\n6) **Submit the bug**.\n\nBy default `GitHub`_\
    \ will email you to let you know when new comments have\nbeen made on your bug. In the event you've turned this feature\
    \ off, you\nshould check back on occasion to ensure you don't miss any questions a\ndeveloper trying to fix the bug might\
    \ ask.\n\n.. _`GitHub`: https://github.com\n.. _`strace`: https://en.wikipedia.org/wiki/Strace\n.. _`ltrace`: https://en.wikipedia.org/wiki/Ltrace\n\
    .. _`lsof`: https://en.wikipedia.org/wiki/Lsof\n\n.. _issue-trackers:"
