- file: README.rst
  line: 356
  section: Transports and Backends
  text: "Installation > Bundles\nTransports and Backends\n~~~~~~~~~~~~~~~~~~~~~~~\n\n:``celery[amqp]``:\n    for using the\
    \ RabbitMQ amqp python library.\n\n:``celery[redis]``:\n    for using Redis as a message transport or as a result backend.\n\
    \n:``celery[sqs]``:\n    for using Amazon SQS as a message transport.\n\n:``celery[tblib]``:\n    for using the ``task_remote_tracebacks``\
    \ feature.\n\n:``celery[memcache]``:\n    for using Memcached as a result backend (using ``pymemcache``).\n\n:``celery[pymemcache]``:\n\
    \    alias of ``celery[memcache]``, kept for backward compatibility.\n\n:``celery[cassandra]``:\n    for using Apache\
    \ Cassandra/Astra DB as a result backend with the DataStax driver.\n\n:``celery[azureblockblob]``:\n    for using Azure\
    \ Storage as a result backend (using ``azure-storage``)\n\n:``celery[s3]``:\n    for using S3 Storage as a result backend.\n\
    \n:``celery[gcs]``:\n    for using Google Cloud Storage as a result backend.\n\n:``celery[couchbase]``:\n    for using\
    \ Couchbase as a result backend.\n\n:``celery[arangodb]``:\n    for using ArangoDB as a result backend.\n\n:``celery[elasticsearch]``:\n\
    \    for using Elasticsearch as a result backend.\n\n:``celery[riak]``:\n    for using Riak as a result backend.\n\n:``celery[cosmosdbsql]``:\n\
    \    for using Azure Cosmos DB as a result backend (using ``pydocumentdb``)\n\n:``celery[zookeeper]``:\n    for using\
    \ Zookeeper as a message transport.\n\n:``celery[sqlalchemy]``:\n    for using SQLAlchemy as a result backend (*supported*).\n\
    \n:``celery[pyro]``:\n    for using the Pyro4 message transport (*experimental*).\n\n:``celery[slmq]``:\n    for using\
    \ the SoftLayer Message Queue transport (*experimental*).\n\n:``celery[consul]``:\n    for using the Consul.io Key/Value\
    \ store as a message transport or result backend (*experimental*).\n\n:``celery[django]``:\n    specifies the lowest version\
    \ possible for Django support.\n\n    You should probably not use this in your requirements, it's here\n    for informational\
    \ purposes only.\n\n:``celery[gcpubsub]``:\n    for using Google Pub/Sub as a message transport.\n\n\n\n.. _celery-installing-from-source:"
