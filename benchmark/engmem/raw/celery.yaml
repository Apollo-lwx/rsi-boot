  section: Running the unit test suite
  text: "Working on Features & Patches\nRunning the unit test suite\n---------------------------\n\nIf you like to develop\
    \ using virtual environments or just outside docker,\nyou must make sure all necessary dependencies are installed.\nThere\
    \ are multiple requirements files to make it easier to install all dependencies.\nYou do not have to use every requirements\
    \ file but you must use `default.txt`.\n\n.. code-block:: console\n\n   # pip install -U -r requirements/default.txt\n\
    \nTo run the Celery test suite you need to install\n:file:`requirements/test.txt`.\n\n.. code-block:: console\n\n    $\
    \ pip install -U -r requirements/test.txt\n    $ pip install -U -r requirements/default.txt\n\nAfter installing the dependencies\
    \ required, you can now execute\nthe test suite by calling :pypi:`pytest <pytest>`:\n\n.. code-block:: console\n\n   \
    \ $ pytest t/unit\n    $ pytest t/integration\n\nSome useful options to :command:`pytest` are:\n\n* ``-x``\n\n    Stop\
    \ running the tests at the first test that fails.\n\n* ``-s``\n\n    Don't capture output\n\n* ``-v``\n\n    Run with\
    \ verbose output.\n\nIf you want to run the tests for a single test file only\nyou can do so like this:\n\n.. code-block::\
    \ console\n\n    $ pytest t/unit/worker/test_worker.py\n\n.. _contributing-coverage:"
- file: CONTRIBUTING.rst
  line: 931
  section: Status Labels
  text: "Working on Features & Patches > Creating pull requests\nStatus Labels\n~~~~~~~~~~~~~~\n\nThere are `different labels`_\
    \ used to easily manage github issues and PRs.\nMost of these labels make it easy to categorize each issue with important\n\
    details. For instance, you might see a ``Component:canvas`` label on an issue or PR.\nThe ``Component:canvas`` label means\
    \ the issue or PR corresponds to the canvas functionality.\nThese labels are set by the maintainers and for the most part\
    \ external contributors\nshould not worry about them. A subset of these labels are prepended with **Status:**.\nUsually\
    \ the **Status:** labels show important actions which the issue or PR needs.\nHere is a summary of such statuses:\n\n\
    - **Status: Cannot Reproduce**\n\n  One or more Celery core team member has not been able to reproduce the issue.\n\n\
    - **Status: Confirmed**\n\n  The issue or PR has been confirmed by one or more Celery core team member.\n\n- **Status:\
    \ Duplicate**\n\n  A duplicate issue or PR.\n\n- **Status: Feedback Needed**\n\n  One or more Celery core team member\
    \ has asked for feedback on the issue or PR.\n\n- **Status: Has Testcase**\n\n  It has been confirmed the issue or PR\
    \ includes a test case.\n  This is particularly important to correctly write tests for any new\n  feature or bug fix.\n\
    \n- **Status: In Progress**\n\n  The PR is still in progress.\n\n- **Status: Invalid**\n\n  The issue reported or the\
    \ PR is not valid for the project.\n\n- **Status: Needs Documentation**\n\n  The PR does not contain documentation for\
    \ the feature or bug fix proposed.\n\n- **Status: Needs Rebase**\n\n  The PR has not been rebased with ``main``. It is\
    \ very important to rebase\n  PRs before they can be merged to ``main`` to solve any merge conflicts.\n\n- **Status: Needs\
    \ Test Coverage**\n\n  Celery uses `codecov`_ to verify code coverage. Please make sure PRs do not\n  decrease code coverage.\
    \ This label will identify PRs which need code coverage.\n\n- **Status: Needs Test Case**\n\n  The issue or PR needs a\
    \ test case. A test case can be a minimal code snippet\n  that reproduces an issue or a detailed set of instructions and\
    \ configuration values\n  that reproduces the issue reported. If possible a test case can be submitted in\n  the form\
    \ of a PR to Celery's integration suite. The test case will be marked\n  as failed until the bug is fixed. When a test\
    \ case cannot be run by Celery's\n  integration suite, then it's better to describe in the issue itself.\n\n- **Status:\
    \ Needs Verification**\n\n  This label is used to notify other users we need to verify the test case offered\n  by the\
    \ reporter and/or we need to include the test in our integration suite.\n\n- **Status: Not a Bug**\n\n  It has been decided\
    \ the issue reported is not a bug.\n\n- **Status: Won't Fix**\n\n  It has been decided the issue will not be fixed. Sadly\
    \ the Celery project does\n  not have unlimited resources and sometimes this decision has to be made.\n  Although, any\
    \ external contributors are invited to help out even if an\n  issue or PR is labeled as ``Status: Won't Fix``.\n\n- **Status:\
    \ Works For Me**\n\n  One or more Celery core team members have confirmed the issue reported works\n  for them.\n\n..\
    \ _`different labels`: https://github.com/celery/celery/labels\n.. _`codecov`: https://codecov.io/gh/celery/celery\n\n\
    .. _coding-style:"
