  section: Coding Style
  text: "Coding Style\n============\n\nYou should probably be able to pick up the coding style\nfrom surrounding code, but\
    \ it is a good idea to be aware of the\nfollowing conventions.\n\n* All Python code must follow the :pep:`8` guidelines.\n\
    \n:pypi:`pep8` is a utility you can use to verify that your code\nis following the conventions.\n\n* Docstrings must follow\
    \ the :pep:`257` conventions, and use the following\n  style.\n\n    Do this:\n\n    .. code-block:: python\n\n      \
    \  def method(self, arg):\n            \"\"\"Short description.\n\n            More details.\n\n            \"\"\"\n\n\
    \    or:\n\n    .. code-block:: python\n\n        def method(self, arg):\n            \"\"\"Short description.\"\"\"\n\
    \n\n    but not this:\n\n    .. code-block:: python\n\n        def method(self, arg):\n            \"\"\"\n          \
    \  Short description.\n            \"\"\"\n\n* Lines shouldn't exceed 78 columns.\n\n  You can enforce this in :command:`vim`\
    \ by setting the ``textwidth`` option:\n\n  .. code-block:: vim\n\n        set textwidth=78\n\n  If adhering to this limit\
    \ makes the code less readable, you have one more\n  character to go on. This means 78 is a soft limit, and 79 is the\
    \ hard\n  limit :)\n\n* Import order\n\n    * Python standard library (`import xxx`)\n    * Python standard library (`from\
    \ xxx import`)\n    * Third-party packages.\n    * Other modules from the current package.\n\n    or in case of code using\
    \ Django:\n\n    * Python standard library (`import xxx`)\n    * Python standard library (`from xxx import`)\n    * Third-party\
    \ packages.\n    * Django packages.\n    * Other modules from the current package.\n\n    Within these sections the imports\
    \ should be sorted by module name.\n\n    Example:\n\n    .. code-block:: python\n\n        import threading\n       \
    \ import time\n\n        from collections import deque\n        from Queue import Queue, Empty\n\n        from .platforms\
    \ import Pidfile\n        from .utils.time import maybe_timedelta\n\n* Wild-card imports must not be used (`from xxx import\
    \ *`).\n\n* For distributions where Python 2.5 is the oldest support version,\n  additional rules apply:\n\n    * Absolute\
    \ imports must be enabled at the top of every module::\n\n        from __future__ import absolute_import\n\n    * If the\
    \ module uses the :keyword:`with` statement and must be compatible\n      with Python 2.5 (celery isn't), then it must\
    \ also enable that::\n\n        from __future__ import with_statement\n\n    * Every future import must be on its own\
    \ line, as older Python 2.5\n      releases didn't support importing multiple features on the\n      same future import\
    \ line::\n\n        # Good\n        from __future__ import absolute_import\n        from __future__ import with_statement\n\
    \n        # Bad\n        from __future__ import absolute_import, with_statement\n\n     (Note that this rule doesn't apply\
    \ if the package doesn't include\n     support for Python 2.5)\n\n\n* Note that we use \"new-style\" relative imports\
    \ when the distribution\n  doesn't support Python versions below 2.5\n\n    This requires Python 2.5 or later:\n\n   \
    \ .. code-block:: python\n\n        from . import submodule\n\n\n.. _feature-with-extras:"
- file: README.rst
