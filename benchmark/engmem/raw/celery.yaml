  section: API reference
  text: "Working on Features & Patches > Verifying your contribution\nAPI reference\n~~~~~~~~~~~~~\n\nTo make sure that all\
    \ modules have a corresponding section in the API\nreference, please execute:\n\n.. code-block:: console\n\n    $ make\
    \ apicheck\n\nIf files are missing, you can add them by copying an existing reference file.\n\nIf the module is internal,\
    \ it should be part of the internal reference\nlocated in :file:`docs/internals/reference/`. If the module is public,\n\
    it should be located in :file:`docs/reference/`.\n\nFor example, if reference is missing for the module ``celery.worker.awesome``\n\
    and this module is considered part of the public API, use the following steps:\n\n\nUse an existing file as a template:\n\
    \n.. code-block:: console\n\n    $ cd docs/reference/\n    $ cp celery.schedules.rst celery.worker.awesome.rst\n\nEdit\
    \ the file using your favorite editor:\n\n.. code-block:: console\n\n    $ vim celery.worker.awesome.rst\n\n        #\
    \ change every occurrence of ``celery.schedules`` to\n        # ``celery.worker.awesome``\n\n\nEdit the index using your\
    \ favorite editor:\n\n.. code-block:: console\n\n    $ vim index.rst\n\n        # Add ``celery.worker.awesome`` to the\
    \ index.\n\n\nCommit your changes:\n\n.. code-block:: console\n\n    # Add the file to git\n    $ git add celery.worker.awesome.rst\n\
    \    $ git add index.rst\n    $ git commit celery.worker.awesome.rst index.rst \\\n        -m \"Adds reference for celery.worker.awesome\""
- file: CONTRIBUTING.rst
  line: 835
  section: Isort
  text: "Working on Features & Patches > Verifying your contribution\nIsort\n~~~~~~\n\n`Isort`_ is a python utility to help\
    \ sort imports alphabetically and separated into sections.\nThe Celery project uses isort to better maintain imports on\
    \ every module.\nPlease run isort if there are any new modules or the imports on an existent module\nhad to be modified.\n\
    \n.. code-block:: console\n\n   $ isort my_module.py # Run isort for one file\n   $ isort -rc . # Run it recursively\n\
    \   $ isort m_module.py --diff # Do a dry-run to see the proposed changes\n\n.. _`Isort`: https://isort.readthedocs.io/en/latest/\n\
    \n.. _contributing-pull-requests:"
- file: CONTRIBUTING.rst
  line: 853
  section: Creating pull requests
  text: "Working on Features & Patches\nCreating pull requests\n----------------------\n\nWhen your feature/bugfix is complete,\
    \ you may want to submit\na pull request, so that it can be reviewed by the maintainers.\n\nBefore submitting a pull request,\
    \ please make sure you go through this checklist to\nmake it easier for the maintainers to accept your proposed changes:\n\
    \n- [ ] Make sure any change or new feature has a unit and/or integration test.\n      If a test is not written, a label\
    \ will be assigned to your PR with the name\n      ``Needs Test Coverage``.\n\n- [ ] Make sure unit test coverage does\
    \ not decrease.\n      ``pytest -xv --cov=celery --cov-report=xml --cov-report term``.\n      You can check the current\
    \ test coverage here: https://codecov.io/gh/celery/celery\n\n- [ ] Run ``pre-commit`` against the code. The following\
    \ commands are valid\n      and equivalent.:\n\n      .. code-block:: console\n\n          $ pre-commit run --all-files\n\
    \          $ tox -e lint\n\n- [ ]  Build api docs to make sure everything is OK. The following commands are valid\n  \
    \    and equivalent.:\n\n      .. code-block:: console\n\n          $ make apicheck\n          $ cd docs && sphinx-build\
    \ -b apicheck -d _build/doctrees . _build/apicheck\n          $ tox -e apicheck\n\n- [ ] Build configcheck. The following\
    \ commands are valid\n      and equivalent.:\n\n      .. code-block:: console\n\n          $ make configcheck\n      \
    \    $ cd docs && sphinx-build -b configcheck -d _build/doctrees   . _build/configcheck\n          $ tox -e configcheck\n\
    \n- [ ] Run ``bandit`` to make sure there's no security issues. The following commands are valid\n      and equivalent.:\n\
    \n      .. code-block:: console\n\n          $ pip install -U bandit\n          $ bandit -b bandit.json celery/\n    \
    \      $ tox -e bandit\n\n- [ ] Run unit and integration tests for every python version. The following commands are valid\n\
    \      and equivalent.:\n\n      .. code-block:: console\n\n         $ tox -v\n\n- [ ] Confirm ``isort`` on any new or\
    \ modified imports:\n\n      .. code-block:: console\n\n        $ isort my_module.py --diff\n\nCreating pull requests\
    \ is easy, and they also let you track the progress\nof your contribution. Read the `Pull Requests`_ section in the GitHub\n\
    Guide to learn how this is done.\n\nYou can also attach pull requests to existing issues by following\nthe steps outlined\
    \ here: https://bit.ly/koJoso\n\nYou can also use `hub`_ to create pull requests. Example: https://theiconic.tech/git-hub-fbe2e13ef4d1\n\
    \n.. _`Pull Requests`: http://help.github.com/send-pull-requests/\n\n.. _`hub`: https://hub.github.com/"
- file: CONTRIBUTING.rst
  line: 1148
  section: Contributing features requiring additional libraries
  text: "Contributing features requiring additional libraries\n====================================================\n\nSome\
    \ features like a new result backend may require additional libraries\nthat the user must install.\n\nWe use setuptools\
    \ `extra_requires` for this, and all new optional features\nthat require third-party libraries must be added.\n\n1) Add\
    \ a new requirements file in `requirements/extras`\n\n    For the Cassandra backend this is\n    :file:`requirements/extras/cassandra.txt`,\
    \ and the file looks like this:\n\n    .. code-block:: text\n\n        pycassa\n\n    These are pip requirement files,\
    \ so you can have version specifiers and\n    multiple packages are separated by newline. A more complex example could\n\
    \    be:\n\n    .. code-block:: text\n\n        # pycassa 2.0 breaks Foo\n        pycassa>=1.0,<2.0\n        thrift\n\n\
    2) Modify ``setup.py``\n\n    After the requirements file is added, you need to add it as an option\n    to :file:`setup.py`\
    \ in the ``extras_require`` section::\n\n        extra['extras_require'] = {\n            # ...\n            'cassandra':\
    \ extras('cassandra.txt'),\n        }\n\n3) Document the new feature in :file:`docs/includes/installation.txt`\n\n   \
    \ You must add your feature to the list in the :ref:`bundles` section\n    of :file:`docs/includes/installation.txt`.\n\
    \n    After you've made changes to this file, you need to render\n    the distro :file:`README` file:\n\n    .. code-block::\
    \ console\n\n        $ pip install -U -r requirements/pkgutils.txt\n        $ make readme\n\n\nThat's all that needs to\
    \ be done, but remember that if your feature\nadds additional configuration options, then these needs to be documented\n\
    in :file:`docs/configuration.rst`. Also, all settings need to be added to the\n:file:`celery/app/defaults.py` module.\n\
    \nResult backends require a separate section in the :file:`docs/configuration.rst`\nfile.\n\n.. _contact_information:"
- file: CONTRIBUTING.rst
  line: 1461
  section: Updating the version number
  text: "Release Procedure\nUpdating the version number\n---------------------------\n\nThe version number must be updated\
    \ in three places:\n\n    * :file:`celery/__init__.py`\n    * :file:`docs/include/introduction.txt`\n    * :file:`README.rst`\n\
    \nThe changes to the previous files can be handled with the [`bumpversion` command line tool]\n(https://pypi.org/project/bumpversion/).\
    \ The corresponding configuration lives in\n:file:`.bumpversion.cfg`. To do the necessary changes, run:\n\n.. code-block::\
    \ console\n\n    $ bumpversion\n\nAfter you have changed these files, you must render\nthe :file:`README` files. There's\
    \ a script to convert sphinx syntax\nto generic reStructured Text syntax, and the make target `readme`\ndoes this for\
    \ you:\n\n.. code-block:: console\n\n    $ make readme\n\nNow commit the changes:\n\n.. code-block:: console\n\n    $\
    \ git commit -a -m \"Bumps version to X.Y.Z\"\n\nand make a new version tag:\n\n.. code-block:: console\n\n    $ git tag\
    \ vX.Y.Z\n    $ git push --tags"
