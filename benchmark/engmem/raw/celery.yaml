  section: Building the documentation
  text: "Working on Features & Patches\nBuilding the documentation\n--------------------------\n\nTo build the documentation,\
    \ you need to install the dependencies\nlisted in :file:`requirements/docs.txt` and :file:`requirements/default.txt`:\n\
    \n.. code-block:: console\n\n    $ pip install -U -r requirements/docs.txt\n    $ pip install -U -r requirements/default.txt\n\
    \nAdditionally, to build with no warnings, you will need to install\nthe following packages:\n\n.. code-block:: console\n\
    \n   $ apt-get install texlive texlive-latex-extra dvipng\n\nAfter these dependencies are installed, you should be able\
    \ to\nbuild the docs by running:\n\n.. code-block:: console\n\n    $ cd docs\n    $ rm -rf _build\n    $ make html\n\n\
    Make sure there are no errors or warnings in the build output.\nAfter building succeeds, the documentation is available\
    \ at :file:`_build/html`.\n\n.. _contributing-verify:"
