  section: Developing and Testing with Docker
  text: "Working on Features & Patches\nDeveloping and Testing with Docker\n----------------------------------\n\nBecause\
    \ of the many components of Celery, such as a broker and backend,\n`Docker`_ and `docker-compose`_ can be utilized to\
    \ greatly simplify the\ndevelopment and testing cycle.\n\nThe Docker components can be found within the :file:`docker/`\
    \ folder. The\nDocker image is parameterized by the ``PYTHON_IMAGE`` build argument and uses\nthe corresponding official\
    \ Python or PyPy base image.\n\nThe Docker Compose configuration provides a service for each supported Python\nversion:\n\
    \n* ``celery311`` -- Python 3.11\n* ``celery312`` -- Python 3.12\n* ``celery313`` -- Python 3.13\n* ``celery314`` -- Python\
    \ 3.14\n* ``celerypypy311`` -- PyPy 3.11\n\nTo build all Docker images:\n\n.. code-block:: console\n\n    $ make docker-build\n\
    \nTo build a specific Python version, use Docker Compose directly. For example:\n\n.. code-block:: console\n\n    $ docker\
    \ compose -f docker/docker-compose.yml build celery312\n\nand run a command in the container via:\n\n.. code-block:: console\n\
    \n    $ docker compose -f docker/docker-compose.yml run --rm celery312 <command>\n\nwhere ``<command>`` is a command to\
    \ execute in a Docker container. The\n``--rm`` flag indicates that the container should be removed after it is\nexited\
    \ and is useful to prevent accumulation of unwanted containers.\n\nSome useful commands to run:\n\n* ``bash``\n\n  To\
    \ enter the Docker container like a normal shell:\n\n  .. code-block:: console\n\n      $ docker compose -f docker/docker-compose.yml\
    \ run --rm celery312 bash\n\n* ``pytest t/unit``\n\n  To run the unit tests using Python 3.12:\n\n  .. code-block:: console\n\
    \n      $ docker compose -f docker/docker-compose.yml run --rm celery312 \\\n          pytest t/unit\n\n* ``pytest t/integration``\n\
    \n  To run the integration tests using Python 3.12:\n\n  .. code-block:: console\n\n      $ docker compose -f docker/docker-compose.yml\
    \ run --rm celery312 \\\n          pytest t/integration\n\nThe Python version can be changed by selecting the corresponding\
    \ Docker\nCompose service. For example, ``celery311``, ``celery313``, ``celery314``, or\n``celerypypy311`` can be used\
    \ instead of ``celery312``.\n\nThe Dockerfile can also be built directly with a specific Python base image\nby providing\
    \ the ``PYTHON_IMAGE`` build argument:\n\n.. code-block:: console\n\n    $ docker build \\\n        --build-arg PYTHON_IMAGE=python:3.12-slim-bookworm\
    \ \\\n        -f docker/Dockerfile .\n\nThe default value of ``PYTHON_IMAGE`` is\n``python:3.14-slim-bookworm``.\n\nBy\
    \ default, Docker Compose will mount the Celery source tree in the Docker\ncontainer, allowing code changes and testing\
    \ to be immediately visible inside\nthe Docker container. Environment variables, such as the broker and backend\nto use,\
    \ are also defined in the :file:`docker/docker-compose.yml` file.\n\nThe :file:`docker/docker-compose.yml` file defines\
    \ the necessary environment\nvariables and services to run integration tests. The Python-specific services\nalso mount\
    \ the codebase and set the ``PYTHONPATH`` environment variable to\n``/home/developer/celery``. By setting ``PYTHONPATH``\
    \ the service allows the\nmounted codebase to be used as a global module for development. If you prefer,\nyou can also\
    \ run ``python -m pip install -e .`` to install the codebase in\ndevelopment mode.\n\nIf you would like to run a Django\
    \ or stand alone project to manually test or\ndebug a feature, you can use one of the Python-version-specific images built\n\
    from this repository and mount your custom code. Here's an example:\n\nAssuming a folder structure such as:\n\n.. code-block::\
    \ console\n\n    + celery_project\n      + celery # repository cloned here.\n      + my_project\n        - manage.py\n\
    \        + my_project\n          - views.py\n\n.. code-block:: yaml\n\n    services:\n      celery312:\n        image:\
    \ celery/celery:dev-py312\n        environment:\n          TEST_BROKER: amqp://rabbit:5672\n          TEST_BACKEND: redis://redis\n\
    \        volumes:\n          - ../../celery:/home/developer/celery\n          - ../my_project:/home/developer/m"
