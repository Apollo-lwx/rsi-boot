- file: .github/CONTRIBUTING.md
  line: 5
  section: Bug fixes, feature additions, etc.
  text: 'Contributing to Pillow

    ## Bug fixes, feature additions, etc.


    Please send a pull request to the `main` branch. Please include [documentation](https://pillow.readthedocs.io) and [tests](../Tests/README.rst)
    for new features. Tests or documentation without bug fixes or feature additions are welcome too. Feel free to ask questions
    [via issues](https://github.com/python-pillow/Pillow/issues/new), [discussions](https://github.com/python-pillow/Pillow/discussions/new)
    or irc://irc.freenode.net#pil


    - Fork the Pillow repository.

    - Create a branch from `main`.

    - Develop bug fixes, features, tests, etc.

    - Run the test suite. You can enable GitHub Actions (https://github.com/MY-USERNAME/Pillow/actions) on your repo to catch
    test failures prior to the pull request, and [Codecov](https://codecov.io/gh) to see if the changed code is covered by
    tests.

    - Create a pull request to pull the changes from your branch to the Pillow `main`.'
- file: .github/CONTRIBUTING.md
  line: 23
  section: Reporting Issues
  text: 'Contributing to Pillow

    ## Reporting Issues


    When reporting issues, please include code that reproduces the issue and whenever possible, an image that demonstrates
    the issue. Please upload images to GitHub, not to third-party file hosting sites. If necessary, add the image to a zip
    or tar archive.


    The best reproductions are self-contained scripts with minimal dependencies. If you are using a framework such as plone,
    Django, or buildout, try to replicate the issue just using Pillow.'
