  section: The basics
  text: "Contributing to Tornado\n## The basics\n\n* We use `black` as code formatter and recommend configuring your editor\
    \ to run this automatically\n  (using the version specified in `requirements.txt`). Commits that are not properly formatted\n\
    \  by `black` will be rejected in CI.\n* We update `requirements.txt` infrequently. It is important to install the versions\
    \ of tools\n  like `black` and `mypy` from `requirements.txt` instead of running their latest versions\n  (don't just\
    \ use `uvx`). Older release branches like `branch6.5` have their own\n  `requirements.txt` so reinstall these tools (or\
    \ switch virtualenvs) when switching branches.\n* The `types-pycurl` package should be installed when running `mypy`.\n\
    * Run `flake8` from the project root directory so it can see `.flake8`, this prevents spurious\n  warnings.\n* Before\
    \ committing, it is recommended to run `tox -e lint,docs,py3`. This will verify that the\n  code is formatted correctly,\
    \ type checking with `mypy` passes, the `sphinx` build for docs has\n  no errors, and the main test suite passes with\
    \ the current version of python.\n* Nearly all code changes should have new or updated tests covering the changed behavior.\n\
    \  Red/green TDD is encouraged."
