- file: docs/releases/v6.5.8.rst
  line: 7
  section: Security fixes
  text: "What's new in Tornado 6.5.8 > Aug 6, 2026\nSecurity fixes\n~~~~~~~~~~~~~~\n\n- Form-encoded ``POST`` bodies are now\
    \ subject to a limit of 1000 arguments by default. This\n  prevents a CPU and memory denial of service attack. This limit\
    \ can be overridden via the\n  `.set_parse_body_config` function. Thanks to `Arpit Jain <https://github.com/arpitjain099>`_\
    \ \n  for reporting this issue.\n- Multipart parsing now rejects requests with an excessive number of parts earlier in\
    \ the parsing\n  process, limiting memory consumption. Thanks to `afldl <https://github.com/afldl>`_ for\n  reporting\
    \ this issue.\n- The deprecated mixed-case arguments to `.RequestHandler.set_cookie` now enforce the same\n  restrictions\
    \ on invalid characters that were introduced in Tornado 6.5.5 for the standard\n  lowercase arguments. Thanks to `sec-reex\
    \ <https://github.com/sec-reex>`_ and\n  `Arpit Jain <https://github.com/arpitjain099>`_ for reporting this issue."
- file: docs/releases/v6.5.6.rst
  line: 7
  section: Security fixes
  text: "What's new in Tornado 6.5.6 > May 27, 2026\nSecurity fixes\n~~~~~~~~~~~~~~\n\n- ``SimpleAsyncHTTPClient`` now strips\
    \ the ``Authorization`` and ``Cookie`` headers from the request\n  when following a redirect to a different origin. This\
    \ matches the default behavior of\n  ``CurlAsyncHTTPClient``. Applications that need different behavior here can set\n\
    \  ``follow_redirects=False`` and handle redirects manually. Thanks to `Yannick\n  Wang <https://github.com/noobone123>`_\
    \ for being first to report this issue, as well as\n  additional reporters `Kai Aizen <https://github.com/SnailSploit>`_,\n\
    \  `HunSec <https://github.com/0xHunSec>`_, and `Thai Son Dinh <https://github.com/sondt99>`_.\n  `CVE-2026-49853 <https://github.com/tornadoweb/tornado/security/advisories/GHSA-3x9g-8vmp-wqvf>`_\n\
    - ``SimpleAsyncHTTPClient`` now enforces ``max_body_size`` on the decompressed size of the response,\n  rather than the\
    \ compressed size. This prevents a denial-of-service attack via a very large\n  compressed response. Thanks to `Yuichiro\
    \ Kedashiro <https://github.com/yuui25>`_ for reporting this\n  issue.\n  `CVE-2026-49855 <https://github.com/tornadoweb/tornado/security/advisories/GHSA-mgf9-4vpg-hj56>`_\n\
    - Fixed a bug in the C extension that could have read up to three bytes past the end of an input\n  array. Thanks to `Thai\
    \ Son Dinh <https://github.com/sondt99>`_ for reporting this issue.\n  `CVE-2026-49854 <https://github.com/tornadoweb/tornado/security/advisories/GHSA-cx3h-4qpv-8hc9>`_\n\
    - ``OpenIDMixin`` has improved parsing for the ``check_authentication`` response. Thanks to\n  `Yannick Wang <https://github.com/noobone123>`_\
    \ for reporting this issue."
