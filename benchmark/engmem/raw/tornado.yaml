  text: "What's new in Tornado 6.6.0 > Oct 21, 2026\n`tornado.iostream`\n~~~~~~~~~~~~~~~~~~\n\n- Fixed a socket leak when\
    \ a timeout occurs during a TLS handshake, or when the connection\n  of a `.SSLIOStream` is cancelled.\n- Fixed errors\
    \ relating to \"existing exports of data\" on PyPy 8.0.\n- Tests now pass when Python is built with AWS-LC or BoringCrypto\
    \ instead of OpenSSL."
- file: docs/releases/v6.5.9.rst
  line: 7
  section: Security fixes
  text: "What's new in Tornado 6.5.9 > Sep 14, 2026\nSecurity fixes\n~~~~~~~~~~~~~~\n\n- `.StaticFileHandler` no longer follows\
    \ symlinks outside of the static root directory.\n  Applications that wish to continue the previous behavior may set the\
    \ new argument\n  ``allowed_symlink_directory`` to the directory (an ancestor of the static root) that\n  should be used\
    \ for symlink validation. Thanks to `Yasha-ops <https://github.com/Yasha-ops>`_\n  and `iaohkut-from-NightWolf-Team <https://github.com/iaohkut-from-NightWolf-Team>`_\
    \ for\n  reporting this issue.\n- ``curl_httpclient`` has a new ``max_body_size`` argument (default 100MB, same as\n \
    \ for ``simple_httpclient``). This limit is enforced on all requests, whether or not\n  ``streaming_callback`` is used.\
    \ ``curl_httpclient`` now also controls its memory usage\n  when decompressing response bodies. Thanks to `afldl <https://github.com/afldl>`_,\n\
    \  `iaohkut-from-NightWolf-Team <https://github.com/iaohkut-from-NightWolf-Team>`_, and\n  `aoto-tech <https://github.com/aoto-tech>`_\
    \ for reporting this issue.\n- ``simple_httpclient`` now correctly applies the ``max_body_size`` limit to responses\n\
    \  using HTTP/1.0 format (no ``Content-Length`` or ``Transfer-Encoding``). Previously it\n  silently truncated such responses\
    \ at ``max_buffer_size`` instead. Thanks to\n  `afldl <https://github.com/afldl>`_ for reporting this issue.\n- ``simple_httpclient``\
    \ now rejects responses that use more than 10 ``100 Continue`` responses,\n  which could previously cause stack overflow\
    \ errors. Thanks to `afldl <https://github.com/afldl>`_\n  for reporting this issue.\n- The limit ``ParseBodyConfig.urlencoded.max_argument``\
    \ is now applied to URL arguments\n  in addition to ``POST`` bodies. Thanks to \n  `iaohkut-from-NightWolf-Team <https://github.com/iaohkut-from-NightWolf-Team>`_,\n\
    \  `afldl <https://github.com/afldl>`_, and `manus-pi <https://github.com/manus-pi>`_\n  for reporting this issue."
