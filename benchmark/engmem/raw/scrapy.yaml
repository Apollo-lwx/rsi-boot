- file: docs/contributing.rst
  line: 4
  section: Contributing to Scrapy
  text: "Contributing to Scrapy\n======================\n\n.. important::\n\n    Double-check that you are reading the most\
    \ recent version of this document\n    at https://docs.scrapy.org/en/master/contributing.html\n\n    By participating\
    \ in this project you agree to abide by the terms of our\n    `Code of Conduct\n    <https://github.com/scrapy/scrapy/blob/master/CODE_OF_CONDUCT.md>`_.\
    \ Please\n    report unacceptable behavior to opensource@zyte.com.\n\nThere are many ways to contribute to Scrapy. Here\
    \ are some of them:\n\n* Report bugs and request features in the `issue tracker`_, trying to follow\n  the guidelines\
    \ detailed in `Reporting bugs`_ below.\n\n* Submit patches for new functionalities and/or bug fixes. Please read\n  :ref:`writing-patches`\
    \ and `Submitting patches`_ below for details on how to\n  write and submit a patch.\n\n* Blog about Scrapy. Tell the\
    \ world how you're using Scrapy. This will help\n  newcomers with more examples and will help the Scrapy project to increase\
    \ its\n  visibility.\n\n* Join the `Scrapy subreddit`_ and share your ideas on how to\n  improve Scrapy. We're always\
    \ open to suggestions.\n\n* Answer Scrapy questions at\n  `Stack Overflow <https://stackoverflow.com/questions/tagged/scrapy>`__."
- file: docs/contributing.rst
  line: 217
  section: Submitting patches
  text: "Submitting patches\n==================\n\nThe best way to submit a patch is to issue a `pull request`_ on GitHub,\n\
    optionally creating a new issue first.\n\nRemember to explain what was fixed or the new functionality (what it is, why\n\
    it's needed, etc). The more info you include, the easier will be for core\ndevelopers to understand and accept your patch.\n\
    \nIf your pull request aims to resolve an open issue, `link it accordingly\n<https://docs.github.com/en/issues/tracking-your-work-with-issues/using-issues/linking-a-pull-request-to-an-issue#linking-a-pull-request-to-an-issue-using-a-keyword>`__,\n\
    e.g.:\n\n.. code-block:: none\n\n    Resolves #123\n\nYou can also discuss the new functionality (or bug fix) before creating\
    \ the\npatch, but it's always good to have a patch ready to illustrate your arguments\nand show that you have put some\
    \ additional thought into the subject. A good\nstarting point is to send a pull request on GitHub. It can be simple enough\
    \ to\nillustrate your idea, and leave documentation/tests for later, after the idea\nhas been validated and proven useful.\
    \ Alternatively, you can start a\nconversation in the `Scrapy subreddit`_ to discuss your idea first.\n\nSometimes there\
    \ is an existing pull request for the problem you'd like to\nsolve, which is stalled for some reason. Often the pull request\
    \ is in the right\ndirection, but changes are requested by Scrapy maintainers, and the original\npull request author hasn't\
    \ had time to address them. In this case consider\npicking up this pull request: open a new pull request with all commits\
    \ from the\noriginal pull request, as well as additional changes to address the raised\nissues. Doing so helps a lot;\
    \ it is not considered rude as long as the original\nauthor is acknowledged by keeping their commits.\n\nYou can pull\
    \ an existing pull request to a local branch\nby running ``git fetch upstream pull/$PR_NUMBER/head:$BRANCH_NAME_TO_CREATE``\n\
    (replace 'upstream' with a remote name for scrapy repository,\n``$PR_NUMBER`` with an ID of the pull request, and ``$BRANCH_NAME_TO_CREATE``\n\
    with a name of the branch you want to create locally).\nSee also: https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/reviewing-changes-in-pull-requests/checking-out-pull-requests-locally#modifying-an-inactive-pull-request-locally.\n\
    \nWhen writing GitHub pull requests, try to keep titles short but descriptive.\nFor example, for bug #411: \"Scrapy hangs\
    \ if an exception raises in\nstart_requests\" prefer \"Fix hanging when exception occurs in start_requests\n(#411)\" instead\
    \ of \"Fix for #411\". Complete titles make it easy to skim through\nthe issue tracker.\n\nFinally, try to keep aesthetic\
    \ changes (:pep:`8` compliance, unused imports\nremoval, etc) in separate commits from functional changes. This will make\
    \ pull\nrequests easier to review and more likely to get merged.\n\n\n.. _coding-style:"
- file: docs/contributing.rst
  line: 290
  section: Pre-commit
  text: "Pre-commit\n==========\n\nWe use `pre-commit`_ to automatically address simple code issues before every\ncommit.\n\
    \n.. _pre-commit: https://pre-commit.com/\n\nAfter you create a local clone of your fork of the Scrapy repository:\n\n\
    #.  `Install pre-commit <https://pre-commit.com/#installation>`_.\n\n#.  On the root of your local clone of the Scrapy\
    \ repository, run the following\n    command:\n\n    .. code-block:: bash\n\n       pre-commit install\n\nNow pre-commit\
    \ will check your changes every time you create a Git commit. Upon\nfinding issues, pre-commit aborts your commit, and\
    \ either fixes those issues\nautomatically, or only reports them to you. If it fixes those issues\nautomatically, creating\
    \ your commit again should succeed. Otherwise, you may\nneed to address the corresponding issues manually first.\n\n..\
    \ _documentation-policies:"
- file: docs/contributing.rst
  line: 357
  section: Running tests
  text: "Tests\nRunning tests\n-------------\n\nTo run all tests::\n\n    tox\n\nTo run a specific test (say ``tests/test_loader.py``)\
    \ use:\n\n    ``tox -- tests/test_loader.py``\n\nTo run the tests on a specific :doc:`tox <tox:index>` environment, use\n\
    ``-e <name>`` with an environment name from ``tox.ini``. For example, to run\nthe tests with Python 3.14 use::\n\n   \
    \ tox -e py314\n\nYou can also specify a comma-separated list of environments, and use :ref:`tox’s\nparallel mode <tox:parallel_mode>`\
    \ to run the tests on multiple environments in\nparallel::\n\n    tox -e py313,py314 -p auto\n\nTo pass command-line options\
    \ to :doc:`pytest <pytest:index>`, add them after\n``--`` in your call to :doc:`tox <tox:index>`. Using ``--`` overrides\
    \ the\ndefault positional arguments defined in ``tox.ini``, so you must include those\ndefault positional arguments (``scrapy\
    \ tests``) after ``--`` as well::\n\n    tox -- scrapy tests -x  # stop after first failure\n\nYou can also use the `pytest-xdist`_\
    \ plugin. For example, to run all tests on\nthe Python 3.14 :doc:`tox <tox:index>` environment using all your CPU cores::\n\
    \n    tox -e py314 -- scrapy tests -n auto\n\nTo see coverage report install :doc:`coverage <coverage:index>`\n(``pip\
    \ install coverage``) and run:\n\n    ``coverage report``\n\nsee output of ``coverage --help`` for more options like html\
    \ or xml report.\n\nSome tests need a ``mitmdump`` executable (from mitmproxy_) to test against a\nfully featured proxy\
    \ server; they are skipped when one cannot be found\n(``mitmproxy`` is intentionally not a test dependency that would\
    \ be installed\ninto test venvs, as that sometimes leads to various dependency conflicts).\nTo run these tests, make ``mitmdump``\
    \ available in one of these ways:\n\n* install ``mitmproxy`` so that ``mitmdump`` is on your ``PATH``, e.g. with\n  pipx_\
    \ (``pipx install mitmproxy``) or uv_ (``uv tool install mitmproxy``);\n\n* have uv_ installed, in which case the tests\
    \ will run\n  ``uvx --from mitmproxy mitmdump``;\n\n* set the ``MITMDUMP`` environment variable to the path of a ``mitmdump``\n\
    \  executable."
- file: docs/contributing.rst
  line: 414
  section: Writing tests
  text: "Tests\nWriting tests\n-------------\n\nAll functionality (including new features and bug fixes) must include a test\n\
    case to check that it works as expected, so please include tests for your\npatches if you want them to get accepted sooner.\n\
    \nScrapy uses unit-tests, which are located in the `tests/`_ directory.\nTheir module name typically resembles the full\
    \ path of the module they're\ntesting. For example, the item loaders code is in::\n\n    scrapy.loader\n\nAnd their unit-tests\
    \ are in::\n\n    tests/test_loader.py\n\n.. _issue tracker: https://github.com/scrapy/scrapy/issues\n.. _contributing\
    \ to a project: https://docs.github.com/en/get-started/exploring-projects-on-github/contributing-to-a-project\n.. _scrapy-users:\
    \ https://groups.google.com/forum/#!forum/scrapy-users\n.. _Scrapy subreddit: https://www.reddit.com/r/scrapy/\n.. _tests/:\
    \ https://github.com/scrapy/scrapy/tree/master/tests\n.. _open issues: https://github.com/scrapy/scrapy/issues\n.. _PEP\
    \ 257: https://peps.python.org/pep-0257/\n.. _pull request: https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/proposing-changes-to-your-work-with-pull-requests/creating-a-pull-request\n\
    .. _pytest-xdist: https://github.com/pytest-dev/pytest-xdist\n.. _help wanted issues: https://github.com/scrapy/scrapy/issues?q=is%3Aissue+is%3Aopen+label%3A%22help+wanted%22\n\
    .. _test coverage: https://app.codecov.io/gh/scrapy/scrapy\n.. _mitmproxy: https://mitmproxy.org/\n.. _pipx: https://pipx.pypa.io/\n\
    .. _uv: https://docs.astral.sh/uv/"
