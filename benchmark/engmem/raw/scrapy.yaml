    \ They write each request\n    within its own transaction, so that an unclean shutdown cannot corrupt the\n    on-disk\
    \ queue, at the cost of slower scheduling.\n    (:gh:`845`, :gh:`7877`)\n\n-   Added a :setting:`DOWNLOAD_DELAY_JITTER`\
    \ setting, and a ``jitter`` key for\n    :setting:`DOWNLOAD_SLOTS`, which set the magnitude of the random variation\n\
