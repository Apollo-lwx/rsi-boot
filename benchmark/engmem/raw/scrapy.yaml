  text: "Release notes > Scrapy 2.17.0 (2026-07-07)\nBug fixes\n~~~~~~~~~\n\n-   :class:`~scrapy.core.downloader.handlers._httpx.HttpxDownloadHandler`\
    \ no\n    longer ignores proxy credentials for redirected or retried requests.\n    (:gh:`7601`, :gh:`7630`)\n\n-   :class:`~scrapy.extensions.feedexport.GCSFeedStorage`\
    \ now closes the\n    temporary file after the upload.\n    (:gh:`7546`)\n\n-   Fixed ``scrapy shell <URL>`` running a\
    \ full spider crawl when there is a\n    spider for the requested URL. This bug was introduced in Scrapy 2.13.0.\n   \
    \ (:gh:`7552`, :gh:`7557`)\n\n-   The :setting:`IMAGES_STORE_S3_ACL` and :setting:`IMAGES_STORE_GCS_ACL`\n    settings\
    \ are no longer ignored. This bug was introduced in Scrapy 2.12.0.\n    (:gh:`7597`, :gh:`7614`)\n\n-   :class:`~scrapy.core.downloader.handlers.ftp.FTPDownloadHandler`\
    \ now closes\n    the connection after making the request.\n    (:gh:`7602`, :gh:`7667`)\n\n-   Removed the deprecated\
    \ ``spider`` argument from the pipeline defined in the\n    default project template.\n    (:gh:`7676`)\n\n-   Fixed ``scrapy\
    \ genspider --edit`` not working.\n    (:gh:`7260`, :gh:`7683`)\n\n-   When a :class:`~scrapy.crawler.Crawler` instance\
    \ is passed to\n    :meth:`AsyncCrawlerRunner.create_crawler()\n    <scrapy.crawler.AsyncCrawlerRunner.create_crawler>`\
    \ or\n    :meth:`CrawlerRunner.create_crawler()\n    <scrapy.crawler.CrawlerRunner.create_crawler>`, settings from both\
    \ classes\n    are now merged, previously only the settings from the\n    :class:`~scrapy.crawler.Crawler` instance were\
    \ used.\n    (:gh:`1280`, :gh:`7647`)\n\n-   Fixed several issues with cookie handling in\n    :func:`scrapy.utils.request.request_to_curl`.\n\
    \    (:gh:`7603`, :gh:`7675`, :gh:`7684`)\n\n-   Fixed :class:`scrapy.resolver.CachingThreadedResolver` not disabling\
    \ the\n    cache when :setting:`DNSCACHE_ENABLED` is set to ``False``.\n    (:gh:`7663`)\n\n-   Fixed :func:`scrapy.utils.response.open_in_browser`\
    \ not removing comments\n    when looking for the ``<base>`` tag.\n    (:gh:`7506`)\n\n-   Fixed checking for deprecated\
    \ methods in custom :setting:`ITEM_PROCESSOR`\n    implementations.\n    (:gh:`7589`)\n\n-   Fixed :func:`scrapy.utils.url.strip_url`\
    \ corrupting some URLs with\n    credentials.\n    (:gh:`7604`, :gh:`7605`)\n\n-   :func:`scrapy.utils.misc.rel_has_nofollow`\
    \ now ignores the case when\n    looking for \"nofollow\" strings.\n    (:gh:`7632`)\n\n-   Fixed an exception in :class:`scrapy.utils.sitemap.Sitemap`\
    \ when parsing\n    some malformed sitemaps.\n    (:gh:`7686`, :gh:`7687`)"
