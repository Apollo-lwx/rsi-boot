    \    printf-style formatting directives.\n    (:gh:`5794`, :gh:`6425`, :gh:`7674`)\n\n-   :ref:`Feed exports <topics-feed-exports>`\
    \ now start storing a\n    :setting:`FEED_EXPORT_BATCH_ITEM_COUNT` batch as soon as it is complete,\n    instead of waiting\
