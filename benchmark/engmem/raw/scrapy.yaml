  section: Security bug fixes
  text: "Release notes > Scrapy 2.17.0 (2026-07-07)\nSecurity bug fixes\n~~~~~~~~~~~~~~~~~~\n\n-   ``s3://`` requests now\
    \ use HTTPS by default, instead of plaintext HTTP.\n\n    Previously, :class:`~scrapy.core.downloader.handlers.s3.S3DownloadHandler`\n\
    \    sent signed S3 requests over plaintext HTTP unless\n    ``request.meta[\"is_secure\"]`` was set to a true value,\
    \ exposing the request\n    path, the AWS ``Authorization`` header, the ``X-Amz-Security-Token`` header\n    (when using\
    \ temporary credentials), and the response contents to network\n    attackers, who could also tamper with responses. See\
    \ the `76g3-c3x4-crvx`_\n    security advisory for details.\n\n    To restore the previous behavior for a given request,\
    \ set\n    ``request.meta[\"is_secure\"]`` to ``False``.\n\n    .. _76g3-c3x4-crvx: https://github.com/scrapy/scrapy/security/advisories/GHSA-76g3-c3x4-crvx"
