- file: SECURITY.md
  line: 1
  section: Security Policy
  text: "# Security Policy\n\nIf you think you have identified a security issue with Pydantic, **do not open a public issue**.\n\
    \nTo responsibly report a security issue, please navigate to the \"Security\" tab of the repository, and click\n[\"Report\
    \ a vulnerability\"](https://github.com/pydantic/pydantic/security/advisories/new).\n\nBe sure to include clear details\
    \ in your report:\n\n* The affected version(s).\n* A [MRE](https://en.wikipedia.org/wiki/Minimal_reproducible_example)\
    \ of the issue. If possible, avoid complex setups\n  (e.g. multiple files, repositories to clone, Docker setups). The\
    \ MRE should make the issue obvious at a glance,\n  without requiring maintainers to break it down to understand what\
    \ is going on.\n* The section of the [threat model](#threat-model) the issue falls under. If it doesn't fit any of them,\n\
    \  explain why it should still be considered a security issue.\n* Usage of AI tools to find or write up the issue is accepted.\
    \ However, by submitting the report, you attest that you\n  have reviewed and verified its content yourself. Repeated\
    \ nonsensical reports may result in a ban from the\n  Pydantic GitHub organization."
- file: docs/contributing.md
  line: 23
  section: Pull Requests
  text: "## Pull Requests\n\nIt should be extremely simple to get started and create a Pull Request.\n\nUnless your change\
    \ is trivial (typo, docs tweak etc.), please create an issue to discuss the change before\ncreating a pull request. Any\
    \ pull request fixing an existing issue without being assigned first will be\nautomatically closed.\n\nTo make contributing\
    \ as easy and fast as possible, you'll want to run tests and linting locally. Luckily,\nPydantic has few dependencies,\
    \ doesn't require compiling and tests don't need access to databases, etc.\nBecause of this, setting up and running the\
    \ tests should be very simple.\n\n!!! tip\n    **tl;dr**: use `make format` to fix formatting, `make` to run tests and\
    \ linting and `make docs`\n    to build the docs."
- file: docs/contributing.md
  line: 161
  section: Commit and push your changes
  text: "AI policy\n### Commit and push your changes\n\nCommit your changes, push your branch to GitHub, and create a pull\
    \ request, following the pull request template. The title of the pull request\nwill be used for our changelog entry, it\
    \ should follow these guidelines:\n\n* A one-line subject, sentence case: capitalized first word, imperative mood, no\
    \ `fix:` or `feat(core):` prefix.\n* It starts with a verb that says what kind of change it is:\n    * Bug fixes: Fix\
    \ (most common), often naming the symptom and its context. E.g. \"Fix infinite recursion when validating an invalid default\"\
    .\n    * Features: Support, Add, Implement, Honor/Respect, Take … into account.\n    * Performance: Improve performance\
    \ of ... / Avoid ...\n    * Docs: Document, Correct, Add notes about ...\n    * Dependencies: Bump X from a to b.\n* Use\
    \ backticks for code elements: classes (e.g. `BaseModel`), functions (e.g. `create_model()`).\n* Do not add the referenced\
    \ issue in the title.\n\nThe pull request body should first reference the issue if there is any (e.g. \"Fixes #1234\"\
    ). The body should be succinct, spaced, and code examples are usually\nrecommended (e.g. \"before / after\" examples,\
    \ showing the changed behavior). If you need to point to existing code, use [.](https://docs.github.com/en/get-started/writing-on-github/working-with-advanced-formatting/creating-a-permanent-link-to-a-code-snippet)"
