  section: Installation and setup
  text: 'AI policy

    ### Installation and setup


    Fork the repository on GitHub and clone your fork locally.


    ```bash

    # Clone your fork and cd into the repo directory

    git clone git@github.com:<your username>/pydantic.git

    cd pydantic


    # Install UV and pre-commit

    # We use uv here, for other options see:

    # https://docs.astral.sh/uv/getting-started/installation/

    # https://pre-commit.com/#install

    curl -LsSf https://astral.sh/uv/install.sh | sh

    uv tool install pre-commit


    # Install pydantic, dependencies, test dependencies and doc dependencies

    make install

    ```'
- file: docs/contributing.md
  line: 90
  section: Writing tests
  text: "AI policy\n### Writing tests\n\nPydantic currently has two separate test suites: the Pydantic test suite (located\
    \ in `tests/`), and the `pydantic-core` test suite (located in `pydantic-core/tests`).\n`pydantic-core/tests` is symlinked\
    \ under `tests/pydantic_core/`, so that a single `pytest` invocation can run all of them. For it to work, you may need\
    \ to\nenable the [`core.symlinks`](https://git-scm.com/docs/git-config#Documentation/git-config.txt-coresymlinks) Git\
    \ option.\n\nWhen adding new tests, prefer adding them in `tests`, using the Pydantic Python API. Most `pydantic-core`\
    \ tests are using internal APIs (e.g. `SchemaValidator`).\nMake sure to look for the right place to add a test, read the\
    \ existing test files first. Tests related to types must go in `tests/types/` (one file per type, e.g. `tests/types/test_uuid.py`)\n\
    (create a file if it doesn't exist yet).\n\nWhen introcuding a test for a specific issue/feature request, mention the\
    \ issue link as a docstring, e.g.:\n\n```python\ndef test_some_feature() -> None:\n    \"\"\"https://github.com/pydantic/pydantic/issues/1234\"\
    \"\"\n```\n\nThe test you are adding may be relevant for Pydantic models as well as dataclasses and `TypedDict`. As such,\
    \ it may be beneficial to use the `container_class` fixture,\nor the `dataclass_decorators()` test utility.\n\nWhen using\
    \ `pytest.raises()`, prefer using the `check=lambda err: ...` argument, instead of asserting on `exc_info`."
- file: docs/contributing.md
