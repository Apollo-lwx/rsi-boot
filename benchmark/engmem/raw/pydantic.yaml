- file: SECURITY.md
  line: 20
  section: Supported versions
  text: 'Security Policy

    ## Supported versions


    Security fixes are only made to the latest minor release of Pydantic V2, and are published as a new patch release.

    Fixes are not backported to older minor releases. Reports must be reproducible on the latest release.


    Maintainers may still publish advisories for issues affecting older releases, depending on the severity.'
- file: SECURITY.md
  line: 100
  section: Security assumptions
  text: "Security Policy > Threat model\n### Security assumptions\n\nPydantic's security posture relies on the following assumptions.\
    \ Applications are responsible for:\n\n* **Bounding the size of user-controlled input** (e.g. using request body size\
    \ limits of the web server, or\n  `max_length` constraints). Pydantic is used in very different contexts (web APIs, configuration,\
    \ data pipelines, etc)\n  and thus cannot define a reasonable maximum input size.\n* **Defining reasonable schemas**:\
    \ schemas should plausibly exist in a production application and follow\n  documented best practices.\n* **Not relying\
    \ on serialization to protect sensitive data**: fields excluded by the declared type (e.g. fields only\n  present on a\
    \ subclass), or with `include`/`exclude` filters, should not be the only control preventing sensitive\n  data from being\
    \ exposed. Use dedicated response models, `Field(exclude=True)` or secret types instead.\n* **Not exposing validation\
    \ errors containing sensitive data**: validation errors include the invalid input by default\n  (this can be disabled\
    \ using the [`hide_input_in_errors`](https://pydantic.dev/docs/validation/latest/api/pydantic/config/#pydantic.config.ConfigDict.hide_input_in_errors)\n\
    \  configuration value)."
- file: SECURITY.md
  line: 118
  section: Validation bypass
  text: 'Security Policy > Threat model > Threats

    #### Validation bypass


    Pydantic accepts user-controlled input that should be rejected according to the schema and the documented behavior.

    [Coercions](https://pydantic.dev/docs/validation/latest/concepts/models/#data-conversion) (in lax mode) are not validation
    bypasses.

    The following are examples of valid vulnerabilities:


    * Accepting `''not_an_int''` for `int` types (`''1''` for `int` is fine due to type coercion).

    * Allowing a list of length 3 for `Annotated[list, Field(max_length=2)]`.'
- file: SECURITY.md
  line: 127
  section: Denial of service
  text: "Security Policy > Threat model > Threats\n#### Denial of service\n\nGiven that applications are expected to bound\
    \ the size of user-controlled input, we only consider as a denial of\nservice a validation time or memory usage that grows\
    \ **super-linearly** (quadratic or worse) with the size of the input,\nand that is significant in practice: the resource\
    \ usage should be disproportionate to the size of the input (e.g.\nseconds of CPU time or hundreds of megabytes of memory\
    \ for an input that would commonly be accepted).\n\n##### 1. Super-linear growth (in scope)\n\nThe following would be\
    \ considered a security issue:\n\n```python\nfrom pydantic import TypeAdapter\n\nta = TypeAdapter(int)\n\n# If this were\
    \ to take ~12s, as the validation time would grow with the value\n# of the exponent (i.e. exponentially with the length\
    \ of the input):\nta.validate_python('10e11212')\n```\n\n##### 2. Linear growth (out of scope)\n\nValidation cost that\
    \ grows linearly is expected, even with a large constant factor (it may still be reported as\na regular performance issue):\n\
    \n```python\nfrom pydantic import TypeAdapter\n\nta = TypeAdapter(list[int])\n\n# ~4MB of JSON data, using ~280MB of memory\
    \ to hold one million validation errors.\n# Memory grows linearly with the number of invalid items:\nta.validate_json('['\
    \ + ','.join(['\"a\"'] * 1_000_000) + ']')\n```\n\n##### 3. Schemas not following best practices (out of scope)\n\nSuper-linear\
    \ behavior inherent to the documented semantics of a schema that doesn't follow best practices is not\nconsidered a security\
    \ issue. For example, with recursive models using untagged unions where every member can validate\nthe same nested data,\
    \ the nested data is validated once per union member at each level, which is how untagged\nunions work:\n\n```python\n\
    from __future__ import annotations\n\nfrom pydantic import BaseModel\n\n\nclass A(BaseModel):\n    child: A | B | None\n\
    \n\nclass B(BaseModel):\n    child: A | B | None\n```\n\n[Discriminated unions](https://docs.pydantic.dev/latest/concepts/unions/#discriminated-unions)\
    \ should be used instead.\n\n##### 4. Cost inherent to the produced object (out of scope)\n\nSuper-linear behavior inherent\
    \ to the Python object being produced is not considered a security issue, as any code\nproducing the same object would\
    \ be affected. For example, building a `dict` or `set` from crafted integers can be\nquadratic, as integer hashes are\
    \ not randomized in CPython. If this is a concern, the number of items can be bounded\nusing `max_length`:\n\n```python\n\
    from typing import Annotated\n\nfrom pydantic import Field, TypeAdapter\n\nta = TypeAdapter(Annotated[set[int], Field(max_length=100)])\n\
    ```\n\nSuper-linear behavior introduced by Pydantic itself (i.e. not inherent to the object being produced) is still in\
    \ scope."
- file: docs/contributing.md
  line: 3
  section: Issues
  text: '## Issues


    Questions, feature requests and bug reports are all welcome as [discussions or issues](https://github.com/pydantic/pydantic/issues/new/choose).

    **However, to report a security vulnerability, please see our [security policy](https://github.com/pydantic/pydantic/security/policy).**


    To make it as simple as possible for us to help you, please include the output of the following call in your issue:


    ```bash

    python -c "import pydantic.version; print(pydantic.version.version_info())"

    ```


    If you''re using Pydantic prior to **v2.0** please use:


    ```bash

    python -c "import pydantic.utils; print(pydantic.utils.version_info())"

    ```


    Please try to always include the above unless you''re unable to install Pydantic or **know** it''s not relevant

    to your question or feature request.'
- file: docs/contributing.md
  line: 39
  section: AI policy
  text: '## AI policy


    We welcome the use of AI when contributing to Pydantic. However, users should certify that they fully understand the code
    being submitted.

    We reserve the right to close any pull request at our discretion, without further justification. This includes, but is
    not limited to, cases where:


    * the contribution does not meet our quality standards,

    * the author appears to be mass-submitting pull requests across multiple repositories (spam),

    * the pull request description is AI generated *and* incoherent or nonsensical.


    Such behavior can also result in a permanent ban from the organization.'
- file: docs/contributing.md
