- file: docs/contributing.md
  line: 183
  section: Code documentation
  text: "Documentation style\n### Code documentation\n\nWhen contributing to Pydantic, please make sure that all code is well\
    \ documented. The following should be documented using properly formatted docstrings:\n\n* Modules\n* Class definitions\n\
    * Function definitions\n* Module-level variables\n\nPydantic uses [Google-style docstrings](https://google.github.io/styleguide/pyguide.html#38-comments-and-docstrings)\
    \ formatted according to [PEP 257](https://www.python.org/dev/peps/pep-0257/) guidelines. (See [Example Google Style Python\
    \ Docstrings](https://sphinxcontrib-napoleon.readthedocs.io/en/latest/example_google.html) for further examples.)\n\n\
    Ruff lints docstrings automatically. You can run `make format` to auto-fix any docstring issues.\n\nWhere there is a conflict\
    \ between Google-style docstrings and Ruff linting, follow the Ruff linting hints.\n\nClass attributes and function arguments\
    \ should be documented in the format \"name: description.\" When applicable, a return type should be documented with just\
    \ a description. Types are inferred from the signature.\n\n```python\nclass Foo:\n    \"\"\"A class docstring.\n\n   \
    \ Attributes:\n        bar: A description of bar. Defaults to \"bar\".\n    \"\"\"\n\n    bar: str = 'bar'\n```\n\n```python\n\
    def bar(self, baz: int) -> str:\n    \"\"\"A function docstring.\n\n    Args:\n        baz: A description of `baz`.\n\n\
    \    Returns:\n        A description of the return value.\n    \"\"\"\n\n    return 'bar'\n```\n\nYou may include example\
    \ code in docstrings. This code should be complete, self-contained, and runnable. Docstring examples are tested, so make\
    \ sure they are correct and complete. See [`AfterValidator`][pydantic.functional_validators.AfterValidator] for an example.\n\
    \n!!! note \"Class and instance attributes\"\n    Class attributes should be documented in the class docstring.\n\n  \
    \  Instance attributes should be documented as \"Args\" in the `__init__()` docstring."
- file: docs/contributing.md
  line: 232
  section: Documentation Style
  text: 'Documentation style

    ### Documentation Style


    In general, documentation should be written in a friendly, approachable style. It should be easy to read and understand,
    and should be as concise as possible while still being complete.


    Code examples are encouraged, but should be kept short and simple. However, every code example should be complete, self-contained,
    and runnable. (If you''re not sure how to do this, ask for help!) We prefer print output to naked asserts, but if you''re
    testing something that doesn''t have a useful print output, asserts are fine.


    Pydantic''s unit test will test all code examples in the documentation, so it''s important that they are correct and complete.
    When adding a new code example, use the following to test examples and update their formatting and output:


    ```bash

    # Run tests and update code examples

    pytest tests/test_docs.py --update-examples

    ```'
