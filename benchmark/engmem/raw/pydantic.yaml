  text: "## v2.12.4 (2025-11-05)\n\n[GitHub release](https://github.com/pydantic/pydantic/releases/tag/v2.12.4)\n\nThis is\
    \ the fourth 2.12 patch release, fixing more regressions, and reverting a change in the `build()` method\nof the [`AnyUrl`\
    \ and Dsn types](https://pydantic.dev/docs/validation/latest/api/pydantic/networks/).\n\nThis patch release also fixes\
    \ an issue with the serialization of IP address types, when `serialize_as_any` is used. The next patch release\nwill try\
    \ to address the remaining issues with *serialize as any* behavior by introducing a new *polymorphic serialization* feature,\
    \ that\nshould be used in most cases in place of *serialize as any*.\n\n* Fix issue with forward references in parent\
    \ `TypedDict` classes by @Viicos in [#12427](https://github.com/pydantic/pydantic/pull/12427).\n\n    This issue is only\
    \ relevant on Python 3.14 and greater.\n\n* Exclude fields with `exclude_if` from JSON Schema required fields by @Viicos\
    \ in [#12430](https://github.com/pydantic/pydantic/pull/12430)\n* Revert URL percent-encoding of credentials in the `build()`\
    \ method\n  of the [`AnyUrl` and Dsn types](https://pydantic.dev/docs/validation/latest/api/pydantic/networks/) by @davidhewitt\
    \ in\n  [pydantic-core#1833](https://github.com/pydantic/pydantic-core/pull/1833).\n\n    This was initially considered\
    \ as a bugfix, but caused regressions and as such was fully reverted. The next release will include\n    an opt-in option\
    \ to percent-encode components of the URL.\n\n* Add type inference for IP address types by @davidhewitt in [pydantic-core#1868](https://github.com/pydantic/pydantic-core/pull/1868).\n\
    \n    The 2.12 changes to the `serialize_as_any` behavior made it so that IP address types could not properly serialize\
    \ to JSON.\n\n* Avoid getting default values from defaultdict by @davidhewitt in [pydantic-core#1853](https://github.com/pydantic/pydantic-core/pull/1853).\n\
    \n    This fixes a subtle regression in the validation behavior of the [`collections.defaultdict`](https://docs.python.org/3/library/collections.html#collections.defaultdict)\n\
    \    type.\n\n* Fix issue with field serializers on nested typed dictionaries by @davidhewitt in [pydantic-core#1879](https://github.com/pydantic/pydantic-core/pull/1879).\n\
    * Add more `pydantic-core` builds for the three-threaded version of Python 3.14 by @davidhewitt in [pydantic-core#1864](https://github.com/pydantic/pydantic-core/pull/1864)."
