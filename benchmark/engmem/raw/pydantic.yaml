  section: Run tests and linting
  text: 'AI policy

    ### Run tests and linting


    Run tests and linting locally to make sure everything is working as expected.


    ```bash

    # Run automated code formatting and linting

    make format

    # Pydantic uses ruff, an awesome Python linter written in Rust

    # https://github.com/astral-sh/ruff


    # Run tests and linting

    make

    # There are a few sub-commands in Makefile like `test`, `testcov` and `lint`

    # which you might want to use, but generally just `make` should be all you need.

    # You can run `make help` to see more options.

    ```'
- file: docs/contributing.md
  line: 129
  section: Build documentation
  text: 'AI policy

    ### Build documentation


    If you''ve made any changes to the documentation (including changes to function signatures, class definitions, or docstrings
    that will appear in the API documentation), make sure it builds successfully.


    We use `mkdocs-material[imaging]` to support social previews (see the [plugin documentation](https://squidfunk.github.io/mkdocs-material/plugins/requirements/image-processing/)).


    ```bash

    # Build documentation

    make docs

    # If you have changed the documentation, make sure it builds successfully.

    # You can also use `uv run mkdocs serve` to serve the documentation at localhost:8000

    ```


    If this isn''t working due to issues with the imaging plugin, try commenting out the `social` plugin line in `mkdocs.yml`
    and running `make docs` again.'
- file: docs/contributing.md
  line: 144
  section: Updating the documentation
  text: "AI policy > Build documentation\n#### Updating the documentation\n\nWe push a new version of the documentation with\
    \ each minor release, and we push to a `dev` path with each commit to `main`.\n\nIf you're updating the documentation\
    \ out of cycle with a minor release and want your changes to be reflected on `latest`,\ndo the following:\n\n1. Open a\
    \ PR against `main` with your docs changes\n2. Once the PR is merged, checkout the `docs-update` branch. This branch should\
    \ be up to date with the latest patch release.\nFor example, if the latest release is `v2.9.2`, you should make sure `docs-update`\
    \ is up to date with the `v2.9.2` tag.\n3. Checkout a new branch from `docs-update` and cherry-pick your changes onto\
    \ this branch.\n4. Push your changes and open a PR against `docs-update`.\n5. Once the PR is merged, the new docs will\
    \ be built and deployed.\n\n!!! note\n    Maintainer shortcut - as a maintainer, you can skip the second PR and just cherry\
    \ pick directly onto the `docs-update` branch."
