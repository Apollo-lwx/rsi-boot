  - {name: httpx,       url: https://github.com/encode/httpx.git,           license: BSD-3-Clause}
  - {name: fastapi,     url: https://github.com/fastapi/fastapi.git,        license: MIT}
  - {name: starlette,   url: https://github.com/encode/starlette.git,       license: BSD-3-Clause}
  - {name: uvicorn,     url: https://github.com/encode/uvicorn.git,         license: BSD-3-Clause}
  - {name: pydantic,    url: https://github.com/pydantic/pydantic.git,      license: MIT}
  - {name: pytest,      url: https://github.com/pytest-dev/pytest.git,      license: MIT}
