# EngMem-Bench 仓库清单 v0.1
# 选仓标准：MIT/Apache/BSD 系许可证；社区活跃；有 CONTRIBUTING/AGENTS/docs 等
# 工程约定类文档；Python 生态为主（与 RSI Boot 的目标用户场景一致）。
# commit 字段由 collect.py 首次克隆后回写到 repos.lock.yaml，benchmark 以锁为准。
