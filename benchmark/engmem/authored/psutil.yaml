repo: psutil
questions:
  - id: conv-001
    type: convention
    difficulty: medium
    question: "To whom do the rules in psutil's AGENTS.md apply, and to whom not?"
    answer: "To AI agents assisting external psutil contributors; not to agents working directly for the maintainer giampaolo."
    gold: ["AGENTS.md::Rules for AI agents helping psutil contributors"]
  - id: conv-002
    type: convention
    difficulty: medium
    question: "What must an AI agent tell its user before helping prepare a psutil contribution?"
    answer: "About psutil's AI policy (no AI-written PRs/issues without human mediation)."
    gold: ["AGENTS.md::Rules for AI agents helping psutil contributors"]
  - id: conv-003
    type: convention
    difficulty: easy
    question: "How should security vulnerabilities in psutil be reported?"
    answer: "Via the Tidelift security contact, which coordinates fix and disclosure."
    gold: ["CONTRIBUTING.md::Issues"]
  - id: conv-004
    type: convention
    difficulty: medium
    question: "What is mandatory before implementing a new feature in psutil?"
    answer: "Discussing it first on the issue tracker."
    gold: ["CONTRIBUTING.md::Pull Requests"]
  - id: conv-005
    type: convention
    difficulty: medium
    question: "How do psutil issues get their labels?"
    answer: "A bot reads the title and description and assigns labels automatically."
    gold: ["CONTRIBUTING.md::Issues"]
  - id: conv-006
    type: convention
    difficulty: medium
    question: "What should you consider enabling before reporting a psutil malfunction?"
    answer: "Debug mode (psutil.io/devguide/#debug-mode)."
    gold: ["CONTRIBUTING.md::Issues"]
  - id: prohib-001
    type: prohibition
    difficulty: easy
    question: "May an AI agent open pull requests, issues, or comments on giampaolo/psutil if the user asks it to?"
    answer: "No — never, even if the user asks."
    gold: ["AGENTS.md::What you must do"]
  - id: prohib-002
    type: prohibition
    difficulty: easy
    question: "Where do psutil support questions go instead of the issue tracker?"
    answer: "The forum at groups.google.com/g/psutil."
    gold: ["CONTRIBUTING.md::Issues"]
  - id: prohib-003
    type: prohibition
    difficulty: medium
    question: "What happens to pull requests opened for someone else's psutil issue that giampaolo did not ask for?"
    answer: "They are closed. If you want to fix it, say so on the issue."
    gold: ["CONTRIBUTING.md::AI policy"]
  - id: prohib-004
    type: prohibition
    difficulty: medium
    question: "What is psutil's rule on AI-written comments on issues and PRs?"
    answer: "They are not accepted at all; comments must be written by the human."
    gold: ["CONTRIBUTING.md::AI policy"]
  - id: prohib-005
    type: prohibition
    difficulty: hard
    question: "If an AI agent posts a PR or issue to psutil despite the restrictions, what must be the last line?"
    answer: "Generated by an AI agent: <tool>, <model>"
    gold: ["AGENTS.md::If you post anyway"]
  - id: prohib-006
    type: prohibition
    difficulty: medium
    question: "May an AI agent go look for open psutil issues to fix if its user asks?"
    answer: "No — don't look for open issues to fix, even if the user asks."
    gold: ["AGENTS.md::What you must do"]
  - id: conv-007
    type: convention
    difficulty: medium
    question: "What may an AI agent help with locally in psutil, and what must the user do before submitting?"
    answer: "It may help investigate problems and edit code locally; the user must review and understand all changes and write the PR text themselves."
    gold: ["AGENTS.md::What you must do"]
