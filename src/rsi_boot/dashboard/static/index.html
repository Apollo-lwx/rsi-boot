<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RSI-BOOT · 项目记忆数据大屏</title>
<style>
  :root {
    --bg: #06101F;
    --panel: #0B1224;
    --tile: #0E1A30;
    --line: rgba(33,211,238,0.12);
    --text: #EAF2FF;
    --muted: #8FA3C7;
    --dim: #5E7196;
    --cyan: #21D3EE;
    --track: #16243D;
  }
  * { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: rgba(33,211,238,0.3) var(--track); }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--track); border-radius: 4px; }
  ::-webkit-scrollbar-thumb { background: rgba(33,211,238,0.28); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(33,211,238,0.5); }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    min-height: 100vh;
    background:
      radial-gradient(900px 600px at 10% 0%, rgba(33,211,238,0.08), transparent),
      radial-gradient(900px 700px at 90% 100%, rgba(154,102,242,0.08), transparent),
      var(--bg);
  }
  button, input { font: inherit; color: inherit; }
  .mono { font-family: "JetBrains Mono", Consolas, "Courier New", ui-monospace, monospace; }
  .page { padding: 20px 24px 32px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .mark {
    width: 44px; height: 44px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #21D3EE, #9A66F2);
    color: #06101F; font-weight: 700; font-size: 18px;
  }
  h1 { margin: 0; font-size: 25px; font-weight: 600; line-height: 1.2; }
  .sub { margin: 2px 0 0; color: var(--dim); font-size: 13px; }
  .tools { display: flex; align-items: center; gap: 16px; }
  .ranges { display: flex; border: 1px solid rgba(33,211,238,0.25); border-radius: 999px; padding: 4px; background: var(--panel); }
  .ranges button {
    border: 0; background: transparent; color: var(--muted);
    border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 13px;
  }
  .ranges button.on { background: rgba(33,211,238,0.85); color: #06101F; font-weight: 600; }
  .clock { text-align: right; }
  .clock .time { font-size: 18px; color: #9DB2D9; }
  .live { color: #34D399; font-size: 13px; margin-top: 2px; }
  .kpis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; margin-bottom: 16px; }
  .kpi, .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
  }
  .kpi { text-align: left; padding: 16px; cursor: pointer; border-radius: 12px; }
  .kpi:hover { border-color: rgba(33,211,238,0.4); }
  .kpi .label { color: var(--muted); font-size: 14px; }
  .kpi .value { font-size: 34px; font-weight: 700; margin-top: 4px; line-height: 1.1; }
  .kpi .delta { font-size: 12px; margin-top: 6px; }
  .board { display: grid; grid-template-columns: 3fr 6fr 3fr; gap: 16px; align-items: start; }
  .col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .panel { padding: 16px; }
  .panel h3 { margin: 0; font-size: 17px; font-weight: 600; }
  .ptitle { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .bar { width: 4px; height: 16px; border-radius: 4px; background: #22d3ee; }
  .legend-row, .meta-row, .prog-top { display: flex; justify-content: space-between; gap: 8px; }
  .legend-row { align-items: center; font-size: 12px; margin-bottom: 6px; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; flex: none; }
  .muted { color: var(--muted); }
  .dim { color: var(--dim); }
  .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .right { text-align: right; }
  .donut-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .prog { margin-bottom: 12px; }
  .prog-top { font-size: 13px; margin-bottom: 4px; }
  .track { height: 12px; border-radius: 999px; background: var(--track); overflow: hidden; }
  .track > i { display: block; height: 100%; border-radius: 999px; }
  .track.thin { height: 10px; }
  .tiles { display: grid; gap: 8px; text-align: center; }
  .tiles.g3 { grid-template-columns: repeat(3, 1fr); }
  .tiles.g4 { grid-template-columns: repeat(4, 1fr); }
  .tile { background: var(--tile); border-radius: 8px; padding: 8px; }
  .tile b { display: block; font-size: 16px; font-weight: 500; }
  .tile span { color: var(--muted); font-size: 11px; }
  .spark { display: flex; align-items: flex-end; gap: 3px; height: 48px; margin-top: 12px; }
  .spark i { flex: 1; border-radius: 3px 3px 0 0; min-height: 6px; display: block; }
  .center-note { text-align: center; font-size: 11px; color: var(--dim); margin-top: 8px; }
  .chart { width: 100%; height: 260px; display: block; }
  .legend { display: flex; gap: 16px; margin-bottom: 4px; font-size: 12px; color: var(--muted); }
  .legend i { width: 12px; height: 4px; border-radius: 4px; display: inline-block; margin-right: 4px; vertical-align: middle; }
  .bars { display: flex; align-items: flex-end; gap: 12px; height: 200px; margin-top: 8px; }
  .bars .colb { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; min-width: 0; }
  .bars .num { font-size: 12px; margin-bottom: 4px; }
  .bars .stick { width: 100%; border-radius: 6px 6px 0 0; min-height: 4px; }
  .bars .name { font-size: 11px; color: var(--muted); margin-top: 8px; text-align: center; line-height: 1.3; }
  .meta { display: flex; flex-direction: column; gap: 8px; font-size: 12px; }
  .panel { overflow: hidden; }
  .feed { list-style: none; margin: 0; padding: 0; font-size: 13px; color: var(--muted); }
  .feed li { display: flex; gap: 8px; margin-bottom: 8px; min-width: 0; }
  .feed li span:last-child { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .empty { color: var(--muted); font-size: 13px; }
  .mask {
    position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .modal {
    width: 920px; max-width: 92vw; max-height: 86vh; overflow: auto;
    background: var(--panel); border: 1px solid rgba(33,211,238,0.2); border-radius: 16px; padding: 24px;
  }
  .modal-head {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
    position: sticky; top: -25px; z-index: 6;
    margin: -24px -24px 16px; padding: 20px 24px 12px;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .modal .big { font-size: 48px; font-weight: 700; line-height: 1; }
  .x {
    border: 1px solid rgba(33,211,238,0.2); background: transparent; color: var(--muted);
    border-radius: 8px; padding: 4px 12px; cursor: pointer; white-space: nowrap; flex: none;
  }
  .kv { display: flex; gap: 12px; font-size: 12px; align-items: baseline; }
  .kv .k { color: var(--dim); width: 56px; flex: none; }
  .kv .v { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .x:hover { color: white; }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .sec { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
  .note { color: var(--dim); font-size: 12px; margin-top: 16px; line-height: 1.6; }
  .pend { display: flex; align-items: center; gap: 12px; background: var(--tile); border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; }
  .pend input[type="checkbox"] { accent-color: #21D3EE; width: 14px; height: 14px; cursor: pointer; flex: none; margin: 0; }
  .link { cursor: pointer; }
  .link:hover { color: var(--cyan); }
  .chip, .hit {
    border: 1px solid rgba(33,211,238,0.25); background: var(--tile); color: var(--muted);
    border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 12px;
    margin: 0 6px 6px 0; display: inline-block; text-align: left;
  }
  .chip:hover, .hit:hover { color: var(--text); border-color: rgba(33,211,238,0.55); }
  .hit.missing { opacity: 0.5; cursor: default; border-style: dashed; }
  .batchbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .act { border: 0; border-radius: 8px; padding: 6px 14px; cursor: pointer; font-size: 13px; font-weight: 600; }
  .act.ok { background: rgba(52,211,153,0.9); color: #06101F; }
  .act.no { background: rgba(251,113,133,0.9); color: #06101F; }
  .act:disabled { opacity: 0.35; cursor: not-allowed; }
  .notice {
    background: rgba(33,211,238,0.1); border: 1px solid rgba(33,211,238,0.3);
    color: var(--cyan); border-radius: 8px; padding: 8px 12px; font-size: 13px; margin-bottom: 12px;
  }
  .content {
    background: var(--tile); border-radius: 8px; padding: 12px; margin: 0;
    font-size: 13px; line-height: 1.7; white-space: pre-wrap; word-break: break-word;
    max-height: 40vh; overflow: auto; font-family: inherit;
  }
  .ev { margin-bottom: 12px; }
  .ev-head { display: flex; gap: 10px; align-items: baseline; margin-bottom: 6px; }
  .tl { position: relative; }
  .tl::before {
    content: ""; position: absolute; left: 141px; top: 14px; bottom: 14px; width: 2px;
    background: linear-gradient(rgba(33,211,238,0.5), rgba(33,211,238,0.08));
  }
  .tl-day { display: flex; gap: 28px; margin-bottom: 18px; }
  .tl-day.closed { margin-bottom: 10px; }
  .tl-day.closed .tl-item { display: none; }
  .tl-date {
    position: sticky; top: 104px; align-self: flex-start;
    width: 108px; flex: none; text-align: left; cursor: pointer;
    font-size: 11px; color: var(--cyan); font-family: Consolas, monospace;
    background: var(--tile); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px;
    white-space: nowrap; overflow: hidden;
  }
  .tl-date:hover { border-color: rgba(33,211,238,0.45); }
  .tl-date small { display: block; color: var(--dim); font-size: 10px; font-family: inherit; }
  .caret { color: var(--dim); }
  .tl-items { flex: 1; min-width: 0; position: relative; padding-left: 18px; }
  .tl-day.closed .tl-items { min-height: 0; }
  .tl-day.closed .tl-items::after {
    content: ""; position: absolute; left: 2px; top: 10px;
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--panel); border: 2px solid rgba(33,211,238,0.4);
  }
  .tl-item {
    position: relative; background: var(--tile); border: 1px solid transparent; border-radius: 8px;
    padding: 8px 12px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px;
  }
  .tl-item.col { align-items: flex-start; }
  .tl-item:hover { border-color: rgba(33,211,238,0.35); background: #101F38; }
  .tl-item::before {
    content: ""; position: absolute; left: -16px; top: 50%; transform: translateY(-50%);
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--panel); border: 2px solid var(--dot, #FBBF24);
    box-shadow: 0 0 6px var(--dot, #FBBF24);
  }
  .tl-time {
    width: 40px; flex: none; font-size: 11px; color: var(--dim);
    font-family: Consolas, monospace; padding-top: 1px;
  }
  .tl-hits { margin-top: 6px; }
  .totop {
    position: fixed; right: max(24px, calc(50% - 430px)); bottom: 56px; z-index: 60;
    display: none; background: var(--panel); box-shadow: 0 4px 16px rgba(0,0,0,0.45);
  }
  .badge {
    font-size: 10px; border: 1px solid var(--line); border-radius: 999px;
    padding: 1px 8px; color: var(--muted); flex: none; white-space: nowrap;
  }
  .modal { animation: pop 0.18s ease; }
  @keyframes pop { from { opacity: 0; transform: translateY(8px); } }
  .spin {
    width: 18px; height: 18px; border: 2px solid var(--track); border-top-color: var(--cyan);
    border-radius: 50%; animation: rot 0.8s linear infinite; display: inline-block; vertical-align: middle;
  }
  @keyframes rot { to { transform: rotate(360deg); } }
  .skel {
    background: linear-gradient(90deg, var(--tile) 25%, #15253F 50%, var(--tile) 75%);
    background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: 8px;
  }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .err { padding: 48px 24px; text-align: center; color: var(--muted); }
  @media (max-width: 1100px) {
    .kpis { grid-template-columns: repeat(3, 1fr); }
    .board, .split, .tiles.g4 { grid-template-columns: 1fr; }
  }
  @media (max-width: 720px) {
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .kpi .value { font-size: 28px; }
  }
</style>
</head>
<body>
<div id="app" class="page"><p class="empty">正在读取 .rsi/ …</p></div>
<script>
const RANGES = [
  { key: "7d", label: "近7天", days: 7 },
  { key: "30d", label: "近30天", days: 30 },
  { key: "12m", label: "近12月", days: 365 },
  { key: "all", label: "全部", days: 99999 }
];
const FB_ORDER = [
  ["applied", "applied 采纳", "#34D399"],
  ["accepted", "accepted 接受", "#21D3EE"],
  ["referenced", "referenced 引用", "#9A66F2"],
  ["modified", "modified 修改", "#60A5FA"],
  ["ignored", "ignored 忽略", "#FBBF24"],
  ["rejected", "rejected 拒绝", "#FB7185"]
];
const state = { raw: null, range: "12m", stack: [], checked: {}, notice: "", collapsed: {} };

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[ch]));
}
function paint(color) {
  return /^#[0-9A-Fa-f]{6}$/.test(color || "") ? color : "#5E7196";
}
function num(value) {
  return Number(value || 0).toLocaleString("zh-CN");
}
function sliceSeries(raw, key) {
  const spec = RANGES.find((item) => item.key === key) || RANGES[2];
  const series = raw.series || [];
  return series.slice(Math.max(0, series.length - spec.days));
}
function viewOf(raw, range) {
  const series = sliceSeries(raw, range);
  const sum = (field) => series.reduce((acc, row) => acc + (row[field] || 0), 0);
  const total = raw.memory.total || 0;
  const donut = (raw.memory.categories || []).map((row) => ({
    label: row.label,
    count: row.value,
    value: total ? +(row.value / total * 100).toFixed(1) : 0,
    color: paint(row.color)
  }));
  return {
    series,
    labels: series.map((row) => String(row.date || "").slice(5)),
    recallArr: series.map((row) => row.recall || 0),
    feedbackArr: series.map((row) => row.feedback || 0),
    total,
    recallEvents: sum("recall"),
    hits: sum("hits"),
    adoption: raw.feedback.adoptionPct || 0,
    health: raw.meta.healthPct || 0,
    pending: raw.meta.pendingReview || 0,
    donut,
    status: raw.memory.status || [],
    domains: raw.domains || [],
    feedback: raw.feedback || { breakdown: {}, total: 0, adopted: 0, adoptionPct: 0 },
    recent: raw.recent || []
  };
}
function repoName(raw) {
  const repo = String(raw.meta.repo || "");
  const parts = repo.replace(/[\\/]+$/, "").split(/[\\/]/);
  return parts[parts.length - 1] || repo || "—";
}
function activeCount(raw) {
  const row = (raw.memory.status || []).find((item) => item.label === "active");
  return row ? row.value : 0;
}
function kpisOf(raw, data) {
  return [
    { key: "total", label: "记忆总量 Total Memory", value: num(data.total), delta: "active " + num(activeCount(raw)) + " 条", tone: "white" },
    { key: "recall", label: "区间召回 Recall", value: num(data.recallEvents), delta: "命中 " + num(data.hits) + " 条", tone: "white" },
    { key: "adoption", label: "采纳率 Adoption", value: data.adoption + "%", delta: "反馈 " + num(data.feedback.total) + " 条", tone: "white" },
    { key: "hits", label: "累计命中 Hits", value: num(data.hits), delta: "避免重复注入上下文", tone: "cyan" },
    { key: "health", label: "知识健康度 Health", value: data.health + "%", delta: "● active 占比", tone: "white" },
    { key: "pending", label: "待审 Pending", value: num(data.pending), delta: "pending_review", tone: "amber" }
  ];
}
function toneColor(tone) {
  if (tone === "cyan") return "#21D3EE";
  if (tone === "amber") return "#FBBF24";
  return "#EAF2FF";
}
function clockText() {
  return new Date().toLocaleString("zh-CN", { hour12: false });
}

function donut(segments, total) {
  const size = 116, stroke = 16;
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  let acc = 0;
  const rings = segments.map((seg) => {
    const len = c * (seg.value || 0) / 100;
    const node = `<circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${paint(seg.color)}" stroke-width="${stroke}" stroke-dasharray="${len} ${c - len}" stroke-dashoffset="${-acc}"></circle>`;
    acc += len;
    return node;
  }).join("");
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <g transform="rotate(-90 ${size / 2} ${size / 2})">
      <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="#16243D" stroke-width="${stroke}"></circle>
      ${rings}
    </g>
    <text x="50%" y="47%" text-anchor="middle" fill="#EAF2FF" font-size="22" font-weight="700" font-family="Consolas, monospace">${esc(num(total))}</text>
    <text x="50%" y="64%" text-anchor="middle" fill="#8FA3C7" font-size="11">条记忆</text>
  </svg>`;
}
function progress(label, value, color, pct, attrs) {
  const width = Math.max(0, Math.min(100, Number(pct) || 0));
  const clickable = attrs ? " link" : "";
  return `<div class="prog${clickable}" ${attrs || ""}>
    <div class="prog-top"><span class="muted">${esc(label)}</span><span class="mono">${esc(Math.round(Number(value) || 0))} · ${esc(width)}%</span></div>
    <div class="track"><i style="width:${width}%;background:${paint(color)}"></i></div>
  </div>`;
}
function areaChart(labels, recall, feedback) {
  if (!labels.length) return `<p class="empty">这个区间还没有召回或反馈。</p>`;
  const W = 820, H = 260, padX = 16, padY = 18;
  const n = labels.length;
  const maxR = Math.max(...recall, ...feedback, 1) * 1.18;
  const x = (i) => padX + (n === 1 ? (W - 2 * padX) / 2 : i * (W - 2 * padX) / (n - 1));
  const y = (v) => H - padY - v / maxR * (H - 2 * padY);
  const line = (arr) => arr.map((v, i) => `${i ? "L" : "M"} ${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(" ");
  const area = `${line(recall)} L ${x(n - 1).toFixed(1)} ${H - padY} L ${x(0).toFixed(1)} ${H - padY} Z`;
  const step = Math.max(1, Math.ceil(n / 8));
  const texts = labels.map((lb, i) => {
    if (i % step !== 0 && i !== n - 1) return "";
    return `<text x="${x(i).toFixed(1)}" y="${H - 2}" fill="#5E7196" font-size="11" text-anchor="middle">${esc(lb)}</text>`;
  }).join("");
  const grid = [0.25, 0.5, 0.75].map((g) => {
    const gy = H - padY - g * (H - 2 * padY);
    return `<line x1="${padX}" y1="${gy}" x2="${W - padX}" y2="${gy}" stroke="#16243D"></line>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" class="chart">
    <defs><linearGradient id="recallFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#21D3EE" stop-opacity="0.35"></stop>
      <stop offset="100%" stop-color="#21D3EE" stop-opacity="0"></stop>
    </linearGradient></defs>
    ${grid}
    <path d="${area}" fill="url(#recallFill)"></path>
    <path d="${line(recall)}" fill="none" stroke="#21D3EE" stroke-width="2.5"></path>
    <path d="${line(feedback)}" fill="none" stroke="#9A66F2" stroke-width="2.5" stroke-dasharray="5 4"></path>
    ${texts}
  </svg>`;
}
function bars(rows) {
  const max = Math.max(...rows.map((row) => row.value), 1);
  return `<div class="bars">${rows.map((row) => `<div class="colb">
    <div class="mono num">${esc(row.value)}</div>
    <div class="stick" style="height:${row.value / max * 100}%;background:${paint(row.color)}"></div>
    <div class="name">${esc(row.label)}</div>
  </div>`).join("")}</div>`;
}
function gauge(value) {
  const shown = Math.max(0, Math.min(100, Number(value) || 0));
  const r = 80, cx = 100, cy = 105;
  const circ = Math.PI * r;
  const len = circ * shown / 100;
  return `<svg viewBox="0 0 200 120" style="width:200px">
    <defs><linearGradient id="gaugeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#21D3EE"></stop>
      <stop offset="100%" stop-color="#34D399"></stop>
    </linearGradient></defs>
    <path d="M ${cx - r} ${cy} A ${r} ${r} 0 0 1 ${cx + r} ${cy}" fill="none" stroke="#16243D" stroke-width="14" stroke-linecap="round"></path>

async function api(path, options) {
  const resp = await fetch(path, Object.assign({ cache: "no-store" }, options || {}));
  if (!resp.ok) throw new Error(path + " → " + resp.status);
  return resp.json();
}

  Object.keys(state.checked).forEach((id) => { if (!pendingIds.has(id)) delete state.checked[id]; });
  const top = state.stack[state.stack.length - 1];
  if (top && top.kind === "doc") {
    try { top.doc = await api("/api/memory/" + top.id); } catch (err) { top.doc = null; }
  }
  render();
}

    <header>
      <div class="brand">
        <div class="mark mono">R</div>
        <div>
          <h1>RSI-BOOT · 项目记忆数据大屏</h1>
          <p class="sub">仓库 .rsi/ 里的记忆和数据，在本机被看见</p>
        </div>
      </div>
      <div class="tools">
        <div class="ranges">${RANGES.map((item) => `<button type="button" data-range="${item.key}" class="${state.range === item.key ? "on" : ""}">${item.label}</button>`).join("")}</div>
        <div class="clock">
          <div class="mono time" id="clock">${esc(clockText())}</div>
          <div class="live">● 真实 .rsi/ 快照 · 本机</div>
        </div>
      </div>
    </header>
    <div class="kpis">${kpis.map((kpi, index) => `<button class="kpi" type="button" data-kpi="${index}">
      <div class="label">${esc(kpi.label)}</div>
      <div class="mono value" style="color:${toneColor(kpi.tone)}">${esc(kpi.value)}</div>
      <div class="delta" style="color:${kpi.tone === "amber" ? "#FBBF24" : "#34D399"}">${esc(kpi.delta)}</div>
    </button>`).join("")}</div>
    <div class="board">
      <div class="col">
        ${panel("记忆类型分布 · 点行下钻", `<div class="donut-wrap">${donut(data.donut, data.total)}<div style="width:100%">${data.donut.map((row) => {
          const cat = row.label === "other 其他" ? "other" : row.label;
          return `<div class="legend-row link" data-cat="${esc(cat)}"><span class="swatch" style="background:${paint(row.color)}"></span><span class="muted grow">${esc(row.label)}</span><span class="mono">${esc(row.count)} 条 · ${esc(row.value)}%</span></div>`;
        }).join("") || `<p class="empty">还没有记忆文件。</p>`}</div></div>`)}
        ${panel("记忆状态分布 · 点行下钻", (data.status.map((row) => progress(row.label, row.value, row.color, data.total ? (row.value / data.total * 100).toFixed(1) : 0, `data-status="${esc(row.label)}"`)).join("")) || `<p class="empty">还没有记忆文件。</p>`)}
        ${panel("召回效率", `<div class="tiles g3">
          ${tile("累计命中", num(raw.meta.recallTotalHits), "#21D3EE")}
          ${tile("召回事件", num(recallAll), "#9A66F2")}
          ${tile("均次命中", avgHits, "#34D399")}
        </div><div class="spark">${last21.map((row) => `<i title="${esc(row.date)} · ${row.hits || 0}" style="height:${Math.max(6, (row.hits || 0) / maxHits * 100)}%;background:${row.hits ? "#21D3EE" : "#16243D"};opacity:.85"></i>`).join("")}</div><div class="center-note">近 21 天召回命中量分布</div>`)}
        ${panel("数据快照", `<div class="meta">
          <div class="meta-row"><span class="muted">数据源</span><span class="mono right grow" title="${esc(raw.meta.repo)}">${esc(repoName(raw))}</span></div>
          <div class="meta-row"><span class="muted">统计跨度</span><span class="mono">${esc(raw.meta.spanStart || "—")} ~ ${esc(raw.meta.spanEnd || "—")}</span></div>
          <div class="meta-row"><span class="muted">事件总数</span><span class="mono">${esc(num(raw.meta.eventTotal))} 条</span></div>
          <div class="meta-row"><span class="muted">快照生成</span><span class="mono">${esc(raw.meta.generatedAt || "")}</span></div>
          <div class="live">● 本机 · 零 API Key · 关闭工具后不可访问</div>
        </div>`)}
      </div>
      <div class="col">
        ${panel("召回 & 反馈趋势", `<div class="legend"><span><i style="background:#21D3EE"></i>召回次数</span><span><i style="background:#9A66F2"></i>反馈次数</span></div>${areaChart(data.labels, data.recallArr, data.feedbackArr)}`)}
        ${panel("反馈采纳分布", `${bars(fbRows)}<div class="tiles g3" style="margin-top:12px">
          ${tile("采纳率", data.feedback.adoptionPct + "%", "#34D399")}
          ${tile("反馈总数", num(data.feedback.total), "#21D3EE")}
          ${tile("已采纳", num(data.feedback.adopted), "#9A66F2")}
        </div>`)}
        ${panel("记忆模块 Top（按 domain）· 点行下钻", data.domains.length ? `<div class="split">${data.domains.map((row) => `<div class="prog link" data-domain="${esc(row.label)}"><div class="prog-top"><span class="muted grow">${esc(row.label)}</span><span class="mono">${esc(row.value)}</span></div><div class="track thin"><i style="width:${row.value / domainMax * 100}%;background:#21D3EE"></i></div></div>`).join("")}</div>` : `<p class="empty">记忆还没有标注 domain。</p>`)}
      </div>
      <div class="col">
        ${panel("知识健康度", `<div style="display:flex;flex-direction:column;align-items:center">${gauge(data.health)}<div class="tiles g3" style="width:100%;margin-top:8px">
          ${tile("记忆总量", num(data.total), "#34D399")}
          ${tile("active", num(activeCount(raw)), "#21D3EE")}
          ${tile("待审", num(data.pending), "#9A66F2")}
        </div></div>`)}
        ${panel("近期活动（真实事件流）", data.recent.length ? `<ul class="feed">${data.recent.map((row) => `<li${row.kind === "recall" ? ' class="link" data-feed-recalls="1" title="点我看召回命中明细"' : ""}><span style="color:${kindColor[row.kind] || "#FBBF24"}">›</span><span>${esc(row.text)}</span></li>`).join("")}</ul>` : `<p class="empty">还没有 recall / feedback 事件。</p>`)}
      </div>
    </div>
    ${state.stack.length ? modalView(raw, data, kpis) : ""}
  `;
  document.getElementById("app").innerHTML = html;
  document.querySelectorAll("[data-range]").forEach((node) => {
    node.addEventListener("click", () => {
      state.range = node.getAttribute("data-range");
      render();
    });
  });
  document.querySelectorAll("[data-kpi]").forEach((node) => {
    node.addEventListener("click", () => {
      state.stack = [{ kind: "kpi", index: Number(node.getAttribute("data-kpi")) }];
      state.notice = "";
      render();
    });
  });
  const close = document.getElementById("close");
  const mask = document.getElementById("mask");
  const back = document.getElementById("back");
  const closeAll = () => { state.stack = []; state.checked = {}; state.notice = ""; render(); };
  if (close) close.addEventListener("click", closeAll);
  if (mask) mask.addEventListener("click", (event) => {
    if (event.target === mask) closeAll();
  });
  if (back) back.addEventListener("click", () => {
    state.stack.pop();
    state.notice = "";
    render();
  });
  document.querySelectorAll("[data-day]").forEach((node) => {
    node.addEventListener("click", () => {
      const top = state.stack[state.stack.length - 1] || {};
      const vkey = top.kind === "list" ? "L:" + top.title : top.kind === "fb" ? "F:" + top.action : top.kind === "recalls" ? "R" : top.kind;
      const key = vkey + "|" + node.getAttribute("data-day");
      const day = node.closest(".tl-day");
      const caret = node.querySelector(".caret");
      if (day.classList.contains("closed")) {
        day.classList.remove("closed");
        delete state.collapsed[key];
        if (caret) caret.textContent = "▾";
      } else {
        day.classList.add("closed");
        state.collapsed[key] = 1;
        if (caret) caret.textContent = "▸";
      }
    });
  });
  const modalEl = document.querySelector(".modal");
  const toTop = document.getElementById("to-top");
  if (modalEl && toTop) {
    modalEl.addEventListener("scroll", () => {
      toTop.style.display = modalEl.scrollTop > 320 ? "block" : "none";
    });
    toTop.addEventListener("click", () => modalEl.scrollTo({ top: 0, behavior: "smooth" }));
  }
  document.querySelectorAll("[data-doc]").forEach((node) => {
    node.addEventListener("click", (event) => {
      event.stopPropagation();
      drillDoc(node.getAttribute("data-doc"));
    });
  });
  document.querySelectorAll("[data-cat]").forEach((node) => {
    node.addEventListener("click", () => {
      const cat = node.getAttribute("data-cat");
      drillList("category=" + encodeURIComponent(cat), "类型 " + cat);
    });
  });
  document.querySelectorAll("[data-status]").forEach((node) => {
    node.addEventListener("click", () => {
      const status = node.getAttribute("data-status");
      drillList("status=" + encodeURIComponent(status), "状态 " + status);
    });
  });
  document.querySelectorAll("[data-domain]").forEach((node) => {
    node.addEventListener("click", () => {
      const domain = node.getAttribute("data-domain");
      const shown = domain === "unknown" ? "未标注 domain" : domain;
      drillList("domain=" + encodeURIComponent(domain), "模块 " + shown);
    });
  });
  document.querySelectorAll("[data-fb]").forEach((node) => {
    node.addEventListener("click", () => drillFb(node.getAttribute("data-fb")));
  });
  document.querySelectorAll("[data-doc-act]").forEach((node) => {
    node.addEventListener("click", () => {
      const top = state.stack[state.stack.length - 1];
      if (top && top.kind === "doc") doReview([top.id], node.getAttribute("data-doc-act"));
    });
  });
  const drill = document.getElementById("drill-recalls");
  if (drill) drill.addEventListener("click", drillRecalls);
  document.querySelectorAll("[data-feed-recalls]").forEach((node) => {
    node.addEventListener("click", drillRecalls);
  });
  document.querySelectorAll("[data-pend]").forEach((node) => {
    node.addEventListener("change", () => {
      const id = node.getAttribute("data-pend");
      if (node.checked) state.checked[id] = 1;
      else delete state.checked[id];
      updateBatchBar();
    });
  });
  const selAll = document.getElementById("sel-all");
  const selNone = document.getElementById("sel-none");
  if (selAll) selAll.addEventListener("click", () => {
    document.querySelectorAll("[data-pend]").forEach((node) => {
      if (node.disabled) return;
      node.checked = true;
      state.checked[node.getAttribute("data-pend")] = 1;
    });
    updateBatchBar();
  });
  if (selNone) selNone.addEventListener("click", () => {
    document.querySelectorAll("[data-pend]").forEach((node) => { node.checked = false; });
    state.checked = {};
    updateBatchBar();
  });
  const batchApprove = document.getElementById("batch-approve");
  const batchReject = document.getElementById("batch-reject");
  if (batchApprove) batchApprove.addEventListener("click", () => doReview(Object.keys(state.checked), "approve"));
  if (batchReject) batchReject.addEventListener("click", () => doReview(Object.keys(state.checked), "reject"));
}

async function boot() {
  try {
    const response = await fetch("/api/snapshot", { cache: "no-store" });
    if (!response.ok) throw new Error("snapshot " + response.status);
    state.raw = await response.json();
    render();
    openFromHash();
    setInterval(() => {
      const node = document.getElementById("clock");
      if (node) node.textContent = clockText();
    }, 1000);
  } catch (err) {
    document.getElementById("app").innerHTML = `<div class="err">读不到快照。确认 rsi_web_ui 仍是 open。<br>${esc(err.message || err)}</div>`;
  }
}
function openFromHash() {
  const m = /^#view=(kpi|cat|status|domain|recalls):(.+)$/.exec(location.hash || "");
  if (!m) return;
  const [, kind, value] = m;
  if (kind === "kpi") {
    state.stack = [{ kind: "kpi", index: Number(value) }];
    render();
  } else if (kind === "recalls") {
    drillRecalls();
  } else {
    const param = kind === "cat" ? "category" : kind;
    drillList(param + "=" + encodeURIComponent(decodeURIComponent(value)), value);
  }
}
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && state.stack.length) {
    state.stack.pop();
    state.notice = "";
    render();
  }
});
boot();
</script>
</body>
</html>
