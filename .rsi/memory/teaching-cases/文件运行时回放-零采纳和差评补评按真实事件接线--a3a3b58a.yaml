title: 文件运行时回放、零采纳和差评补评按真实事件接线
content: 缺省 status 的召回可回放并解析 evidence.bucket.intent；零采纳必须已有反馈且非正向；短语未命中的配对用剩余 8 次预算做语义判定；目录行
  injected 且 surface=catalog；每周都 validate_pending；反馈在 extract_llm 下先问模型再回落规则；quality_judge
  无 embedding 仍做 accuracy，缓存未命中时用召回摘录补评；观察窗口用 all_rolls，默认热路径仍只读最近滚动文件。
