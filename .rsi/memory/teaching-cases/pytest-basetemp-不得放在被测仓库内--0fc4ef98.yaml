type: teaching_case
title: pytest basetemp 不得放在被测仓库内
content: 现象：python -m pytest tests/ --basetemp=.pytest-tmp 时 test_resolve_uses_cwd_not_parent_git
  / test_resolve_does_not_claim_user_home_rsi 失败，resolve_project_root(cwd=nested)
  返回仓库根而非临时目录。原因：basetemp 在仓库内，tmp_path 位于仓库 git 工作树之下，项目根解析向上找到仓库 .git。正确做法：basetemp
  指到仓库外（如 D:\pytest-rsi-tmp）或用默认 %TEMP%。另外本机 %TEMP%\pytest-of-AH\pytest-current 清理报
  PermissionError 会吞掉 pytest 摘要行并置 exit code=1，需把输出重定向到文件再读，或改用仓库外 basetemp 规避。
