    wrong_action: 写入侧上下文增强（附带前一 turn）使证据文本同时出现在原记忆和邻居记忆里；词面检索下两者同权，邻居自带正文偶尔反超原件——时间题要找的是事件发生的原始
      turn（日期锚点在它头上），被挤出即答错。之前的 v1 修复（剥离 context 行日期前缀）对此零效果。
