type: teaching_case
title: 时间题引用降权：查询类型条件化的 provenance 折权解决复制挤位
content: build_index 把显式标记的引用行（context:/> /引用/上下文）单独记进 quote_postings，但 postings 保持合并计数——默认
  quote_weight=1.0 时得分与旧管线逐位一致（有测试钉死）；仅当查询带 temporal 信号时按 (γ−1)×quoted_gain 回补折减。实测
  temporal 56.1→64.5（略超关增强的 64.2 上限）、single-hop 72.2 保住、聚合 60.4→62.0、MRR 0.368→0.422。关键设计：折权必须按查询类型条件化——无差别降权会把
  single-hop 打回去（gold 的关键词就住在引用行里），只有时间题里引用方才是“假朋友”。
