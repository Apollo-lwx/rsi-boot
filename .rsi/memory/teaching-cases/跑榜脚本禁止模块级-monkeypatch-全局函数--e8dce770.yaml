title: 跑榜脚本禁止模块级 monkeypatch 全局函数
content: 改为 suppress_event_log() 上下文管理器（保存原函数、yield、finally 恢复），只在各跑榜入口（recall_board.main、run_baselines._run_system、engmem/run._run_system、token_study._measure_context）的包测循环内抑制。修复后联跑
  24 passed、全量回归回到 1046 passed + 4 预存失败。教训：库里要被测试 import 的模块，性能补丁一律用上下文管理器，禁止模块级 monkeypatch。
