title: 消融定位到组件≠定位到机制：假设先行实测殿后
content: 先用便宜变体实测再下结论。v2 实测：temporal 纹丝不动 56.1，聚合 60.0→60.4、single-hop 71.8→72.7——日期污染通道对
  temporal 零贡献，真正机制是证据文本被复制进相邻记忆造成词面挤位（邻居与 gold 各含一份证据文本，BM25 下邻居偶尔反超）。v2 仍值得留（语义干净+聚合小升），残余
  temporal 缺口只能走查询时 structure-aware scoring（对复制块降权），列入 Future Work 第一条。教训：消融指到组件≠指到机制；拆机制要对每个假设通道单独出榜。
