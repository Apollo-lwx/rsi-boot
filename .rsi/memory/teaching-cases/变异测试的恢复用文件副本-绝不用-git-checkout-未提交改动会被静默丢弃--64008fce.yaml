id: 64008fce6c4e4a8ea799b3645c756314
type: teaching_case
title: 变异测试的恢复用文件副本，绝不用 git checkout——未提交改动会被静默丢弃
content: 变异前 cp 源文件到临时副本；变异后跑目标测试确认变红；从副本 cp 恢复，删除临时文件；恢复后再跑一次确认绿。变异脚本用独立 .py 文件 +
  chr(92) 拼接反斜杠，避免 shell/heredoc 多层转义陷阱；变异源串不匹配时用断言拦截，绝不让变异脚本静默通过。
