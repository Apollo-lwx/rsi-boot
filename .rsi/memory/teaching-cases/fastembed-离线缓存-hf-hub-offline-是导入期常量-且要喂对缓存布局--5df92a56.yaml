id: 5df92a56a08d47abb447ff87a89e6a18
type: teaching_case
title: fastembed 离线缓存：HF_HUB_OFFLINE 是导入期常量，且要喂对缓存布局
content: 1) huggingface_hub 的 HF_HUB_OFFLINE 常量在 import 时冻结，必须在 import fastembed 之前设置；2)
  fastembed 下载模型走两条路：HF snapshot 布局（models--org--name/snapshots/<rev>，refs/main 指向完整
  rev）和 GCS 拷贝布局（cache_dir/<模型短名>/ 直接放文件，仅 local_files_only 时兜底），手工布置任一条都要完整（含 refs/main
  指针对齐）；3) 国内网络下大文件直链走 ModelScope（4.6MB/s）替代 HF 官方与 hf-mirror（均约 55KB/s）；4) 环境探测失败要在适配器里如实
  fallback 并在 notes 标注，榜单注记按数据集分别说明 embedding 档位。
