title: 大屏聚合数字必须可下钻，滚动条跟主题同色系
content: 大屏任何出现数字的聚合行（类型/状态/domain 分布、反馈构成）都必须能点进清单、再到单条详情；主页面板与 KPI 弹窗同待遇。滚动条用 ::-webkit-scrollbar
  + scrollbar-color 统一成主题色（track 用 --track、thumb 用半透明 --cyan）。聚合行加下钻用 progress() 的
  attrs 参数注 data-*，事件绑定统一走 drillList/drillFb。
