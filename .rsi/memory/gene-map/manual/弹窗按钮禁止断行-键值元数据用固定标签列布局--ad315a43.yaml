title: 弹窗按钮禁止断行，键值元数据用固定标签列布局
content: 弹窗按钮加 white-space:nowrap+flex:none；键值元数据用 .kv 布局（标签固定 56px 宽、值左对齐可折行 overflow-wrap:anywhere），不要用
  meta-row 的左右分布；长标题 overflow-wrap:anywhere。改完 HTML 后大屏要 close+open 重开才会重新读盘（页面字节是
  start 时读入内存的）。
