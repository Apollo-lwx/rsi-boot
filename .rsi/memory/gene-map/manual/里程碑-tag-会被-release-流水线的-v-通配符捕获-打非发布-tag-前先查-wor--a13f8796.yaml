title: 里程碑 tag 会被 release 流水线的 v* 通配符捕获——打非发布 tag 前先查 workflow 触发模式
content: 里程碑 tag 避开 release 触发模式（如 gov-p0 不带 v 前缀，或 release workflow 改匹配 v[0-9]+*
  精确模式）；打 tag 前先 grep .github/workflows 的 on.push.tags。本次失败无副作用（版本闸门直接拒绝，未发布），但会在
  Actions 列表留下误导性失败记录。
