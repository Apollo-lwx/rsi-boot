title: 大屏审批写链路复用 KnowledgeService，测试断言别凭文件名假设
content: 搬家后文件名按标题 slug 化（memory_filename(title,id)），断言改用 memory_detail 回读的 path 前缀（memory/conventions/
  或 memory/archive/）；fixture 字段没写就是没有，断言打到真有该字段的条目上。另：大屏写链路（POST /api/review）不要自己造搬家逻辑，复用
  KnowledgeService.review_batch——approve→official、reject→archive 的落位规则只有一份，另补一条 kind=review、via=web_ui
  的事件日志与 rsi_knowledge_review 同口径。
