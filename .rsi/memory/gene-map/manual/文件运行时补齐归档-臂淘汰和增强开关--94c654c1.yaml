id: 94c654c141a34cbab7775d9a97868d1b
type: gene_case
title: 文件运行时补齐归档、臂淘汰和增强开关
content: 每日任务把超过 90 天的事件先写入 archive/YYYYMM.jsonl 再从活动日志删除。每周 decay_arms 之后按曝光不少于 100
  且采纳率低于 20% 停用臂，并至少保留一条活跃召回臂。generate 在 proposal_llm 打开时走 _llm_propose，并单独扫描零采纳领域提出
  knowledge remove。validate 在 auto_apply 时通过门禁后直接 approve。run_daily 在 extract_llm
  打开时先走 extract_draft，失败再回落规则式。gate_replay 在同时有模型和 embedding 时用 events.jsonl 装配 RegressionGate，否则明确警告并回落静态门禁。conflict_llm
  打开时，启发式未定性的命中最多再问模型 8 次。current_rules 返回当前注入的禁止项、技能和目录，rsi_memory rules 可读。sqlite
  Pipeline 仍不装进 serve。
