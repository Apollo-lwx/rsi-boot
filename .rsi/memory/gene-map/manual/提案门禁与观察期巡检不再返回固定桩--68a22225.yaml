title: 提案门禁与观察期巡检不再返回固定桩
content: validate 对 proposed 或中断的 validating 提案跑 StaticGate（未注入门禁时自建），通过则 approved
  并写入 gate 报告，否则 rejected。validate_pending 只扫当前 proposed，返回 validated 与 approved。patrol
  只看仍在 observe_until 内的 active 提案，用 events.jsonl 比较观察期与晋升前 7 天采纳率（正向动作为 accepted、applied、copied、referenced，与
  StatsService.adoption_rate 相同）；四舍五入到万分位后下降超过 5% 才 rollback。无反馈的窗口不回滚。若还有更晚且未掉点的
  active 提案，跳过整库快照回滚，避免误撤后者。
