title: 2026-09-10-rsi-boot-test-plan.md# 2.4 模型适配 ModelAdapter
content: '### 2.4 模型适配 ModelAdapter


  | ID | 场景 | 前置条件 | 测试步骤 | 预期结果 | 优先级 |

  |----|------|----------|----------|----------|--------|

  | ADA-01 | OpenAI 正常调用 | API Key 有效（mock） | 1. 构造 Prompt 2. 调用 generate() | 返回 ModelResponse，status=success
  | P0 |

  | ADA-02 | API 超时 | 模拟 65s 超时 | 1. 调用 generate() 2. 达到超时时间 | 抛出 TimeoutError | P0
  |

  | ADA-03 | API rate limit | 模拟 429 响应 | 1. 调用 generate() | 抛出 RateLimitError，可重试
  | P0 |

  | ADA-04 | API Key 无效 | 模拟 401 响应 | 1. 调用 generate() | 抛出 AuthError，不可重试 | P0 |

  | ADA-05 | 返回格式异常 | 模拟非 JSON 响应 | 1. 调用 generate() | 返回原始文本，标记 format=raw | P1 |

  | ADA-06 | 流式响应 SSE | 开启 stream=True | 1. 调用 generate(stream=True) | 逐 chunk 返回内容，最后返回完整响应
  | P0 |

  | ADA-07 | Fallback 切换 | 主模型失败，有 fallback | 1. generate_with_fallback() | 主模型失败后自动调用
  fallback 模型 | P1 |'
