  | v2.0 | 2026-09-10 | PO (定位重构) | 跟随 Spec/PRD/Plans v2.0 定位转向（个人本地 MCP 工具）：**删除
  #11 认证鉴权、#13 限流两条 P0 需求**（对应 Plans P1.9/P1.11 同步移除），全量 37→35 条（P0:14 / P1:10 / P2:6
