title: 2026-09-10-rsi-boot-test-perspective-v2.md# 7. 与 v0.1（初版）相比的关键变化
content: '## 7. 与 v0.1（初版）相比的关键变化


  | 维度 | v0.1（初版评估） | v0.2（本文档） | 改进说明 |

  |------|-----------------|----------------|----------|

  | 角色定位 | RSI 是"以开发者为中心" | RSI 是"通用框架 + 内置多角色" | 架构设计不再偏向特定角色 |

  | 测试意图 | 缺少测试专用意图 | test_gen / test_review / bug_analyze 等 5 个意图 | 通过角色注册机制实现 |

  | 质量评分 | 统一维度权重 | 可配置角色权重（test=accuracy 优先） | 更贴合测试关注点 |

  | 格式化 | 固定格式 | 角色感知渲染（detailed 风格） | 展示更符合测试习惯 |

  | 推广建议 | "需要 SDET 先行" | 分三步走（探路者→深耕→推广） | 降低了推广的心理门槛 |


  ---


  > **文档信息**

  > - 版本：v0.2

  > - 视角：测试工程师（作为 RSI 的日常用户）

  > - 最后更新：2026-09-10'
