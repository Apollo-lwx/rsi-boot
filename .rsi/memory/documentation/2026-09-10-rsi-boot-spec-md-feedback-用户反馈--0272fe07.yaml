title: 2026-09-10-rsi-boot-spec.md# Feedback（用户反馈）
content: "#### Feedback（用户反馈）\n\n```python\nclass FeedbackAction(str, Enum):\n   \
  \ ACCEPTED = \"accepted\"        # 完全采纳\n    MODIFIED = \"modified\"        # 修改后采纳\n\
  \    IGNORED = \"ignored\"          # 忽略\n    REJECTED = \"rejected\"        # 明确拒绝\n\
  \    COPIED = \"copied\"            # 复制了内容\n    APPLIED = \"applied\"         \
  \ # 应用了建议\n    REFERENCED = \"referenced\"    # 参考了但未直接使用（测试/PM 场景常见）\n\nclass Feedback(BaseModel):\n\
  \    feedback_token: str\n    user_id: str\n    project_id: Optional[str] = None\n\
  \    action: FeedbackAction\n    modified_content: Optional[str] = None\n    rating:\
  \ Optional[int] = Field(None, ge=1, le=5)\n    comment: Optional[str] = Field(None,\
  \ max_length=2048)\n    timestamp: datetime = Field(default_factory=utcnow)\n```"
