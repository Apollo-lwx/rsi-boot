  FTS5 |

  | 17 | 意图识别升级（few-shot 分类） | §4.2 | §3.1 意图识别 | P2.2 | |

  | 18 | 知识检索与注入（含来源标注、低置信度不注入） | §4.2, §7 约束 | §3.2 知识检索 | P1.18（M1 FTS5 版）+ P2.3（混合升级）
  | 注入门槛：cosine 相似度 >= 0.6（Phase 2 起；M1 为 FTS5 关键词子集） |

  | 19 | 用户画像基础 | §4.2 | §2.1 UserProfile 模型, §3.8 画像构建与更新 | P2.4 | 全局/项目双层（§10.4）
  |

  | 20 | 上下文增强（项目配置读取） | §4.2 | §4.1 数据流程 | P2.3 | |

  | 21 | 隐式反馈捕获 | §4.2 | §4.2 反馈处理流程（隐式行为上报协议） | P2.5 | 依赖客户端事件上报集成 |

  | 22 | 模型 fallback（同厂商型号） | §4.2 | §5.2 DataServiceProxy | P2 阶段嵌入实现 | 跨厂商 fallback
  见 #32 |

  | 23 | 配置热加载（watchfiles） | §4.2 | §2.5 配置继承链 | P1.14 | Plans 提前至 M2 实现 |

  | 24 | rsi bootstrap 项目自学习 | §4.1-M2, §9.3 存量项目自学习 | §10.9 项目自学习与初始化 | P1.17（核心扫描层）+
