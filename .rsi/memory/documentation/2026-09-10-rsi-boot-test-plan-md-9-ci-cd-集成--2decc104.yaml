title: 2026-09-10-rsi-boot-test-plan.md# 9. CI/CD 集成
content: '## 9. CI/CD 集成


  | 阶段 | 触发条件 | 运行测试 | 门禁标准 |

  |------|----------|----------|----------|

  | Pre-commit | 每次提交 | 单元测试 + lint | 全部通过 |

  | PR | 创建 PR | 单元 + 集成 | 整体行覆盖率 > 80%（PR 门禁口径） |

  | Daily | 每日凌晨 | E2E + 契约 | 全部通过 |

  | Weekly | 每周日 | 性能 + 安全 | P99 < 目标值 |

  | Release | 发布前 | 全部测试 | 全部通过 |


  ---'
