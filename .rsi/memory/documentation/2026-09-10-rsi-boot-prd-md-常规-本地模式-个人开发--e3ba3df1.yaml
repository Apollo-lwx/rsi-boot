title: 2026-09-10-rsi-boot-prd.md# 常规：本地模式（个人开发）
content: "#### 常规：本地模式（个人开发）\n\n```\n┌───────────────┐      stdio       ┌──────────────────┐\n\
  │  开发机        │ ◄──────────────► │  RSI Boot         │\n│  VS Code       │     \
  \             │  (本地进程)        │\n│  + MCP Client  │                  │  ├ .rsi/rsi.db\
  \    │\n└───────────────┘                  │  ├ 画像/知识库     │\n                 \
  \                  │  └ LLM API ◄──► 外部(HTTPS)\n                               \
  \    └──────────────────┘\n```\n\n- 安装：`pip install rsi-boot`\n- 初始化：`cd my-project\
  \ && rsi init && rsi bootstrap (强烈建议)`\n- 启动：IDE 自动拉起（手动调试用 `rsi start`）\n- 数据存储：`.rsi/`\
  \ 目录（SQLite + sqlite-vec 向量 + FTS5）\n- IDE 配置：`.vscode/mcp.json` 指向 `rsi start --stdio`"
