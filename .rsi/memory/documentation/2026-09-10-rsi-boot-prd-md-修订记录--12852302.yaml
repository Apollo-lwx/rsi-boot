title: 2026-09-10-rsi-boot-prd.md# 修订记录
content: '## 修订记录


  | 版本 | 日期 | 修订人 | 变更内容 |

  |------|------|--------|----------|

  | v2.6 | 2026-09-10 | PO (评审修复) | 响应外部评审 #1/#2：M1 纳入最小价值闭环——知识检索与 rsi_feedback 两条需求改为「M1
  轻量版 + 后续深化」分阶段交付（Plans P1.18），M1 即可演示「记得项目知识 + 收集反馈」，数据自 M1 起积累；需求总数不变（36 条） |

  | v2.5 | 2026-09-10 | PO (评审修复) | 响应外部评审 #5：§5 成功指标新增「算法组件验收基线」行（意图分类/检索/Thompson/提案门禁的量化基线，权威数值在测试计划
  §12）；需求总数不变（36 条） |

  | v2.4 | 2026-09-10 | PO (评审修复) | 响应外部评审 #3/#4：bootstrap 需求描述改为两期交付（核心扫描层 M2 + 深度信号层
  Phase 2，scanner 工作量重估 6-7d→12d）；向量存储增加后端回退策略（sqlite-vec 首选 / brute 内置回退 / FAISS
  可选，Spec §2.3）；需求总数不变（36 条） |

  | v2.3 | 2026-09-10 | PO (Skill 槽补全) | 跟随 Spec v2.3：Harness 可写面 5→6 槽，新增文件型技能槽（config/skills/，SKILL.md
  风格，借鉴 Superpowers 数据驱动技能层）；Phase 3 需求描述同步；需求总数不变（36 条） |

  | v2.2 | 2026-09-10 | PO (Genome 借鉴) | 对照 MetaRSI-v1 / RSI-Harness 开源实现对齐：Phase
  3「Harness 自我改进提案」需求扩展——Genome 式配置版本快照（晋升即快照、切换即回滚、可导出 bundle）与 rsi_review 按需生成；需求总数不变（36
  条） |

  | v2.1 | 2026-09-10 | PO (Harness-RSI) | §1 定位补充 Harness-RSI 理念溯源（MetaRSI-v1 / Self-Harness
  / AHE）；§4 Phase 3 新增「Harness 自我改进提案」需求（P2），全量 35→36 条（P0:14 / P1:10 / P2:7 / P3:5）
  |

  | v2.0 | 2026-09-10 | PO (定位重构) | **产品定位转向：从「团队 LLM 编排网关」重构为「个人本地 MCP 工具」（Superpowers
  同类：安装即用、零运维、好配置、功能全、稳定）**。§1 定位改写；§2 删除「技术团队」管理型用户；§3 场景 C 由团队统一接入改为个人多项目统一助手；§4
  MoSCoW 剔除认证鉴权与限流两条 P0（P0 16→14，全量 37→35），交互日志改 SQLite、迁移改 PRAGMA user_version、向量库改
  sqlite-vec；§5 删除吞吐量/可用性等服务端指标；§6 非功能需求去除鉴权/限流/私有化部署，改为本地零依赖；§7 约束更新（仅 stdio、数据全在本机）；§8
  竞品新增 Superpowers 对比列；§9 集成方案删除共享模式，统一为本地 stdio + CI 临时进程；§10 风险表去除 PostgreSQL/向量库运维项，改
  SQLite 可靠性风险 |

  | v1.2 | 2026-09-10 | PO (二次审阅修复) | §4.1-M2 表新增「rsi bootstrap 项目自学习」条目（P1），消除与 Plans/追溯矩阵的统计口径分歧——PRD
  §4 恢复为优先级唯一权威来源（全量 37 条：P0 16 / P1 10 / P2 6 / P3 5） |

  | v1.1 | 2026-09-10 | PO (审阅修复) | 修复审阅发现的问题：模型 fallback 明确为 Phase 2 同厂商型号/Phase
  4 跨厂商；隐式反馈指标注明客户端上报依赖；成本节省指标注明达成路径；吞吐/可用性指标注明适用共享模式；权限角色改为 admin/member/viewer 并与业务角色区分；置信度阈值与
  Spec §3.2 统一为 cosine 0.6；数据主权补充代码外发第三方 LLM 的说明；M2 日历修正为 2-4 周；修复 stdio 端口表述；反馈工具统一命名
  rsi_feedback |

  | v1.0 | 2026-09-10 | PO (版本对齐) | 统一版本号为 v1.0；PRD/Specs/Plans 文档版本对齐；新增可追溯矩阵（Traceability
  Matrix）|

  | v0.3 | 2026-09-10 | PO (评审汇总) | 新增竞品分析章节；Phase 1 拆分为 M1/M2；下调显式反馈目标至 2%；模型 fallback
  提前至 Phase 2；新增 Onboarding 流程章节；P99 延迟目标调整；业务指标添加基线定义与测量方法；新增认证鉴权、数据脱敏、限流、数据生命周期、流式响应等非功能需求；新增风险项；多角色支持（Dev/Test/PM
  内置角色）；核心场景多角色示例扩展；意图系统插件化改为 P1；新增设计原则：角色无关性；成功指标增加多角色维度 |

  | v0.2 | 2026-09-10 | 初始 | 初稿 |


