content: '### 技术指标


  | 指标 | M1 目标 | M2 目标 | Phase 2 目标 | Phase 3 目标 | Phase 4 目标 |

  |------|--------|--------|------------|------------|------------|

  | P99 延迟（不含模型调用） | < 1s | < 1s | < 1.5s（含检索） | < 2s（含学习） | < 1s（缓存优化后） |

  | 知识检索命中率 | N/A | N/A | > 80% | > 85% | > 90% |

  | 冷启动耗时 | < 3s | < 3s | < 3s | < 3s | < 3s |


  > 本地单进程 stdio 工具，无服务端吞吐量/可用性指标；稳定性以「单次请求不因内部故障失败（降级链兜底）」衡量，见 Spec §5.4。'
