title: 2026-09-10-rsi-boot-test-perspective-v2.md# 3.2 意图覆盖：基础可用，依赖后续 Phase
content: '### 3.2 意图覆盖：基础可用，依赖后续 Phase


  | 测试意图 | P1 M1 | P1 M2 | P2 | P3 | P4 |

  |----------|-------|-------|----|-----|-----|

  | test_gen | — | 基础支持 | 完善 | ✓ | ✓ |

  | test_review | — | — | ✓ | ✓ | ✓ |

  | bug_analyze | — | — | ✓ | ✓ | ✓ |

  | test_data | — | — | — | ✓ | ✓ |

  | coverage_check | — | — | — | ✓ | ✓ |


  **关键发现**：测试角色的核心能力集中在 Phase 2 之后。Phase 1 M1 测试工程师只能用通用模式。

  这意味着早期项目（前 4-5 周）测试团队的实际收益有限——但这是所有非开发角色的共性，不是设计缺陷。'
