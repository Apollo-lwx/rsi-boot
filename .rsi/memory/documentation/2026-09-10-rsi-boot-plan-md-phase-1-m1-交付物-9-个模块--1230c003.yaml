  |------|-----------|-------------|----------------|

  | 项目骨架 | pyproject.toml, __main__.py, data/sqlite.py, data/migrate.py, migrations/001_init.sql
  | §4.1-M1 基础设施 | §11 目录结构, §2.2 数据库表设计 |

  | 核心模型 | core/models.py, schemas/*.json | §4.1-M1 标准化格式 | §2.1 核心 Pydantic 模型 |

