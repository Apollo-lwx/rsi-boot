  | 轻量价值闭环 | knowledge/retriever.py（FTS5 版）, api/tools/feedback_tool.py（基础版）, cli/knowledge_command.py
  | §4.2 知识增强（M1 子集）, §4.3 学习闭环（采集先行） | §3.2 知识检索, §4.2 反馈处理流程 |'
