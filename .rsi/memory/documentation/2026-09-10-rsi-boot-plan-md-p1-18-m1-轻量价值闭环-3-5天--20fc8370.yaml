title: 2026-09-10-rsi-boot-plan.md# P1.18 M1 轻量价值闭环（3.5天）
content: '### P1.18 M1 轻量价值闭环（3.5天）


  > v2.6 评审修复（评审 #1/#2）：M1 原交付物只是「带意图识别的 LLM 代理」，且数据积累是学习闭环唯一无法用人力压缩的时间项——反馈采集若等到
  Phase 3 才上线，P3.6 落地后还需再等 4-8 周攒数据。故将闭环三个最小站点提前（每站刻意做薄），后续 Phase 在原路径上深化而非重建。


  **实现依据**：Spec §3.2 知识检索（M1 为 FTS5-only 子集）、§4.2 反馈处理流程、§7.1 rsi_feedback（P0/M1）


  | 任务 | 产出 | 工时 |

  |------|------|------|

  | FTS5 知识检索注入：knowledge_fts 表 + TopN 关键词检索 + 提示词注入点 + token 预算 | knowledge/retriever.py（FTS5
  版）、strategy/prompt_renderer.py 注入点 | 2d |

  | rsi_feedback 基础版：显式评分/评论落库（纯 insert，无异步处理） | api/tools/feedback_tool.py（基础版） |
  1d |

  | 知识种子 CLI：rsi knowledge add/list（bootstrap 在 M2，M1 手动种子） | cli/knowledge_command.py
  | 0.5d |


  **验收**：手动添加知识条目后，匹配关键词的查询提示词中包含该条目（带来源标注、受预算截断）；rsi_feedback 评分正确落库——M1 即形成「知识注入
  → 交互 → 反馈采集」最小闭环，数据自 M1 起积累


  **刻意不提前**：向量检索（sqlite-vec 依赖不进 M1）、RRF 融合（P2.3 升级）、隐式反馈（P2.5）、Thompson/知识提取/Harness-RSI（Phase
  3 深化）


  ---'
