title: 2026-09-10-rsi-boot-test-plan.md# 12.1 意图分类器
content: '### 12.1 意图分类器


  | 项 | 基线 |

  |----|------|

  | 评测集 | 每意图 ≥ 50 条标注样本（模板生成 + 人工标注 + 脱敏日志回流三来源），通用意图与角色意图分开统计 |

  | 验收指标 | 规则版（M1）Top-1 准确率 ≥ 85%；LLM 版（P2.2）Top-1 ≥ 92% 且宏 F1 ≥ 0.85 |

  | 回归门槛 | 任何变更后重跑评测集，指标不得低于上一基线 2pp；混淆矩阵归档可查 |'
