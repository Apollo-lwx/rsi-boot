title: 2026-09-10-rsi-boot-test-plan.md# 2.1 编排器 Pipeline
content: '### 2.1 编排器 Pipeline


  | ID | 场景 | 前置条件 | 测试步骤 | 预期结果 | 优先级 |

  |----|------|----------|----------|----------|--------|

  | PIPE-01 | 正常流程：5 个 Handler 依次执行 | mock LLM 可用 | 1. 发送 rsi_query 请求 | 预处理->策略->模型->后处理->日志
  按序执行，返回 RSIResponse | P0 |

  | PIPE-02 | Handler 抛出异常 | PreprocessHandler 抛异常 | 1. 发送请求 2. 模拟预处理失败 | 编排器捕获异常，返回
  error 状态响应，不继续后续 Handler | P0 |

  | PIPE-03 | Handler 超时 | ModelCallHandler 模拟 30s 延迟 | 1. 发送请求 2. Handler 超时 | 编排器中断该
  Handler，跳过后处理直接返回超时错误 | P0 |

  | PIPE-04 | Handler 链中断 | PostprocessHandler 抛异常 | 1. 发送请求 2. 后处理异常 | 日志 Handler
  仍需执行记录异常信息 | P1 |

  | PIPE-05 | 空 Handler 链 | 无注册 Handler | 1. 请求进入编排器 | 返回错误，提示无可用 Handler | P2 |

  | PIPE-06 | 并发请求下 Pipeline 隔离性 | 20 并发请求 | 1. 并发发送请求 2. 各请求不同参数 | 每个请求独立通过 Handler
  链，互不干扰 | P0 |'
