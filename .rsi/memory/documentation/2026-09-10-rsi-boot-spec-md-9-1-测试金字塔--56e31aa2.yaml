title: 2026-09-10-rsi-boot-spec.md# 9.1 测试金字塔
content: '### 9.1 测试金字塔


  | 层级 | 框架 | 目标覆盖率 | 运行频率 |

  |------|------|-----------|----------|

  | Unit | pytest | 行覆盖率 > 85% | 每次提交 |

  | Integration | pytest + pytest-asyncio | > 60% | 每次 PR |

  | E2E | pytest（子进程启动 MCP Server，stdio 直连） | 关键路径 | 每次 Release |


  > 覆盖率口径：单元测试行覆盖率 > 85%；CI 的 PR 门禁为整体行覆盖率 > 80%（含集成测试未覆盖路径）。两者口径不同，门禁以整体 80% 为准。


  > **算法验收基线**：覆盖率只验证代码正确性。RSI 特有算法组件（意图分类、混合检索、Thompson Sampling、Harness 提案门禁、画像推断）另有量化验收基线与版本化评测集（`tests/eval/`），权威数值以**测试计划
  §12** 为准；算法相关变更除覆盖率门禁外，还须通过对应算法基线的回归门槛。'
