title: 2026-09-10-implicit-assumptions-analysis.md# 六、修复状态追踪（v1.1 文档集）
content: '## 六、修复状态追踪（v1.1 文档集）


  | # | 假设 | 状态 | v1.1 修复落点 |

  |---|------|------|----------------|

  | H1 | 核心场景只覆盖开发 | ✅ 已修复 | PRD v1.1 §3 场景描述抽象化并补多角色示例 |

  | H2 | 画像偏好只有技术 | ✅ 已修复 | Spec v1.1 §2.1 `UserPreferences` 增加 `role_specific` 命名空间，支持角色扩展偏好
  |

  | H3 | 成功指标偏向代码 | ✅ 已修复 | PRD v1.1 §5 指标按角色模板化、可配置 |

  | H4 | MoSCoW 缺角色基础设施 | ✅ 已修复 | PRD v1.1 §4 增加多角色支持为 P1 基础设施需求；Plans v1.1 已排入 M2
  |

  | H5 | 意图硬编码 9 类 | ✅ 已修复 | Spec v1.1 §3.1 增加通用意图与角色意图映射说明；§3.6 角色意图表与 Plans 统一（Developer
  9 意图，含 bug_analyze / test_data / stakeholder_comm 等角色扩展） |

  | H6 | 反馈只支持采纳/拒绝 | ✅ 已修复 | Spec v1.1 §2.1 `FeedbackAction` 扩展动作集；§7.1 `rsi_feedback`
  工具说明同步扩展 |

  | H7 | 知识无角色/领域字段 | ✅ 已修复 | Spec v1.1 §2.2 `knowledge_items.role` 改为 `roles TEXT[]`；Qdrant
  payload 增加 `roles`/`domain` |

  | H8 | 质量评估偏向代码 | ✅ 已修复 | Spec v1.1 §3.5 维度改为 relevance/accuracy/actionability，rubric
  按角色配置（`config/quality_rubric.yaml`） |

  | H9 | 响应无角色感知 | ✅ 已修复 | Spec v1.1 §2.1 `ContentItem` 增加 `applicable_roles`，支持角色感知格式化（提前于原计划
  Phase 4 落地到数据模型） |

  | H10 | Phase 1 只验开发场景 | ⚠️ 部分修复 | Plans v1.1 Phase 1 验收清单已补多角色验证场景；测试计划 v1.1 的角色维度
  E2E 用例仍待补充 |


  > 结论：10 项隐含假设中 9 项已在 v1.1 文档集中闭环，H10 剩余部分（角色维度 E2E 测试用例）纳入测试计划下一迭代。'
