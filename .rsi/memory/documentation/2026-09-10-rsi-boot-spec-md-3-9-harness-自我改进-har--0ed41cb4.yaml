title: 2026-09-10-rsi-boot-spec.md# 3.9 Harness 自我改进（Harness-RSI）
content: '### 3.9 Harness 自我改进（Harness-RSI）


  RSI Boot 的「RSI」即 Recursive Self-Improvement（递归自我改进）。遵循 2026 年 Harness-RSI 路线（MetaRSI-v1
  / Self-Harness / AHE 等）：**模型权重不动，把 Harness 本身作为可写面**——用执行轨迹反馈驱动「评估 → 挖掘 → 提案 → 验证
  → 晋升」闭环。


  与 §3.3 Thompson Sampling 的分工：Thompson 在**既有策略候选**间做探索/利用；本节机制负责**创造与淘汰候选本身**（对槽位做加法/减法/修改）。§4.3
  的知识提取与策略调优是本框架在 knowledge / strategy 槽位的子集，本节为其上位框架，统一提案、验证与版本化语义。'
