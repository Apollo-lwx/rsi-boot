title: 2026-09-10-rsi-boot-spec.md# 10.4 多项目支持
content: '### 10.4 多项目支持


  **一个进程实例服务一个项目**（IDE 按项目窗口拉起，cwd 即项目根目录）：


  - 每个项目独立 `.rsi/` 数据目录：知识库、项目画像、策略配置、日志按项目隔离

  - 切换项目 = 在 IDE 打开另一个项目窗口，自动获得独立实例，无需任何手动操作

  - **全局画像跨项目共享**：`user_profiles` 中 `project_id=''''` 的全局画像记录跨项目的通用偏好（如「偏好 pytest
  风格」），各项目实例读写同一份——通过 `~/.rsi/global.db` 存放全局画像与跨项目统计，项目库只存项目域数据


  > 由此数据落点为两层：`~/.rsi/global.db`（全局画像/跨项目用量统计）与 `<project>/.rsi/rsi.db`（项目知识/日志/策略）。§2.2
  表结构两者同构，全局库仅含 user_profiles 与统计视图所需表。


  ---'
