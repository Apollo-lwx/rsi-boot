title: 2026-09-10-rsi-boot-test-plan.md# 测试金字塔
content: "### 测试金字塔\n\n```\n     /\\\n    /  \\   E2E 测试 (5%)      — stdio 子进程启动真实\
  \ MCP 调用\n   /----\\\n  /      \\ 集成测试 (20%)     — Pipeline 全链路 + 临时目录 SQLite +\
  \ mock LLM\n /--------\\\n/          \\ 单元测试 (60%)   — 各模块核心逻辑 + 算法\n\\        \
  \  / 契约测试 (10%)   — MCP 工具定义 vs 实现一致性\n \\--------/  混沌测试 (5%)    — 熔断器 / 超时 / 降级\
  \ / 容错\n```\n\n> 全部测试零外部服务依赖：SQLite 用 tmp_path 临时文件，LLM/Embedding 用 mock，可在任何 CI\
  \ 裸机运行。"
