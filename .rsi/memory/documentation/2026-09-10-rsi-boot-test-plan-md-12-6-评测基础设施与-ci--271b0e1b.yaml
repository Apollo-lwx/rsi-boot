content: '### 12.6 评测基础设施与 CI 分级


  | 级别 | 内容 | 时机 |

  |------|------|------|

  | 快速门槛 | 意图分类评测 + 门禁注入验证（< 5 min） | 每次 PR |

  | 全量评测 | 检索网格复测 + Thompson 仿真 + 画像抽样 | nightly |

  | 基线管理 | 基线数值存 `tests/eval/baselines.json`，版本化；提升基线需 PR 说明依据，禁止悄降 |'
