title: 2026-09-10-rsi-boot-prd.md# CI/CD 模式（自动化）
content: '#### CI/CD 模式（自动化）


  ```

  CI Pipeline

  ┌──────────────┐     rsi query (stdio)      ┌────────────────┐

  │  pytest      │ ◄─────────────────────────►│  RSI Boot      │

  │  lint        │    用完即销毁               │  (临时进程)     │

  │  code review │                            │  零持久化       │

  └──────────────┘                            └────────────────┘

  ```


  - 安装：`pip install rsi-boot`

  - 调用：CI 脚本通过 `rsi query` 直接调用（冷启动，无历史数据依赖）

  - 销毁：进程退出即清理'
