title: 2026-09-10-rsi-boot-spec.md# 3.1 意图识别
content: '### 3.1 意图识别


  **Phase 1 (M1): 规则版**


  基于关键词匹配 + 正则表达式，轻量无依赖，覆盖 80% 常见场景。

  M1 规则版输出的是**角色无关的通用意图**（code_review / code_gen / debug / explain / general_assist）。

  M2 起由 §3.6 的插件化意图注册接管，通用意图作为所有角色的兜底（fallback）；

  通用意图与角色意图的对应关系：code_review → review，code_gen → implement，debug / explain 同名，general_assist
  → general。


  ```python'
