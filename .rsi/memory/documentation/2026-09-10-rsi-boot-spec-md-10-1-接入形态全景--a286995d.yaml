title: 2026-09-10-rsi-boot-spec.md# 10.1 接入形态全景
content: "### 10.1 接入形态全景\n\n仅 **一种接入形态**：本地 stdio 模式，安装即用。\n\n```\n┌──────────────────────────────────────────────────────────────────────────┐\n\
  │                           应用层 (IDE / CLI)                              │\n│  ┌───────────┐\
  \  ┌───────────┐  ┌───────────┐  ┌────────────────────┐  │\n│  │ VS Code   │  │\
  \ JetBrains │  │ Cursor    │  │ 终端 (CLI)          │  │\n│  │ MCP 插件  │  │ MCP 插件\
  \   │  │ MCP 内置  │  │ rsi query \"...\"     │  │\n│  └─────┬─────┘  └─────┬─────┘\
  \  └─────┬─────┘  └──────────┬─────────┘  │\n└────────┼──────────────┼──────────────┼────────────────────┼────────────┘\n\
  \         │              │              │                    │\n         ▼     \
  \         ▼              ▼                    ▼\n   ┌──────────────────────────────────────────────────────────────┐\n\
  \   │              MCP stdio（本地进程管道，无网络监听）              │\n   │                \
  \                                              │\n   │   IDE 按项目拉起 RSI Boot 进程（cwd\
  \ = 项目根目录），           │\n   │   数据落在该项目 `.rsi/` 目录，随 IDE 会话启停                  │\n\
  \   └──────────────────────────────┬───────────────────────────────┘\n         \
  \                         │\n                                  ▼\n   ┌──────────────────────────────────────────────────────────────┐\n\
  \   │                     LLM 提供商 (HTTPS)                        │\n   │       \
  \   OpenAI / Anthropic / DeepSeek / ...                 │\n   └──────────────────────────────────────────────────────────────┘\n\
  ```\n\n---"
