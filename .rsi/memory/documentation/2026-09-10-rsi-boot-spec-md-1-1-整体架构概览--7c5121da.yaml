title: 2026-09-10-rsi-boot-spec.md# 1.1 整体架构概览
content: "### 1.1 整体架构概览\n\nRSI Boot 是**本地单用户 MCP 工具**（定位对齐 Superpowers 类插件：安装即用、零外部服务依赖）。以\
  \ MCP stdio Server 形态运行，由 IDE 按项目启动（cwd = 项目根目录），全部数据存储在项目 `.rsi/` 目录的**单文件 SQLite**\
  \ 中。无认证、无多租户、无限流——进程即用户，本地环境即信任边界。\n\n分层架构从上到下：MCP 协议层、核心编排层、模型适配层、数据层（SQLite 单文件\
  \ + 进程内结构）和学习层。\n\n```\n┌─────────────────────────────────────────────────────────────┐\n\
  │                MCP 客户端 (IDE / CLI，本地进程)               │\n│              (MCP Protocol\
  \ / JSON-RPC 2.0 over stdio)        │\n└───────────────────────────┬─────────────────────────────────┘\n\
  \                            │ stdio（本地进程间，无认证）\n┌───────────────────────────▼─────────────────────────────────┐\n\
  │                     RSI Boot (MCP Server)                     │\n│           \
  \                                                   │\n│  ┌────────────────┐  ┌────────────────┐\
  \  ┌───────────────┐  │\n│  │  预处理模块     │  │  策略引擎       │  │  后处理模块    │  │\n\
  │  │  - 意图识别    │  │  - 路由决策     │  │  - 结果解析    │  │\n│  │  - 上下文组装  │  │  - 提示词渲染\
  \   │  │  - 格式化      │  │\n│  │  - 知识检索(P2)│  │  - 模型选择     │  │  - 质量评估(P3)│  │\n\
  │  └──────┬────────┘  └──────┬─────────┘  └───────┬─────────┘  │\n│         │  \
  \                │                     │            │\n│  ┌──────▼──────────────────▼─────────────────────▼────────┐\
  \ │\n│  │               编排器 (Orchestrator)                      │ │\n│  │   - Pipeline\
  \ 流程编排   - 错误处理/重试  - 进程内熔断器  │ │\n│  │   - 超时控制   - 个人用量统计                    \
  \        │ │\n│  └──────────────────────────┬──────────────────────────────┘ │\n\
  │                              │                               │\n│  ┌───────────────────────────▼───────────────────────────┐\
  \  │\n│  │              模型适配层 (Model Adapter)                │  │\n│  │   OpenAI\
  \ | (Phase 4: Anthropic / DeepSeek / ...)      │  │\n│  │   统一接口: generate(prompt,\
  \ params) -> ModelResponse   │  │\n│  └───────────────────────────┬───────────────────────────┘\
  \  │\n└──────────────────────────────┼──────────────────────────────┘\n        \
  \                       │ HTTPS（API Key 走环境变量）\n                     ┌─────────▼─────────┐\n\
  \                     │   外部 LLM 服务    │\n                     └───────────────────┘\n\
  \n┌─────────────────────────────────────────────────────────────┐\n│         数据层（项目\
  \ .rsi/ 目录，单文件零依赖）                │\n│  ┌──────────────────────────────────────────────────────┐\
  \  │\n│  │ SQLite (rsi.db, WAL 模式)                             │  │\n│  │  - 交互日志\
  \ / 反馈      - 用户画像      - 策略配置     │  │\n│  │  - 知识条目 + sqlite-vec 向量 + FTS5 全文（同库同事务）│\
  \  │\n│  ├──────────────────────────────────────────────────────┤  │\n│  │ 进程内结构（替代\
  \ Redis，随进程生命周期）               │  │\n│  │  - TTLCache 响应/画像缓存  - asyncio.Queue 反馈队列\
  \   │  │\n│  │  - 内存熔断器状态         - 内存用量计数               │  │\n│  └──────────────────────────────────────────────────────┘\
  \  │\n└──────────────────────────┬──────────────────────────────────┘\n        \
  \                   │\n┌──────────────────────────▼──────────────────────────────────┐\n\
  │                   学习层 (Learning Layer) Phase 3+            │\n│  ┌──────────────────┐\
  \  ┌──────────────────┐                 │\n│  │ 反馈处理器        │  │ 知识提取器        │\
  \                 │\n│  │ - Feedback 消费  │  │ - 高质量交互筛选   │                 │\n\
  │  │ - 隐式信号解析    │  │ - 条目去重        │                 │\n│  │ - 画像更新        │  │\
  \ - 人工确认队列    │                 │\n│  └────────┬─────────┘  └────────┬─────────┘\
  \                 │\n│           │                     │                       \
  \    │\n│  ┌────────▼─────────────────────▼─────────┐                 │\n│  │  \
  \      策略优化器                         │                 │\n│  │  - Thompson Sampling\
  \ A/B 测试            │                 │\n│  │  - 采纳率统计                         \
  \   │                 │\n│  │  - 策略权重自动调整                       │              \
  \   │\n│  └──────────────────────────────────────────┘                 │\n└─────────────────────────────────────────────────────────────┘\n\
  ```\n\n**关键架构决策（v2.0 定位修正）**：\n\n| 决策 | 结论 | 理由 |\n|------|------|------|\n| 运行形态\
  \ | 仅 stdio 本地模式 | 工具/插件定位，安装即用；不提供 HTTP 共享服务 |\n| 存储 | SQLite 单文件（WAL）+ sqlite-vec\
  \ + FTS5 | 零外部服务；向量/全文/关系数据同库同事务，无双写一致性问题 |\n| 缓存/队列/熔断状态 | 进程内（TTLCache / asyncio.Queue\
  \ / 内存 dict） | 单用户单进程，无需 Redis |\n| 认证/多租户/限流 | 无 | 本地进程即信任边界；单用户无需限流（用量自我约束走 §6\
  \ 预算） |\n| 用户标识 | `user_id` 默认取 `git config user.email`，缺失时为 `local` | 画像只服务本人，标识仅用于数据归集\
  \ |\n\n---"
