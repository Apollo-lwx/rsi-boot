title: 2026-09-10-rsi-boot-prd.md# 9.1 集成形态：三层模型
content: "### 9.1 集成形态：三层模型\n\n```\n┌──────────────────────────────────────────────────────────────────┐\n\
  │  第一层：项目级配置 (rsi-boot.yaml)                              │\n│  存在位置：项目根目录，可纳入版本控制\
  \ (git-tracked)                │\n│  职责：声明项目特征、默认角色、知识库来源、策略覆盖                 │\n\
  │  生命周期：与项目同生命周期                                        │\n└──────────────────────────────────────────────────────────────────┘\n\
  \         │  rsi init 自动生成，人工可编辑\n         ▼\n┌──────────────────────────────────────────────────────────────────┐\n\
  │  第二层：进程级服务 (rsi start --stdio)                          │\n│  存在位置：开发机，由 IDE 按项目拉起的独立进程（cwd=项目根目录）\
  \    │\n│  职责：MCP Server 核心——加载配置、连接模型 API、维护知识库、记录日志 │\n│  生命周期：随 IDE 项目窗口启停  \
  \                                   │\n│  传输：stdio（本地管道，无网络端口）                 \
  \              │\n└──────────────────────────────────────────────────────────────────┘\n\
  \         │  IDE 通过 MCP 协议连接（stdio）\n         ▼\n┌──────────────────────────────────────────────────────────────────┐\n\
  │  第三层：IDE/CLI 级工具 (MCP Client)                             │\n│  存在位置：VS Code /\
  \ JetBrains / Cursor / 终端 CLI                │\n│  职责：用户交互界面——发起查询、接收响应、提交反馈   \
  \                 │\n│  配置：.vscode/mcp.json 或 JetBrains MCP 插件设置               \
  \   │\n└──────────────────────────────────────────────────────────────────┘\n```\n\
  \n**一句话总结**：\n- **项目里**放一个 YAML 配置（可选）→ 告诉 RSI 这个项目是谁\n- **IDE 里**配一次 MCP Server\
  \ → 每个项目窗口自动拉起独立进程\n- **数据**落在项目 `.rsi/` 目录 → 删目录即彻底卸载项目数据"
