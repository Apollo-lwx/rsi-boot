title: 2026-09-10-rsi-boot-test-plan.md# 2.8 数据脱敏 Sanitizer
content: '### 2.8 数据脱敏 Sanitizer


  | ID | 场景 | 前置条件 | 测试步骤 | 预期结果 | 优先级 |

  |----|------|----------|----------|----------|--------|

  | SAN-01 | API Key 脱敏 | raw_input 含 "sk-..." | 1. 发送含 API Key 的请求 2. 检查日志 | 日志中
  API Key 被替换为 sk-**** | P1 |

  | SAN-02 | 嵌套 JSON 脱敏 | 内容含嵌套敏感字段 | 1. 发送含嵌套敏感数据的请求 | 所有敏感字段均被脱敏 | P1 |

  | SAN-03 | 非敏感内容保持 | 正常代码输入 | 1. 发送纯代码请求 | 日志内容不变 | P1 |

  | SAN-04 | 脱敏性能影响 | 大量数据 | 1. 发送大请求 2. 测量处理时间 | 脱敏耗时 < 5ms（Spec §8.1 性能预算） | P2
  |

  | SAN-05 | 外发 LLM 前扫描 | prompt 组装后含密钥模式 | 1. 构造含密钥的知识条目并触发注入 | 外发 prompt 中密钥已脱敏（§8.1
  双时机） | P0 |

  | SAN-06 | 十条正则全覆盖 | 构造命中每条 MASKING_RULES 的样本 | 1. 逐条执行扫描 | email/ipv4/openai_key/aws_akid/github_token/slack_token/jwt/private_key/password_field/internal_ip
  全部命中且替换正确 | P1 |'
