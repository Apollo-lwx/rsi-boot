title: 2026-09-10-rsi-boot-spec.md# 6.2 预算控制（可选）
content: '### 6.2 预算控制（可选）


  - 每日 Token 上限：`rsi-boot.yaml` 配置 `budget.daily_token_cap`（默认不开启）；超限后当日后续请求返回降级提示（含当日已用量），不强制阻断——再次调用时客户端可带
  `preferences.force=true` 覆盖

  - 意图级成本倾向：code_gen 可用高价模型，general_assist 仅允许低价模型（策略路由规则体现，非硬限制）


  **实现细节**：


  - **用量计数**：直接查 SQLite——`SELECT COALESCE(SUM(total_tokens),0) FROM interaction_logs
  WHERE created_at >= 当日 00:00 UTC`；`created_at` 有索引（§2.2），个人量级下毫秒级，无需额外计数器

  - **检查时机**：策略选择**之前**做检查（当日累计 + 该 intent 近 7 天平均 token 预估），预估超限即返回降级提示，而非事后发现

  - **提醒**：用量达上限 80% 时在响应 `metadata.budget_warning` 中附带提示（客户端可选择性展示）'
