title: 2026-09-10-rsi-boot-prd.md# 业务指标
content: '### 业务指标


  | 指标 | 说明 | 测量方法 | 基线 | Phase 3 目标 |

  |------|------|----------|------|------------|

  | 采纳率 | 用户采纳 AI 建议的比例 | 采纳操作数 / 总建议数 × 100% | 需基线测量（预估 30%） | > 60% |

  | 显式反馈覆盖率 | 用户主动提交评分的请求占比 | 有 Feedback 的请求数 / 总请求数 × 100% | N/A | > 2%（从 10% 下调，主推隐式）
  |

  | 隐式信号覆盖率 | 捕获到采纳/修改/复制行为的请求占比 | 有隐式信号的请求数 / 总请求数 × 100% | 预估 20% | > 80%（从 40%
  上调；依赖客户端行为上报集成，无客户端集成时该指标不适用，仅统计显式反馈） |

  | 知识库利用率 | 检索到知识的请求占比 | 有知识注入的请求数 / 总请求数 × 100% | N/A | > 50% |

  | 成本节省 | 相对无路由直连单一高价模型的成本降低比例 | （直连成本 - 实际成本）/ 直连成本 × 100% | 需基线测量 | > 30%（Phase
  2-3 依赖同厂商型号 fallback 与意图级成本倾向达成；Phase 4 成本路由上线后进一步提升） |

  | 隐式反馈准确率 | 隐式信号与用户真实意图一致的比例 | 抽样人工验证 | N/A | > 85% |

  | 算法组件验收基线 | 意图分类 Top-1 ≥85%（规则版）/≥92%（LLM 版）；检索 Recall@5 ≥80%；Thompson 仿真 1000
  轮最优臂选择 ≥90%；提案门禁注入拦截率 100% | tests/eval/ 版本化评测集 + CI 分级 | N/A | 全部达标（详见测试计划 §12）
  |


  ---'
