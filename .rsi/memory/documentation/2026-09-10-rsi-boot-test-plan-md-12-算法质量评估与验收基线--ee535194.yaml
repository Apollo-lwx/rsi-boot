title: 2026-09-10-rsi-boot-test-plan.md# 12. 算法质量评估与验收基线（RSI 特有）
content: '## 12. 算法质量评估与验收基线（RSI 特有）


  > 传统软件测试（单元/集成/契约）验证「代码正确性」，本节验证「算法有效性」——RSI 特有组件必须有**量化基线 + 版本化评测集 + 统计方法**，不接受「跑通即验收」。评测代码位于
  `tests/eval/`，数据集位于 `tests/eval/datasets/`（JSONL + 标注规范 README，随仓库版本化），报告归档 `tests/eval/reports/`。'
